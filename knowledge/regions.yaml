    doi: 10.1038/nature18933
    year: 2016
    verified: false
  notes: Atlas correspondence approximate. Functionally defined; HCP-MMP FFC is the 'fusiform face complex'; right-lateralised.
- id: BR.OFA
  en: occipital face area
  zh: 枕叶面孔区（枕下回）
  definition: Face-selective region in the lateral inferior occipital gyrus, posterior to the fusiform face area.
  parent: BR.visual_cortex
  atlas_refs:
    brodmann:
    - BA19
    aal3:
    - Occipital_Inf_L
    - Occipital_Inf_R
    hcp_mmp1:
    - PIT
  coordinate_space: MNI152
  sources:
  - citation: Rolls ET, Huang CC, Lin CP, Feng J, Joliot M. Automated anatomical labelling atlas 3. NeuroImage. 2020;206:116189.
    doi: 10.1016/j.neuroimage.2019.116189
    year: 2020
    verified: false
  - citation: Glasser MF, Coalson TS, Robinson EC, et al. A multi-modal parcellation of human cerebral cortex. Nature. 2016;536(7615):171-178.
    doi: 10.1038/nature18933
    year: 2016
    verified: false
  - citation: Pitcher D, Walsh V, Duchaine B. The role of the occipital face area in the cortical face perception network.
      Exp Brain Res. 2011;209(4):481-493.
    doi: 10.1007/s00221-011-2579-1
    year: 2011
    verified: false
  notes: Atlas correspondence approximate. Functionally defined (faces > objects) in the lateral inferior occipital gyrus,
    right-lateralised; overlaps the posterior part of BR.LOC. HCP-MMP PIT is a low-confidence match; localisation reviewed
    by Pitcher et al. 2011.
