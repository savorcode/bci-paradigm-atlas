# Brain regions / 脑区 (knowledge layer, sprint 4). atlas_refs give approximate correspondences to Brodmann,
# AAL3 (Rolls et al. 2020) and HCP-MMP1.0 (Glasser et al. 2016) labels in MNI152 space.
# 图谱对应关系为近似，粒度与置信度见 curation/work/sprint4/vocab_regions/mapping.csv。
schema_version: '0.2'
prefix: BR
terms:
- id: BR.V1
  en: primary visual cortex (V1)
  zh: 初级视皮层
  definition: Primary visual cortex in the calcarine sulcus of the occipital lobe, the first cortical stage of visual processing.
  parent: BR.visual_cortex
  atlas_refs:
    brodmann:
    - BA17
    aal3:
    - Calcarine_L
    - Calcarine_R
    hcp_mmp1:
    - V1
  coordinate_space: MNI152
  sources:
  - citation: Rolls ET, Huang CC, Lin CP, Feng J, Joliot M. Automated anatomical labelling atlas 3. NeuroImage. 2020;206:116189.
    doi: 10.1016/j.neuroimage.2019.116189
    year: 2020
    verified: false
  - citation: Glasser MF, Coalson TS, Robinson EC, et al. A multi-modal parcellation of human cerebral cortex. Nature. 2016;536(7615):171-178.
    doi: 10.1038/nature18933
    year: 2016
    verified: false
  notes: Atlas correspondence approximate. AAL3 Calcarine also contains some V2 at the sulcal banks.
- id: BR.extrastriate
  en: extrastriate visual cortex (V2–V4)
  zh: 纹外视皮层
  definition: Occipital visual areas V2 to V4 surrounding V1 that carry early and intermediate visual processing.
