- id: BR.preSMA
  en: pre-supplementary motor area
  zh: 前辅助运动区
  definition: Medial frontal area rostral to the SMA (anterior to the vertical line through the anterior commissure), involved
    in action selection and inhibition.
  parent: BR.frontal_cortex
  atlas_refs:
    brodmann:
