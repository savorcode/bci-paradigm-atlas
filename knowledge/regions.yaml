- id: BR.FFA
  en: fusiform face area
  zh: 梭状回面孔区
  definition: Face-selective region of the mid-lateral fusiform gyrus, typically larger in the right hemisphere.
  parent: BR.visual_cortex
  atlas_refs:
    brodmann:
    - BA37
    aal3:
