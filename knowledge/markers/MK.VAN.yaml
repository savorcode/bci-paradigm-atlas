type: erp_component
recording_modality:
- EEG
- MEG
signature:
  latency_ms: ~150-300
  polarity: negative
  topography: posterior (occipito-temporal)
description:
  en: Posterior negativity in the difference between consciously perceived and unperceived visual stimuli, proposed as an
    early electrophysiological correlate of visual awareness.
  zh: 有意识知觉与未被知觉的视觉刺激之间差异波中的后部负波，被认为是视觉觉知的早期电生理相关物。
