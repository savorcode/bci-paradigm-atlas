schema_version: "0.2"
id: MK.sleep_spindle
name:
  en: Sleep spindle
  zh: 睡眠纺锤波
aliases:
- spindle
- sigma activity
type: oscillatory
recording_modality:
- EEG
signature:
  frequency_hz: approximately 11-16
  topography: slow spindles frontal, fast spindles centro-parietal
description:
  en: >-
    Waxing-and-waning bursts of sigma-band activity lasting about half a second to two seconds, characteristic of
    non-REM sleep stage N2 and also present in slow-wave sleep. Spindles are generated by thalamocortical circuits
    and their density and coupling with slow oscillations are related to memory consolidation.
  zh: 持续约 0.5–2 秒、幅度先增后减的 σ 频段活动爆发，是非快速眼动睡眠 N2 期的特征，也见于慢波睡眠。纺锤波由丘脑—皮层回路产生，其密度及与慢振荡的耦合与记忆巩固有关。
notes: >-
  First-pass skeleton (curator_d, 2026-10-03). Signature values are textbook-level approximations that await source
  checking; generators and indexes will be added in the second pass.
status: draft
contributors:
- maintainer
- curator_d
