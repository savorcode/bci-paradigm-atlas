schema_version: '0.2'
id: MK.sleep_spindle
name:
  en: Sleep spindle
  zh: 睡眠纺锤波
aliases:
- spindle
- sigma activity
type: oscillatory
recording_modality:
- EEG
signature:
  frequency_hz: approximately 11-16
  topography: slow spindles frontal, fast spindles centro-parietal
description:
  en: Waxing-and-waning bursts of sigma-band activity lasting about half a second to two seconds, characteristic of non-REM
    sleep stage N2 and also present in slow-wave sleep. Spindles are generated by thalamocortical circuits and their density
    and coupling with slow oscillations are related to memory consolidation.
  zh: 持续约 0.5–2 秒、幅度先增后减的 σ 频段活动爆发，是非快速眼动睡眠 N2 期的特征，也见于慢波睡眠。纺锤波由丘脑—皮层回路产生，其密度及与慢振荡的耦合与记忆巩固有关。
generators:
- region: BR.thalamus
  evidence: A
  sources:
  - citation: Steriade M, McCormick DA, Sejnowski TJ. Thalamocortical oscillations in the sleeping and aroused brain. Science.
      1993;262(5134):679-685.
    doi: 10.1126/science.8235588
    year: 1993
    verified: false
  - citation: Schabus M, Dang-Vu TT, Albouy G, et al. Hemodynamic cerebral correlates of sleep spindles during human non-rapid
      eye movement sleep. Proc Natl Acad Sci U S A. 2007;104(32):13164-13169.
    doi: 10.1073/pnas.0703084104
    year: 2007
    verified: false
  - citation: 'Fernandez LMJ, Lüthi A. Sleep spindles: mechanisms and functions. Physiol Rev. 2020;100(2):805-868.'
    doi: 10.1152/physrev.00042.2018
    year: 2020
    verified: false
  note: 'method: EEG-fMRI; intracranial (animal); thalamic reticular-thalamocortical pacemaking shown in animal intracellular
    work and thalamic BOLD increases time-locked to human spindles.'
- region: BR.frontal_cortex
  evidence: B
  sources:
  - citation: 'Andrillon T, Nir Y, Staba RJ, et al. Sleep spindles in humans: insights from intracranial EEG and unit recordings.
      J Neurosci. 2011;31(49):17821-17834.'
    doi: 10.1523/JNEUROSCI.2604-11.2011
    year: 2011
    verified: false
  - citation: Schabus M, Dang-Vu TT, Albouy G, et al. Hemodynamic cerebral correlates of sleep spindles during human non-rapid
      eye movement sleep. Proc Natl Acad Sci U S A. 2007;104(32):13164-13169.
    doi: 10.1073/pnas.0703084104
    year: 2007
    verified: false
  note: 'method: intracranial; slow (9-12 Hz) spindles predominate frontally in human depth recordings; superior frontal BOLD
    with slow spindles.'
- region: BR.parietal_cortex
  evidence: C
  sources:
  - citation: 'Andrillon T, Nir Y, Staba RJ, et al. Sleep spindles in humans: insights from intracranial EEG and unit recordings.
      J Neurosci. 2011;31(49):17821-17834.'
    doi: 10.1523/JNEUROSCI.2604-11.2011
    year: 2011
    verified: false
  note: 'method: intracranial; fast (13-15 Hz) spindles predominate over centro-parietal cortex.'
indexes:
- construct: CN.memory_consolidation
  relation: spindle density/activity is positively associated with overnight memory retention
  evidence: A
  sources:
  - citation: 'Kumral D, Matzerath A, Leonhart R, et al. Spindle-dependent memory consolidation in healthy adults: a meta-analysis.
      Neuropsychologia. 2023;189:108661.'
    doi: 10.1016/j.neuropsychologia.2023.108661
    year: 2023
    verified: false
  - citation: 'Fernandez LMJ, Lüthi A. Sleep spindles: mechanisms and functions. Physiol Rev. 2020;100(2):805-868.'
    doi: 10.1152/physrev.00042.2018
    year: 2020
    verified: false
  note: Meta-analysis; effect size and moderators to be checked against full text.
- construct: CN.sleep
  relation: spindles mark NREM stage N2 and become less frequent in deeper NREM sleep
  evidence: B
  sources:
  - citation: 'Fernandez LMJ, Lüthi A. Sleep spindles: mechanisms and functions. Physiol Rev. 2020;100(2):805-868.'
    doi: 10.1152/physrev.00042.2018
    year: 2020
    verified: false
  - citation: 'Andrillon T, Nir Y, Staba RJ, et al. Sleep spindles in humans: insights from intracranial EEG and unit recordings.
      J Neurosci. 2011;31(49):17821-17834.'
    doi: 10.1523/JNEUROSCI.2604-11.2011
    year: 2011
    verified: false
