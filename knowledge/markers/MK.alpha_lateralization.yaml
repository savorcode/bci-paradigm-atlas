schema_version: '0.2'
id: MK.alpha_lateralization
name:
  en: Posterior alpha lateralization
  zh: 后部 α 偏侧化
aliases:
- alpha lateralization index
- hemispheric alpha asymmetry (attention)
type: oscillatory
recording_modality:
- EEG
- MEG
signature:
  frequency_hz: 8-13
  topography: parieto-occipital, contralateral vs ipsilateral to attended side
description:
  en: Relative decrease of posterior alpha power over the hemisphere contralateral to the attended hemifield (or memorised
    item) and relative increase ipsilaterally, during anticipatory covert attention or retro-cueing.
  zh: 在预期性隐蔽注意或回溯线索期间，被注意视野（或被记忆项目）对侧半球后部 α 功率相对降低、同侧半球相对升高。
notes: 'First-pass skeleton by package A (2026-10-03). No generators/indexes yet. Signature values are textbook-level approximations
  and await source checking. Sprint 5 (2026-10-14, curator F): generators and indexes curated; every DOI checked against its
  Crossref or OpenAlex record (see curation/work/sprint5/markers_F/); verified: false pending full-text check.'
generators:
- region: BR.visual_cortex
  evidence: B
  sources:
  - citation: Thut G, Nietzel A, Brandt SA, et al. Alpha-band electroencephalographic activity over occipital cortex indexes
      visuospatial attention bias and predicts visual target detection. J Neurosci. 2006;26(37):9494-9502.
    doi: 10.1523/JNEUROSCI.0875-06.2006
    year: 2006
    verified: false
  - citation: Siegel M, Donner TH, Oostenveld R, et al. Neuronal synchronization along the dorsal visual pathway reflects
      the focus of spatial attention. Neuron. 2008;60(4):709-719.
    doi: 10.1016/j.neuron.2008.09.010
    year: 2008
    verified: false
  note: 'method: MEG/EEG source; source estimates place the attention-related alpha modulation in occipital/parieto-occipital
    visual cortex (Thut et al. 2006 EEG source imaging; Siegel et al. 2008 MEG beamforming along the dorsal visual pathway).'
- region: BR.parietal_cortex
  evidence: C
  sources:
  - citation: Siegel M, Donner TH, Oostenveld R, et al. Neuronal synchronization along the dorsal visual pathway reflects
      the focus of spatial attention. Neuron. 2008;60(4):709-719.
    doi: 10.1016/j.neuron.2008.09.010
    year: 2008
    verified: false
  note: 'method: MEG/EEG source; MEG beamformer sources of lateralized alpha/beta suppression extend into posterior parietal
    cortex (Siegel et al. 2008); single study.'
indexes:
- construct: CN.spatial_attention
  evidence: B
  relation: alpha power decreases contralateral and increases ipsilateral to the covertly attended hemifield; lateralization
    index predicts target detection
  sources:
  - citation: Worden MS, Foxe JJ, Wang N, et al. Anticipatory biasing of visuospatial attention indexed by retinotopically
      specific alpha-band electroencephalography increases over occipital cortex. J Neurosci. 2000;20(6):RC63.
    doi: 10.1523/JNEUROSCI.20-06-j0002.2000
    year: 2000
    verified: false
  - citation: Thut G, Nietzel A, Brandt SA, et al. Alpha-band electroencephalographic activity over occipital cortex indexes
      visuospatial attention bias and predicts visual target detection. J Neurosci. 2006;26(37):9494-9502.
    doi: 10.1523/JNEUROSCI.0875-06.2006
    year: 2006
    verified: false
  - citation: Siegel M, Donner TH, Oostenveld R, et al. Neuronal synchronization along the dorsal visual pathway reflects
      the focus of spatial attention. Neuron. 2008;60(4):709-719.
    doi: 10.1016/j.neuron.2008.09.010
    year: 2008
    verified: false
- construct: CN.distractor_suppression
  evidence: B
  relation: ipsilateral alpha increase reflects active inhibition of the unattended / distractor location
  sources:
  - citation: 'Jensen O, Mazaheri A. Shaping functional architecture by oscillatory alpha activity: gating by inhibition.
      Front Hum Neurosci. 2010;4:186.'
    doi: 10.3389/fnhum.2010.00186
    year: 2010
    verified: false
  - citation: Wöstmann M, Alavash M, Obleser J. Alpha oscillations in the human brain implement distractor suppression independent
      of target selection. J Neurosci. 2019;39(49):9797-9805.
    doi: 10.1523/JNEUROSCI.1954-19.2019
    year: 2019
    verified: false
  note: Jensen & Mazaheri 2010 is a theoretical framework; Wöstmann et al. 2019 is the direct test.
- construct: CN.working_memory
  evidence: C
  relation: alpha lateralization during retention scales with visual short-term memory load and capacity
  sources:
  - citation: Sauseng P, Klimesch W, Heise KF, et al. Brain oscillatory substrates of visual short-term memory capacity. Curr
      Biol. 2009;19(21):1846-1852.
    doi: 10.1016/j.cub.2009.08.062
    year: 2009
    verified: false
- construct: CN.intent_selection
  evidence: C
  relation: covert attention shifts left/right can be decoded from alpha lateralization for BCI control
  sources:
  - citation: Treder MS, Bahramisharif A, Schmidt NM, et al. Brain-computer interfacing using modulations of alpha activity
      induced by covert shifts of attention. J Neuroeng Rehabil. 2011;8(1):24.
    doi: 10.1186/1743-0003-8-24
    year: 2011
    verified: false
status: draft
contributors:
- curator_a
