schema_version: '0.2'
id: MK.P2_auditory
name:
  en: Auditory P2 (P200)
  zh: 听觉 P2（P200）
aliases:
- P2
- P200
- P2m
- auditory P2
type: erp_component
recording_modality:
- EEG
- MEG
signature:
  latency_ms: ~150-250
  polarity: positive
  topography: fronto-central (vertex)
description:
  en: Positive component of the long-latency auditory evoked potential following the N1, with a fronto-central distribution;
    it is modulated by training and by emotional prosody.
  zh: 长潜伏期听觉诱发电位中紧随 N1 的正成分，呈额中央分布；受训练和情绪韵律调制。
generators:
- region: BR.STG
  evidence: B
  sources:
  - citation: 'Crowley KE, Colrain IM. A review of the evidence for P2 being an independent component process: age, sleep
      and modality. Clin Neurophysiol. 2004;115(4):732-744.'
    doi: 10.1016/j.clinph.2003.11.021
    year: 2004
    verified: false
  - citation: 'Tremblay KL, Kraus N, McGee T, et al. Central auditory plasticity: changes in the N1-P2 complex after speech-sound
      training. Ear Hear. 2001;22(2):79-90.'
    doi: 10.1097/00003446-200104000-00001
    year: 2001
    verified: false
  note: 'method: MEG/EEG source; P2/P2m sources lie in auditory association cortex of the supratemporal plane, anterior to
    the N1m source (reviewed in Crowley & Colrain 2004); fronto-central scalp maximum (Tremblay 2001).'
indexes:
- construct: CN.early_auditory
  evidence: B
  relation: amplitude varies with stimulus properties, age and arousal state independently of N1
  sources:
  - citation: 'Crowley KE, Colrain IM. A review of the evidence for P2 being an independent component process: age, sleep
      and modality. Clin Neurophysiol. 2004;115(4):732-744.'
    doi: 10.1016/j.clinph.2003.11.021
    year: 2004
    verified: false
- construct: CN.perceptual_learning
  evidence: C
  relation: amplitude increases after speech-sound discrimination training
  sources:
  - citation: 'Tremblay KL, Kraus N, McGee T, et al. Central auditory plasticity: changes in the N1-P2 complex after speech-sound
      training. Ear Hear. 2001;22(2):79-90.'
    doi: 10.1097/00003446-200104000-00001
    year: 2001
    verified: false
  note: Training-related plasticity after speech-sound discrimination training; re-mapped from CN.phonological_processing
    in sprint 5 (D-076).
notes: 'First-pass skeleton by package A (2026-10-03). Signature values are textbook-level approximations and await source
  checking. Sprint 4 (2026-10-12, curator_a): generators and indexes curated; every DOI checked against its Crossref or OpenAlex
  record (see curation/work/sprint4/markers_A/); verified: false pending full-text check.'
status: draft
contributors:
- curator_a
