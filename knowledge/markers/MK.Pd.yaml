schema_version: "0.2"
id: MK.Pd
name:
  en: Distractor positivity
  zh: 干扰正波
aliases:
- Pd
- distractor positivity
type: erp_component
recording_modality:
- EEG
signature:
  latency_ms: ~100-300
  polarity: positive (contralateral minus ipsilateral)
  topography: posterior, e.g. PO7/PO8
description:
  en: Positivity over posterior sites contralateral to a lateralised distractor, interpreted as an index of active suppression
    of the distractor.
  zh: 偏侧干扰项对侧后部电极出现的正波，被解释为主动抑制干扰项的指标。
notes: First-pass skeleton by package A (2026-10-03). No generators/indexes yet. Signature values are textbook-level approximations
  and await source checking. New marker requested by package A (curation/work/pkg_A/marker_requests.csv); not yet in curation/registry/markers.csv.
status: draft
contributors:
- curator_a
