schema_version: '0.2'
id: MK.startle_blink
name:
  en: Startle eyeblink reflex magnitude (affective modulation)
  zh: 惊跳眨眼反射幅度（情绪调制）
aliases:
- startle blink
- startle eyeblink
- acoustic startle reflex
- affect-modulated startle
- fear-potentiated startle
- prepulse inhibition (PPI)
type: peripheral_physiology
recording_modality:
- other
signature:
  latency_ms: onset ~20-120, peak within ~150 after probe onset
  polarity: not applicable (rectified and integrated EMG magnitude)
  topography: orbicularis oculi EMG, electrodes below the lower eyelid
description:
  en: Magnitude of the eyeblink component of the startle reflex to a sudden intense probe (typically a brief white-noise
    burst), recorded from the orbicularis oculi EMG. The reflex itself is mediated by a short brainstem circuit; its magnitude
    is potentiated during unpleasant foregrounds and threat, attenuated during pleasant foregrounds, and inhibited by a weak
    prepulse shortly before the probe. It is a peripheral reflex measure, not a cortical signal, and enters the registry
    because it is the primary dependent measure of affect-modulated startle paradigms.
  zh: 由突然的强探测刺激（通常为短促白噪声）诱发的惊跳反射中眨眼成分的幅度，以眼轮匝肌肌电记录。反射本身由短的脑干通路介导；其幅度在不愉快前景和威胁情境下增强、在愉快前景下减弱，并在探测刺激前不久出现弱前脉冲时受到抑制。它是外周反射指标而非皮层信号，因是情绪调制惊跳范式的主要因变量而收入登记表。
generators:
- region: BR.amygdala
  evidence: B
  relation: affective (valence and fear) modulation of blink magnitude is lost or reduced after amygdala / anteromedial temporal
    lesions; the baseline reflex remains
  sources:
  - citation: Angrilli A, Mauri A, Palomba D, et al. Startle reflex and emotion modulation impairment after a right amygdala
      lesion. Brain. 1996;119(6):1991-2004.
    doi: 10.1093/brain/119.6.1991
    year: 1996
    verified: false
  - citation: Buchanan TW, Tranel D, Adolphs R. Anteromedial temporal lobe damage blocks startle modulation by fear and disgust.
      Behav Neurosci. 2004;118(2):429-437.
    doi: 10.1037/0735-7044.118.2.429
    year: 2004
    verified: false
  note: 'method: lesion; two independent lesion studies (single case with right amygdala lesion; group with anteromedial
    temporal damage). The reflex is generated by the brainstem startle circuit (cochlear root neurons, caudal pontine reticular
    nucleus, facial motor nucleus), for which the region vocabulary has no id; BR.amygdala is entered only for the affective
    modulation of the reflex, not as its generator in the strict sense. No region id was invented.'
indexes:
- construct: CN.emotional_state
  evidence: B
  relation: blink magnitude is larger during unpleasant and smaller during pleasant than during neutral foregrounds (valence
    modulation)
  sources:
  - citation: 'Vrana SR, Spence EL, Lang PJ. The startle probe response: a new measure of emotion? J Abnorm Psychol. 1988;97(4):487-491.'
    doi: 10.1037/0021-843x.97.4.487
    year: 1988
    verified: false
  - citation: Lang PJ, Bradley MM, Cuthbert BN. Emotion, attention, and the startle reflex. Psychol Rev. 1990;97(3):377-395.
    doi: 10.1037/0033-295x.97.3.377
    year: 1990
    verified: false
  - citation: 'Bradley MM, Codispoti M, Cuthbert BN, et al. Emotion and motivation I: defensive and appetitive reactions in
      picture processing. Emotion. 2001;1(3):276-298.'
    doi: 10.1037/1528-3542.1.3.276
    year: 2001
    verified: false
  note: Many replications of the picture-viewing effect, but the cited records come from one research group; graded B, not
    A, because no meta-analysis was retrieved.
- construct: CN.threat_fear
  evidence: B
  relation: blink magnitude is potentiated under threat (anticipatory anxiety, threat-of-shock) and is largest for fear-related
    picture contents
  sources:
  - citation: 'Grillon C, Ameli R, Woods SW, et al. Fear-potentiated startle in humans: effects of anticipatory anxiety on
      the acoustic blink reflex. Psychophysiology. 1991;28(5):588-595.'
    doi: 10.1111/j.1469-8986.1991.tb01999.x
    year: 1991
    verified: false
  - citation: 'Bradley MM, Codispoti M, Cuthbert BN, et al. Emotion and motivation I: defensive and appetitive reactions in
      picture processing. Emotion. 2001;1(3):276-298.'
    doi: 10.1037/1528-3542.1.3.276
    year: 2001
    verified: false
  - citation: Buchanan TW, Tranel D, Adolphs R. Anteromedial temporal lobe damage blocks startle modulation by fear and disgust.
      Behav Neurosci. 2004;118(2):429-437.
    doi: 10.1037/0735-7044.118.2.429
    year: 2004
    verified: false
- construct: CN.approach_motivation
  evidence: C
  relation: potentiation reflects priming of the defensive (withdrawal) motivational system and attenuation priming of the
    appetitive (approach) system
  sources:
  - citation: Lang PJ, Bradley MM, Cuthbert BN. Emotion, attention, and the startle reflex. Psychol Rev. 1990;97(3):377-395.
    doi: 10.1037/0033-295x.97.3.377
    year: 1990
    verified: false
  - citation: 'Bradley MM, Codispoti M, Cuthbert BN, et al. Emotion and motivation I: defensive and appetitive reactions in
      picture processing. Emotion. 2001;1(3):276-298.'
    doi: 10.1037/1528-3542.1.3.276
    year: 2001
    verified: false
  note: Motivational priming account (theory plus supporting data from the same group); kept at C.
- construct: CN.sensory_gating
  evidence: B
  relation: blink magnitude is reduced when a weak prepulse precedes the probe by about 30-500 ms (prepulse inhibition);
    the reduction is smaller in several patient groups
  sources:
  - citation: 'Braff DL, Geyer MA, Swerdlow NR. Human studies of prepulse inhibition of startle: normal subjects, patient groups,
      and pharmacological studies. Psychopharmacology (Berl). 2001;156(2-3):234-258.'
    doi: 10.1007/s002130100810
    year: 2001
    verified: false
  note: Review of many independent PPI studies; prepulse inhibition is sensorimotor rather than purely sensory gating.
notes: 'Sprint 7 (2026-10-17, curator_m): new marker approved under D-079, requested by EMO-STARTLE-001. Uses the new marker
  type peripheral_physiology (taxonomy/marker_types.yaml); recording_modality ''other'' stands for orbicularis oculi EMG.
  Signature values follow the committee guidelines for startle eyeblink EMG (Blumenthal TD, Cuthbert BN, Filion DL, et al.
  Committee report: guidelines for human startle eyeblink electromyographic studies. Psychophysiology. 2005;42(1):1-15. doi:10.1111/j.1469-8986.2005.00271.x)
  and are approximate. Every DOI checked against its Crossref or OpenAlex record (see curation/work/sprint7/markers_new/);
  verified: false pending full-text check. Davis 1992 (amygdala and fear) could not be retrieved and is not cited.'
status: draft
