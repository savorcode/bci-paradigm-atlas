schema_version: '0.2'
id: MK.ASSR
name:
  en: Auditory steady-state response
  zh: 听觉稳态响应
aliases:
- ASSR
- 40-Hz ASSR
- auditory steady-state evoked potential
- envelope following response (cortical)
type: steady_state
recording_modality:
- EEG
- MEG
signature:
  frequency_hz: stimulation/modulation rate, commonly ~40 or 80-100
  topography: fronto-central (scalp EEG)
description:
  en: Periodic response of the auditory system phase-locked to the repetition or amplitude-modulation rate of a sound, measured
    at that frequency in the EEG/MEG spectrum. Responses near 40 Hz are largest in the waking state and reflect largely cortical
    sources; responses at 80-100 Hz reflect mainly brainstem sources.
  zh: 听觉系统对声音重复率或调幅频率产生的锁相周期性响应，在 EEG/MEG 频谱的对应频率处测量。约 40 Hz 的响应在清醒时最大，主要来自皮层；80–100 Hz 的响应主要来自脑干。
notes: 'First-pass skeleton by package A (2026-10-03). No generators/indexes yet. Signature values are textbook-level approximations
  and await source checking. Sprint 5 (2026-10-14, curator F): generators and indexes curated; every DOI checked against its
  Crossref or OpenAlex record (see curation/work/sprint5/markers_F/); verified: false pending full-text check.'
generators:
- region: BR.A1
  evidence: A
  sources:
  - citation: Brugge JF, Nourski KV, Oya H, et al. Coding of repetitive transients by auditory cortex on Heschl's gyrus. J
      Neurophysiol. 2009;102(4):2358-2374.
    doi: 10.1152/jn.91346.2008
    year: 2009
    verified: false
  - citation: Ross B, Borgmann C, Draganova R, et al. A high-precision magnetoencephalographic study of human auditory steady-state
      responses to amplitude-modulated tones. J Acoust Soc Am. 2000;108(2):679-691.
    doi: 10.1121/1.429600
    year: 2000
    verified: false
  - citation: Picton TW, John MS, Dimitrijevic A, et al. Human auditory steady-state responses. Int J Audiol. 2003;42(4):177-219.
    doi: 10.3109/14992020309101316
    year: 2003
    verified: false
  note: 'method: intracranial; depth recordings show phase-locked responses to click trains up to ~40-200 Hz in posteromedial
    Heschl gyrus (Brugge et al. 2009), consistent with MEG source localization of the 40-Hz ASSR in auditory cortex (Ross
    et al. 2000) and the review by Picton et al. 2003 (independent labs, two modalities).'
indexes:
- construct: CN.neural_entrainment
  evidence: B
  relation: power and phase locking peak at the stimulus modulation rate, maximal near 40 Hz
  sources:
  - citation: Picton TW, John MS, Dimitrijevic A, et al. Human auditory steady-state responses. Int J Audiol. 2003;42(4):177-219.
    doi: 10.3109/14992020309101316
    year: 2003
    verified: false
  - citation: Ross B, Borgmann C, Draganova R, et al. A high-precision magnetoencephalographic study of human auditory steady-state
      responses to amplitude-modulated tones. J Acoust Soc Am. 2000;108(2):679-691.
    doi: 10.1121/1.429600
    year: 2000
    verified: false
- construct: CN.cortical_excitability
  evidence: A
  relation: 40-Hz ASSR power and phase locking are reduced in schizophrenia, interpreted as altered gamma-band excitation/inhibition
    balance
  sources:
  - citation: 'Thuné H, Recasens M, Uhlhaas PJ. The 40-Hz auditory steady-state response in patients with schizophrenia: a
      meta-analysis. JAMA Psychiatry. 2016;73(11):1145.'
    doi: 10.1001/jamapsychiatry.2016.2619
    year: 2016
    verified: false
  note: Construct mapping indirect (clinical meta-analysis).
- construct: CN.consciousness_level
  evidence: C
  relation: 40-Hz ASSR amplitude decreases with loss of consciousness under general anaesthesia
  sources:
  - citation: Plourde G, Picton TW. Human auditory steady-state response during general anesthesia. Anesth Analg. 1990;71(5):460-468.
    doi: 10.1213/00000539-199011000-00002
    year: 1990
    verified: false
- construct: CN.auditory_selective_attention
  evidence: B
  relation: ASSR to the attended stream is enhanced, allowing attention-based BCI classification
  sources:
  - citation: Skosnik PD, Krishnan GP, O'Donnell BF. The effect of selective attention on the gamma-band auditory steady-state
      response. Neurosci Lett. 2007;420(3):223-228.
    doi: 10.1016/j.neulet.2007.04.072
    year: 2007
    verified: false
  - citation: 'Kim DW, Hwang HJ, Lim JH, et al. Classification of selective attention to auditory stimuli: toward vision-free
      brain-computer interfacing. J Neurosci Methods. 2011;197(1):180-185.'
    doi: 10.1016/j.jneumeth.2011.02.007
    year: 2011
    verified: false
status: draft
contributors:
- curator_a
