schema_version: '0.2'
id: MK.BOLD_frontopolar
name:
  en: Frontopolar cortex BOLD
  zh: 额极皮层 BOLD
aliases:
- frontopolar BOLD
- rostrolateral prefrontal activation
- BA10 activation
type: hemodynamic
recording_modality:
- fMRI
description:
  en: BOLD activity in frontopolar (rostral prefrontal) cortex associated with exploratory choices, integration of relations,
    and monitoring of internal states such as metamemory and prospective intentions.
  zh: 额极（喙部前额叶）皮层的 BOLD 活动，与探索性选择、关系整合，以及对元记忆和前瞻意图等内部状态的监控相关。
generators:
- region: BR.frontopolar
  evidence: A
  sources:
  - citation: 'Gilbert SJ, Spengler S, Simons JS, et al. Functional specialization within rostral prefrontal cortex (area
      10): a meta-analysis. J Cogn Neurosci. 2006;18(6):932-948.'
    doi: 10.1162/jocn.2006.18.6.932
    year: 2006
    verified: false
  - citation: Burgess PW, Dumontheil I, Gilbert SJ. The gateway hypothesis of rostral prefrontal cortex (area 10) function.
      Trends Cogn Sci. 2007;11(7):290-298.
    doi: 10.1016/j.tics.2007.05.004
    year: 2007
    verified: false
  note: 'method: fMRI localization; frontopolar BA10 is the measured region; meta-analysis of 104 studies (Gilbert 2006) shows
    functional subdivision (lateral vs medial).'
indexes:
- construct: CN.prospective_memory
  evidence: A
  relation: rostral PFC (BA10) BOLD increases during maintenance of delayed intentions
  sources:
  - citation: 'Cona G, Scarpazza C, Sartori G, et al. Neural bases of prospective memory: a meta-analysis and the "Attention
      to Delayed Intention" (AtoDI) model. Neurosci Biobehav Rev. 2015;52:21-37.'
    doi: 10.1016/j.neubiorev.2015.02.007
    year: 2015
    verified: false
  - citation: Burgess PW, Dumontheil I, Gilbert SJ. The gateway hypothesis of rostral prefrontal cortex (area 10) function.
      Trends Cogn Sci. 2007;11(7):290-298.
    doi: 10.1016/j.tics.2007.05.004
    year: 2007
    verified: false
- construct: CN.metacognition
  evidence: A
  relation: anterior prefrontal BOLD increases during metacognitive (confidence) judgements
  sources:
  - citation: 'Vaccaro AG, Fleming SM. Thinking about thinking: a coordinate-based meta-analysis of neuroimaging studies of
      metacognitive judgements. Brain Neurosci Adv. 2018;2:2398212818810591.'
    doi: 10.1177/2398212818810591
    year: 2018
    verified: false
  note: the meta-analysis reports anterior PFC among several regions; frontopolar specificity is moderate.
- construct: CN.value_decision
  evidence: C
  relation: frontopolar BOLD increases on exploratory relative to exploitative choices
  sources:
  - citation: Daw ND, O'Doherty JP, Dayan P, et al. Cortical substrates for exploratory decisions in humans. Nature. 2006;441(7095):876-879.
    doi: 10.1038/nature04766
    year: 2006
    verified: false
notes: 'No signature given in pass 1 (hemodynamic marker; region described in the description). Generators and indexes not
  yet written. Used by (registry): ERR-BANDIT-001, MEM-META-001, MEM-PM-001. Sprint 4 (2026-10-12, curator_e): generators
  and indexes curated; every DOI checked against its Crossref or OpenAlex record (see curation/work/sprint4/markers_E/); verified:
  false pending full-text check.'
status: draft
contributors:
- maintainer
- curator_c
