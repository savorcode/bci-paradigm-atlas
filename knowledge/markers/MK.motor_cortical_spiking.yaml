    doi: 10.1523/JNEUROSCI.02-11-01527.1982
    year: 1982
    verified: false
  - citation: Georgopoulos AP, Schwartz AB, Kettner RE. Neuronal population coding of movement direction. Science. 1986;233(4771):1416-1419.
    doi: 10.1126/science.3749885
