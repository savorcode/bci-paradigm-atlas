    doi: 10.1038/nature04968
    year: 2006
    verified: false
- construct: CN.speech_production
  relation: precentral population activity encodes attempted phonemes/words for speech decoding
  evidence: B
  sources:
  - citation: Willett FR, Kunz EM, Fan C, et al. A high-performance speech neuroprosthesis. Nature. 2023;620(7976):1031-1036.
    doi: 10.1038/s41586-023-06377-x
