schema_version: "0.1"
id: MK.P3a
name: {en: P3a, zh: P3a}
aliases: [novelty P3]
type: erp_component
recording_modality: [EEG, MEG]
signature:
  latency_ms: "250-350"
  polarity: positive
  topography: fronto-central maximum
description:
  en: Positive ERP component with a more anterior distribution and shorter latency than P3b, elicited by rare distractor or novel stimuli, including when they are not task-relevant.
  zh: 较 P3b 分布更靠前、潜伏期更短的正成分，由低频干扰刺激或新异刺激诱发，即使刺激与任务无关亦可出现。
