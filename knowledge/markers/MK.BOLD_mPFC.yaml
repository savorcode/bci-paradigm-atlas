      studies on the self. NeuroImage. 2006;31(1):440-457.
    doi: 10.1016/j.neuroimage.2005.12.002
    year: 2006
    verified: false
  - citation: Denny BT, Kober H, Wager TD, et al. A meta-analysis of functional neuroimaging studies of self- and other judgments
      reveals a spatial gradient for mentalizing in medial prefrontal cortex. J Cogn Neurosci. 2012;24(8):1742-1752.
    doi: 10.1162/jocn_a_00233
    year: 2012
    verified: false
- construct: CN.mentalizing
  evidence: A
  relation: BOLD increases when reasoning about others' mental states (dorsal > ventral)
  sources:
