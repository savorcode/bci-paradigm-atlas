schema_version: '0.2'
id: MK.BOLD_mPFC
name:
  en: Medial prefrontal BOLD (self/mentalizing)
  zh: 内侧前额叶 BOLD（自我/心智化）
aliases:
- mPFC activation
- cortical midline activity
type: hemodynamic
recording_modality:
- fMRI
- PET
description:
  en: BOLD activity in medial prefrontal cortex that is greater when people evaluate information in relation to themselves
    or reason about the mental states of others. It is part of the cortical midline and default-mode systems.
  zh: 当个体评价与自身相关的信息或推理他人心理状态时增强的内侧前额叶 BOLD 活动，属于皮层中线系统和默认模式网络的一部分。
generators:
- region: BR.dmPFC
  evidence: A
  sources:
  - citation: Denny BT, Kober H, Wager TD, et al. A meta-analysis of functional neuroimaging studies of self- and other judgments
      reveals a spatial gradient for mentalizing in medial prefrontal cortex. J Cogn Neurosci. 2012;24(8):1742-1752.
    doi: 10.1162/jocn_a_00233
    year: 2012
    verified: false
  - citation: 'Schurz M, Radua J, Aichhorn M, et al. Fractionating theory of mind: a meta-analysis of functional brain imaging
      studies. Neurosci Biobehav Rev. 2014;42:9-34.'
    doi: 10.1016/j.neubiorev.2014.01.009
    year: 2014
    verified: false
  note: 'method: fMRI localization; measured region; meta-analyses place other-related mentalizing in dorsomedial PFC.'
- region: BR.vmPFC
  evidence: A
  sources:
  - citation: Denny BT, Kober H, Wager TD, et al. A meta-analysis of functional neuroimaging studies of self- and other judgments
      reveals a spatial gradient for mentalizing in medial prefrontal cortex. J Cogn Neurosci. 2012;24(8):1742-1752.
    doi: 10.1162/jocn_a_00233
    year: 2012
    verified: false
  - citation: Northoff G, Heinzel A, de Greck M, et al. Self-referential processing in our brain—a meta-analysis of imaging
      studies on the self. NeuroImage. 2006;31(1):440-457.
    doi: 10.1016/j.neuroimage.2005.12.002
    year: 2006
    verified: false
  note: 'method: fMRI localization; measured region; meta-analyses place self-referential judgments in ventral mPFC (spatial
    gradient, Denny et al. 2012).'
indexes:
