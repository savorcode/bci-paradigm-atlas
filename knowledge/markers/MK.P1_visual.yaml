schema_version: '0.2'
id: MK.P1_visual
name:
  en: Visual P1
  zh: 视觉 P1
aliases:
- P1
- P100 (visual, transient)
- visual P1
type: erp_component
recording_modality:
- EEG
- MEG
signature:
  latency_ms: ~80-130
  polarity: positive
  topography: lateral occipital
description:
  en: First major positive component of the transient visual ERP over lateral occipital sites; it is enhanced for stimuli
    at attended locations.
  zh: 瞬态视觉 ERP 中第一个主要正成分，位于外侧枕区；被注意位置的刺激使其增强。
generators:
- region: BR.extrastriate
  evidence: B
  sources:
  - citation: Di Russo F, Martínez A, Sereno MI, et al. Cortical sources of the early components of the visual evoked potential.
      Hum Brain Mapp. 2002;15(2):95-111.
    doi: 10.1002/hbm.10010
    year: 2002
    verified: false
  - citation: Hillyard SA, Anllo-Vento L. Event-related brain potentials in the study of visual selective attention. Proc
      Natl Acad Sci U S A. 1998;95(3):781-787.
    doi: 10.1073/pnas.95.3.781
    year: 1998
    verified: false
  note: 'method: MEG/EEG source; dipole modelling co-registered with fMRI retinotopy places early P1 in dorsal extrastriate
    cortex (middle occipital gyrus) and late P1 in ventral fusiform cortex (Di Russo 2002); PET-ERP evidence for fusiform
    P1 attention effects reviewed by Hillyard & Anllo-Vento 1998.'
indexes:
- construct: CN.spatial_attention
  evidence: B
  relation: amplitude increases for stimuli at attended versus unattended locations
  sources:
  - citation: Hillyard SA, Anllo-Vento L. Event-related brain potentials in the study of visual selective attention. Proc
      Natl Acad Sci U S A. 1998;95(3):781-787.
    doi: 10.1073/pnas.95.3.781
    year: 1998
    verified: false
  - citation: Di Russo F, Martínez A, Sereno MI, et al. Cortical sources of the early components of the visual evoked potential.
      Hum Brain Mapp. 2002;15(2):95-111.
    doi: 10.1002/hbm.10010
    year: 2002
    verified: false
- construct: CN.early_visual
  evidence: C
  relation: amplitude and latency depend on stimulus contrast and visual-field position (obligatory sensory response)
  sources:
  - citation: Di Russo F, Martínez A, Sereno MI, et al. Cortical sources of the early components of the visual evoked potential.
      Hum Brain Mapp. 2002;15(2):95-111.
    doi: 10.1002/hbm.10010
    year: 2002
    verified: false
notes: 'First-pass skeleton by package A (2026-10-03). Signature values are textbook-level approximations and await source
  checking. Sprint 4 (2026-10-12, curator_a): generators and indexes curated; every DOI checked against its Crossref or OpenAlex
  record (see curation/work/sprint4/markers_A/); verified: false pending full-text check.'
status: draft
contributors:
- curator_a
