    year: 2012
    verified: false
  - citation: Cavanagh JF, Frank MJ. Frontal theta as a mechanism for cognitive control. Trends Cogn Sci. 2014;18(8):414-421.
    doi: 10.1016/j.tics.2014.04.012
    year: 2014
    verified: false
- construct: CN.error_monitoring
  evidence: B
  relation: power increases after errors and negative feedback
  sources:
  - citation: 'Cavanagh JF, Zambrano-Vazquez L, Allen JJB. Theta lingua franca: a common mid-frontal substrate for action
      monitoring processes. Psychophysiology. 2012;49(2):220-238.'
    doi: 10.1111/j.1469-8986.2011.01293.x
    year: 2012
    verified: false
  - citation: Cavanagh JF, Frank MJ. Frontal theta as a mechanism for cognitive control. Trends Cogn Sci. 2014;18(8):414-421.
    doi: 10.1016/j.tics.2014.04.012
    year: 2014
    verified: false
- construct: CN.mental_arithmetic
  evidence: C
  relation: power increases during mental arithmetic
  sources:
  - citation: Ishii R, Shinosaki K, Ukai S, et al. Medial prefrontal cortex generates frontal midline theta rhythm. NeuroReport.
      1999;10(4):675-679.
    doi: 10.1097/00001756-199903170-00003
    year: 1999
    verified: false
  - citation: Asada H, Fukuda Y, Tsunoda S, et al. Frontal midline theta rhythms reflect alternative activation of prefrontal
