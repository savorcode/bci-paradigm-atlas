schema_version: '0.2'
id: MK.cVEP
name:
  en: Code-modulated visual evoked potential
  zh: 编码调制视觉诱发电位
aliases:
- c-VEP
- code-modulated VEP
- m-sequence VEP
- broadband VEP
type: steady_state
recording_modality:
- EEG
signature:
  topography: occipital
description:
  en: Visual evoked response to stimuli flickering according to a pseudorandom binary code; responses to different circular
    shifts of the code are distinguishable by template matching.
  zh: 对按伪随机二值编码闪烁刺激的视觉诱发响应；对编码不同循环移位的响应可通过模板匹配加以区分。
notes: 'First-pass skeleton by package A (2026-10-03). No generators/indexes yet. Signature values are textbook-level approximations
  and await source checking. Sprint 5 (2026-10-14, curator F): generators and indexes curated; every DOI checked against its
  Crossref or OpenAlex record (see curation/work/sprint5/markers_F/); verified: false pending full-text check.'
generators:
- region: BR.V1
  evidence: C
  sources:
  - citation: Slotnick SD, Klein SA, Carney T, et al. Using multi-stimulus VEP source localization to obtain a retinotopic
      map of human primary visual cortex. Clin Neurophysiol. 1999;110(10):1793-1800.
    doi: 10.1016/S1388-2457(99)00135-2
    year: 1999
    verified: false
  note: 'method: MEG/EEG source; multi-stimulus (m-sequence) VEP source localization yields a retinotopic map of V1 (Slotnick
    et al. 1999, multifocal paradigm closely related to c-VEP stimulation); no direct source study of BCI c-VEP found, hence
    C.'
indexes:
- construct: CN.intent_selection
  evidence: B
  relation: template-matched response to the attended code (circular shift) identifies the target the user selects
  sources:
  - citation: Bin G, Gao X, Wang Y, et al. A high-speed BCI based on code modulation VEP. J Neural Eng. 2011;8(2):025015.
    doi: 10.1088/1741-2560/8/2/025015
    year: 2011
    verified: false
  - citation: 'Thielen J, van den Broek P, Farquhar J, et al. Broad-band visually evoked potentials: re(con)volution in brain-computer
      interfacing. PLoS One. 2015;10(7):e0133797.'
    doi: 10.1371/journal.pone.0133797
    year: 2015
    verified: false
  - citation: 'Martínez-Cagigal V, Thielen J, Santamaría-Vázquez E, et al. Brain-computer interfaces based on code-modulated
      visual evoked potentials (c-VEP): a literature review. J Neural Eng. 2021;18(6):061002.'
    doi: 10.1088/1741-2552/ac38cf
    year: 2021
    verified: false
  note: Independent groups (Tsinghua; Radboud) plus a literature review; not graded A because the review is narrative.
- construct: CN.early_visual
  evidence: C
  relation: response is a linear(ised) visual evoked response whose topography follows the retinotopic position of the coded
    stimulus
  sources:
  - citation: Slotnick SD, Klein SA, Carney T, et al. Using multi-stimulus VEP source localization to obtain a retinotopic
      map of human primary visual cortex. Clin Neurophysiol. 1999;110(10):1793-1800.
    doi: 10.1016/S1388-2457(99)00135-2
    year: 1999
    verified: false
  - citation: 'Thielen J, van den Broek P, Farquhar J, et al. Broad-band visually evoked potentials: re(con)volution in brain-computer
      interfacing. PLoS One. 2015;10(7):e0133797.'
    doi: 10.1371/journal.pone.0133797
    year: 2015
    verified: false
status: draft
contributors:
- curator_a
