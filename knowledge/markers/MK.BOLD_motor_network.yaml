schema_version: '0.2'
id: MK.BOLD_motor_network
name:
  en: Motor network BOLD (M1, SMA, premotor, cerebellum)
  zh: 运动网络 BOLD（M1、SMA、前运动区、小脑）
aliases:
- motor network activation
- motor cortex BOLD
- M1 BOLD
type: hemodynamic
recording_modality:
- fMRI
- fNIRS
signature:
  topography: contralateral M1/S1, SMA, premotor cortex, basal ganglia, cerebellum
description:
  en: Haemodynamic response in primary motor cortex, supplementary motor area, premotor cortex and cerebellum during executed,
    imagined or learned movements. fNIRS HbO over the same regions is included (D-028).
  zh: 执行、想象或学习动作时，初级运动皮层、辅助运动区、前运动皮层和小脑的血流动力学响应。fNIRS 在相同区域测得的 HbO 也归入此标记物（D-028）。
generators:
- region: BR.M1
  evidence: A
  sources:
  - citation: 'Witt ST, Laird AR, Meyerand ME. Functional neuroimaging correlates of finger-tapping task variations: an ALE
      meta-analysis. NeuroImage. 2008;42(1):343-356.'
    doi: 10.1016/j.neuroimage.2008.04.025
    year: 2008
    verified: false
  - citation: 'Hardwick RM, Caspers S, Eickhoff SB, et al. Neural correlates of action: comparing meta-analyses of imagery,
      observation, and execution. Neurosci Biobehav Rev. 2018;94:31-44.'
    doi: 10.1016/j.neubiorev.2018.08.003
    year: 2018
    verified: false
  note: 'method: fMRI localization; contralateral M1 during executed movement (finger-tapping ALE, Witt 2008; execution meta-analysis,
    Hardwick 2018).'
- region: BR.SMA
  evidence: A
  sources:
  - citation: 'Witt ST, Laird AR, Meyerand ME. Functional neuroimaging correlates of finger-tapping task variations: an ALE
      meta-analysis. NeuroImage. 2008;42(1):343-356.'
    doi: 10.1016/j.neuroimage.2008.04.025
    year: 2008
    verified: false
  - citation: 'Hétu S, Grégoire M, Saimpont A, et al. The neural network of motor imagery: an ALE meta-analysis. Neurosci
      Biobehav Rev. 2013;37(5):930-949.'
    doi: 10.1016/j.neubiorev.2013.03.017
    year: 2013
    verified: false
  - citation: 'Hardwick RM, Caspers S, Eickhoff SB, et al. Neural correlates of action: comparing meta-analyses of imagery,
      observation, and execution. Neurosci Biobehav Rev. 2018;94:31-44.'
    doi: 10.1016/j.neubiorev.2018.08.003
    year: 2018
    verified: false
  note: 'method: fMRI localization; SMA engaged in execution and imagery meta-analyses.'
- region: BR.cerebellum
  evidence: A
  sources:
  - citation: 'Witt ST, Laird AR, Meyerand ME. Functional neuroimaging correlates of finger-tapping task variations: an ALE
      meta-analysis. NeuroImage. 2008;42(1):343-356.'
    doi: 10.1016/j.neuroimage.2008.04.025
    year: 2008
    verified: false
  - citation: Hardwick RM, Rottschy C, Miall RC, et al. A quantitative meta-analysis and review of motor learning in the human
      brain. NeuroImage. 2013;67:283-297.
    doi: 10.1016/j.neuroimage.2012.11.020
    year: 2013
    verified: false
  note: 'method: fMRI localization; cerebellar (anterior lobe, ipsilateral) response in movement and motor-learning meta-analyses.'
indexes:
- construct: CN.motor_execution
  evidence: A
  relation: BOLD increases in contralateral M1, SMA and cerebellum during overt movement
  sources:
  - citation: 'Witt ST, Laird AR, Meyerand ME. Functional neuroimaging correlates of finger-tapping task variations: an ALE
      meta-analysis. NeuroImage. 2008;42(1):343-356.'
    doi: 10.1016/j.neuroimage.2008.04.025
    year: 2008
    verified: false
  - citation: 'Hardwick RM, Caspers S, Eickhoff SB, et al. Neural correlates of action: comparing meta-analyses of imagery,
      observation, and execution. Neurosci Biobehav Rev. 2018;94:31-44.'
    doi: 10.1016/j.neubiorev.2018.08.003
    year: 2018
    verified: false
- construct: CN.motor_imagery
  evidence: A
  relation: premotor/SMA (and weaker M1) BOLD increases during kinesthetic motor imagery
  sources:
  - citation: 'Hétu S, Grégoire M, Saimpont A, et al. The neural network of motor imagery: an ALE meta-analysis. Neurosci
      Biobehav Rev. 2013;37(5):930-949.'
    doi: 10.1016/j.neubiorev.2013.03.017
    year: 2013
    verified: false
  - citation: 'Hardwick RM, Caspers S, Eickhoff SB, et al. Neural correlates of action: comparing meta-analyses of imagery,
      observation, and execution. Neurosci Biobehav Rev. 2018;94:31-44.'
    doi: 10.1016/j.neubiorev.2018.08.003
    year: 2018
    verified: false
- construct: CN.consciousness_level
  evidence: B
  relation: SMA BOLD during instructed motor imagery (tennis) reveals command-following in some patients with disorders of
    consciousness
  sources:
  - citation: Owen AM, Coleman MR, Boly M, et al. Detecting awareness in the vegetative state. Science. 2006;313(5792):1402.
    doi: 10.1126/science.1130197
    year: 2006
    verified: false
  - citation: Monti MM, Vanhaudenhuyse A, Coleman MR, et al. Willful modulation of brain activity in disorders of consciousness.
      N Engl J Med. 2010;362(7):579-589.
    doi: 10.1056/NEJMoa0905370
    year: 2010
    verified: false
  - citation: 'Kondziella D, Friberg CK, Frokjaer VG, et al. Preserved consciousness in vegetative and minimal conscious states:
      systematic review and meta-analysis. J Neurol Neurosurg Psychiatry. 2016;87(5):485-492.'
    doi: 10.1136/jnnp-2015-310958
    year: 2016
    verified: false
  note: Owen 2006 and Monti 2010 share authors; Kondziella 2016 meta-analysis pools active-paradigm studies across modalities.
notes: 'Signature values are textbook-level characteristics and await source checking (first pass, curator_b). Includes motor-learning
  BOLD changes and SMA activation during tennis imagery in command-following (registry note). Generators and indexes to be
  added in the second pass. Sprint 4 (2026-10-12, curator_e): generators and indexes curated; every DOI checked against its
  Crossref or OpenAlex record (see curation/work/sprint4/markers_E/); verified: false pending full-text check.'
