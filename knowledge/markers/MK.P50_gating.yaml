schema_version: "0.2"
id: MK.P50_gating
name:
  en: P50 sensory gating
  zh: P50 感觉门控
aliases:
- P50 suppression
- P50 sensory gating
- S2/S1 ratio
- M50
type: erp_component
recording_modality:
- EEG
- MEG
signature:
  latency_ms: ~40-80
  polarity: positive
  topography: vertex (Cz)
description:
  en: Reduction of the vertex P50 to the second of two identical clicks presented about 500 ms apart, expressed as the S2/S1
    amplitude ratio and used as an index of sensory gating.
  zh: 约 500 ms 间隔呈现两个相同短声时，第二个短声诱发的顶部 P50 减小，以 S2/S1 波幅比表示，作为感觉门控指标。
notes: First-pass skeleton by package A (2026-10-03). No generators/indexes yet. Signature values are textbook-level approximations
  and await source checking.
status: draft
contributors:
- curator_a
