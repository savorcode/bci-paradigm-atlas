schema_version: '0.2'
id: MK.LPP
name:
  en: Late positive potential
  zh: 晚期正电位
aliases:
- LPP
- late positive complex
type: erp_component
recording_modality:
- EEG
signature:
  latency_ms: from ~300 to >1000 (sustained for the stimulus duration)
  polarity: positive
  topography: centro-parietal
description:
  en: Sustained positive deflection that is larger for emotionally arousing (pleasant or unpleasant) than for neutral stimuli.
    It is reduced by reappraisal and other regulation strategies and is interpreted as motivated attention to significant
    stimuli.
  zh: 持续的正向偏移，情绪唤醒刺激（愉快或不愉快）引起的波幅大于中性刺激。重评等调节策略可使其减小，被解释为对重要刺激的动机性注意。
generators:
- region: BR.visual_cortex
  evidence: B
  sources:
  - citation: 'Sabatinelli D, Lang PJ, Keil A, et al. Emotional perception: correlation of functional MRI and event-related
      potentials. Cereb Cortex. 2007;17(5):1085-1091.'
    doi: 10.1093/cercor/bhl017
    year: 2007
    verified: false
  - citation: 'Sabatinelli D, Keil A, Frank DW, et al. Emotional perception: correspondence of early and late event-related
      potentials with cortical and subcortical functional MRI. Biol Psychol. 2013;92(3):513-519.'
    doi: 10.1016/j.biopsycho.2012.04.005
    year: 2013
    verified: false
  - citation: 'Hajcak G, Foti D. Significance?... Significance! Empirical, methodological, and theoretical connections between
      the late positive potential and P300 as neural responses to stimulus significance: an integrative review. Psychophysiology.
      2020;57(7):e13570.'
    doi: 10.1111/psyp.13570
    year: 2020
    verified: false
  note: 'method: EEG-fMRI; LPP amplitude covaries with BOLD in lateral occipital, inferotemporal and parietal visual cortex
    (Sabatinelli 2007, 2013; one group); generator literature reviewed by Hajcak & Foti 2020.'
- region: BR.parietal_cortex
  evidence: C
  sources:
  - citation: 'Sabatinelli D, Lang PJ, Keil A, et al. Emotional perception: correlation of functional MRI and event-related
      potentials. Cereb Cortex. 2007;17(5):1085-1091.'
    doi: 10.1093/cercor/bhl017
    year: 2007
    verified: false
  note: 'method: EEG-fMRI; Parietal visual areas among the BOLD correlates of the LPP (Sabatinelli 2007).'
