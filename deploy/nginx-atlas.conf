# Nginx site for the project page: atlas.mentiscale.com -> /var/www/bci-paradigm-atlas/website
# Install: copy to /etc/nginx/conf.d/atlas.conf, run `nginx -t && systemctl reload nginx`, then
#          `certbot --nginx -d atlas.mentiscale.com` to add HTTPS (certbot edits this file and adds the 443 block).
server {
    listen 80;
    listen [::]:80;
    server_name atlas.mentiscale.com;

    root /var/www/bci-paradigm-atlas/website;
    index index.html;

    # Only the website/ folder is published; the repository's .git and other folders are outside root.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|woff2|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.json$ {
        expires 10m;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
