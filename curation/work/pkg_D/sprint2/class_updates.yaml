- id: MEM-TMR
  action: modify
  fields:
    description:
      en: During learning, material is associated with sensory cues (item-specific sounds, or an odour present throughout
        the learning session); during subsequent sleep, usually slow-wave sleep, the cues are re-presented, and memory is
        compared after waking between cued and uncued items or between sleep with and without the cue. Cue presentation evokes
        slow oscillations and sleep spindles and activates the hippocampus, and these responses are related to the memory
        benefit of reactivation.
      zh: 学习时材料与感觉线索相关联（项目特异的声音，或整个学习过程中存在的气味）；随后在睡眠中（通常是慢波睡眠）重放线索，醒后比较被提示与未被提示的项目，或比较有/无线索的睡眠条件下的记忆。线索呈现诱发慢振荡与睡眠纺锤波并激活海马，这些反应与再激活带来的记忆获益相关。
    markers:
    - MK.sleep_spindle
    - MK.slow_wave
    - MK.BOLD_hippocampus
    first_source:
      citation: Odor cues during slow-wave sleep prompt declarative memory consolidation. Science. 2007.
      pmid: '17347444'
      year: 2007
      verified: false
    aliases:
    - Cued memory reactivation during sleep
    - TMR
    - odour TMR
    - olfactory memory reactivation
    - odor cueing during slow-wave sleep
  reason: 'D-057 split: MEM-TMR-002 (odour context reactivation, DN52, 2007) predates MEM-TMR-001 (Rudoy et al. 2009, R0443),
    so the class origin is proposed to move to DN52 (authors not visible on the fetched page; maintainer to complete the citation).
    Description generalised to both cue types; MK.BOLD_hippocampus added because DN52 reports hippocampal activation to odour
    re-exposure. If the maintainer prefers Rudoy 2009 as the class origin (item-specific TMR proper), drop first_source from
    this update.'
