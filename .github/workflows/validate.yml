name: validate

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Validate schema and cross-references
        run: python scripts/validate.py
      - name: Build graph
        run: python scripts/build_graph.py
      - name: Check website catalog is up to date
        run: |
          python scripts/build_website_catalog.py
          git diff --exit-code -- website/catalog.json
