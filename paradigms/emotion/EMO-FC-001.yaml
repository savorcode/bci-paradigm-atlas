schema_version: '0.2'
id: EMO-FC-001
class: EMO-FC
name:
  en: Pavlovian fear conditioning
  zh: 巴甫洛夫恐惧条件化
aliases:
- Classical Conditioning
- FC
- Fear Conditioning
- Pavlovian fear conditioning
- fear acquisition and extinction
- threat conditioning
family: emotion
bci_category:
- none
recording_modality:
- fMRI
- EEG
stimulus_modality:
- visual
- auditory
- electrical_stimulation
markers:
- MK.BOLD_amygdala
description:
  en: In one session, a neutral conditioned stimulus (CS+) is repeatedly paired with an aversive unconditioned stimulus such
    as a mild shock or loud noise, while a control stimulus (CS-) is never paired, and an extinction phase without shocks
    may follow. Differential CS+ > CS- responses include amygdala BOLD changes during acquisition.
  zh: 在一次实验中，中性条件刺激（CS+）多次与轻微电击或强噪声等厌恶性无条件刺激配对，对照刺激（CS-）从不配对，其后可接无电击的消退阶段。CS+ 与 CS- 的差异反应包括习得阶段杏仁核 BOLD 的变化。
protocol:
  n_classes: 2
  classes:
  - CS+ (paired with aversive US)
  - CS- (never paired)
  cue: neutral visual conditioned stimuli, with a mild electric shock or loud noise as unconditioned stimulus
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): single-session differential conditioning
    with one CS+ and one CS-, acquisition followed by extinction (lead R0951; authors not in literature.csv). Differs from
    EMO-FC-002 (graded generalization stimuli) and EMO-FC-003 (extinction recall on a separate day).'
first_source:
  citation: 'LaBar KS, Gatenby JC, Gore JC, LeDoux JE, Phelps EA. Human amygdala activation during conditioned fear acquisition
    and extinction: a mixed-trial fMRI study. Neuron. 1998;20(5):937-945.'
  doi: 10.1016/s0896-6273(00)80475-4
  pmid: '9620698'
  year: 1998
  verified: false
interop:
  bids_task: fearconditioning
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_pavlovian_fear_conditioning.html. Lead refs (curation/literature.csv):
  R0191 [key_reference], R0276 [key_reference], R0413 [key_reference], R0668 [review], R0682 [review], R0701 [further_reference],
  R0831 [further_reference], R0933 [method], R0951 [first_source_candidate], R1003 [further_reference;review], R1010 [first_source_candidate].
  R0933 reports frontomedial theta during extinction recall (EEG). R0831 has a placeholder DOI (10.1016/j.tics.2025.xxx) in
  literature.csv. Fullana et al. 2016 (R0682) meta-analysis reports weaker amygdala effects than earlier studies; to be reflected
  in the marker evidence in pass 2. First-pass skeleton (curator_e, 2026-10-03); all sources unverified. Sprint 2 (curator_e,
  2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv. Sprint 3 (curator_d, 2026-10-05):
  bibliography corrected (OpenAlex, 2026-10-05): doi, authors, year, volume, issue, pages added.'
status: draft
