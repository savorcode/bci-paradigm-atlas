schema_version: '0.2'
id: EMO-REG-001
class: EMO-REG
name:
  en: Emotion regulation (cognitive reappraisal)
  zh: 情绪调节（认知重评）
aliases:
- Cognitive Reappraisal Task
- ER Task
- instructed emotion regulation
- look-vs-reappraise
family: emotion
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.LPP
description:
  en: On each trial an instruction (attend or reappraise) precedes a negative picture, and participants either attend naturally
    or reinterpret its meaning to reduce their emotional response, then rate their affect. Reappraisal of unpleasant pictures
    reduces the late positive potential relative to the attend condition.
  zh: 每个试次先出现指导语（注视或重评），随后呈现负性图片；被试或自然观看，或重新解释图片含义以减弱情绪反应，然后评定情绪。与注视条件相比，对不愉快图片的重评降低晚期正电位。
protocol:
  n_classes: 2
  classes:
  - attend (look)
  - reappraise
  cue: instruction cue followed by a negative picture, then affect rating
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): two-condition look-versus-reappraise
    design with negative pictures (Ochsner et al. 2002, R0232). Differs from EMO-REG-002 (reappraisal contrasted with expressive
    suppression).'
first_source:
  citation: 'Ochsner, K. N., Bunge, S. A., Gross, J. J., & Gabrieli, J. D. E. Rethinking feelings: An fMRI study of the cognitive
    regulation of emotion. Journal of Cognitive Neuroscience, 14(8), 1215-1229. 2002.'
  doi: 10.1162/089892902760807212
  pmid: '12495527'
  year: 2002
  verified: false
interop:
  bids_task: emotionregulation
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_emotion_regulation.html. Lead refs (curation/literature.csv):
  R0172 [review], R0232 [first_source_candidate;key_reference], R0541 [review], R0598 [review], R0599 [further_reference],
  R0611 [review], R0723 [review], R0877 [review], R0927 [review], R0962 [method], R1065 [method]. R0962 and R0927 are the
  ERP leads for the LPP reduction. First-pass skeleton (curator_e, 2026-10-03); all sources unverified. Sprint 2 (curator_e,
  2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv. Sprint 3 (curator_d, 2026-10-05):
  bibliography confirmed (Crossref, 2026-10-05).'
status: draft
