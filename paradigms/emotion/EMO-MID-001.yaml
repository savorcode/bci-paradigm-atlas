schema_version: '0.2'
id: EMO-MID-001
class: EMO-MID
name:
  en: Monetary incentive delay task
  zh: 金钱激励延迟任务
aliases:
- MID
- MID task
- Monetary Incentive Delay
- SID
- Social Incentive Delay
family: emotion
bci_category:
- none
recording_modality:
- fMRI
- EEG
stimulus_modality:
- visual
markers:
- MK.BOLD_striatum_reward
- MK.FRN
description:
  en: A cue signals whether a potential monetary gain, loss or no incentive is at stake; after a delay the participant responds
    quickly to a target, and feedback reports the outcome. Reward anticipation recruits ventral striatal BOLD, and outcome
    feedback elicits the FRN / reward positivity in EEG.
  zh: 线索提示本试次可能获得金钱、损失金钱或无激励；延迟后被试对靶刺激快速反应，随后反馈结果。奖赏预期激活腹侧纹状体 BOLD，结果反馈在脑电中诱发 FRN／奖赏正波。
protocol:
  n_classes: 3
  classes:
  - potential monetary gain
  - potential monetary loss
  - no incentive
  cue: abstract shape cues signalling the monetary incentive, then a briefly presented target
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): monetary incentive delay task with
    gain, loss and neutral cues and per-trial outcome feedback (Knutson et al. 2000, R0193). Differs from EMO-MID-002 (social
    reward cues and feedback).'
first_source:
  citation: Knutson B, Westdorp A, Kaiser E, Hommer D. FMRI visualization of brain activity during a monetary incentive delay
    task. NeuroImage. 2000;12(1):20-27.
  doi: 10.1006/nimg.2000.0593
  pmid: '10875899'
  year: 2000
  verified: false
interop:
  bids_task: mid
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_monetary_incentive_delay.html ; https://www.hedtags.org/hed-task/tasks/hedtsk_social_incentive_delay.html
  (merged SOC-SID-001). Lead refs (curation/literature.csv): R0193 [first_source_candidate;key_reference], R0203 [key_reference],
  R0531 [further_reference], R0636 [further_reference], R0751 [review], R0753 [review], R0861 [review], R0876 [method], R0903
  [first_source_candidate], R0974 [review], R0426 [key_reference; via merged SOC-SID-001], R0461 [key_reference; via merged
  SOC-SID-001], R0589 [key_reference; via merged SOC-SID-001], R0600 [further_reference; via merged SOC-SID-001], R0652 [further_reference;
  via merged SOC-SID-001], R0731 [further_reference; via merged SOC-SID-001]. Task sheet notes that the ''emotion'' family
  fits loosely (reward/motivation). First-pass skeleton (curator_e, 2026-10-03); all sources unverified. Sprint 2 (curator_e,
  2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv. Sprint 3 (curator_d, 2026-10-05):
  bibliography corrected (OpenAlex, 2026-10-05): author list expanded, volume, issue, pages added.'
status: draft
contributors:
