schema_version: '0.2'
id: EMO-STRESS-001
class: EMO-STRESS
name:
  en: Trier Social Stress Test (TSST)
  zh: 特里尔社会应激测试（TSST）
aliases:
- MIST
- Montreal Imaging Stress Task
- TSST
- Trier Social Stress Test
family: emotion
bci_category:
- passive
- none
recording_modality:
- EEG
- fMRI
- fNIRS
stimulus_modality:
- cognitive_task
- auditory
- visual
markers:
- MK.frontal_alpha_asymmetry
- MK.HbO_prefrontal
description:
  en: Participants prepare and deliver a free speech and then perform serial subtraction aloud in front of an evaluative panel
    that gives no supportive feedback, with baseline and recovery periods before and after. Acute stress is accompanied by
    changes in frontal alpha asymmetry and prefrontal HbO.
  zh: 被试在不给予支持性反馈的评价小组面前准备并发表自由演讲，然后大声进行连续减法；前后各有基线与恢复期。急性应激伴随额叶 α 不对称与前额叶 HbO 的变化。
protocol:
  n_classes: 3
  classes:
  - pre-stress baseline
  - anticipation, public speech and mental arithmetic before an evaluative panel
  - recovery
  cue: live evaluative panel; speech preparation, free speech and serial subtraction
  paradigm_timing: block
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): Trier Social Stress Test with a live
    panel (Kirschbaum et al. 1993, R0108). Differs from EMO-STRESS-002 (in-scanner arithmetic with time limits and performance
    feedback).'
first_source:
  citation: Kirschbaum C, Pirke KM, Hellhammer DH. The 'Trier Social Stress Test' - a tool for investigating psychobiological
    stress responses in a laboratory setting. Neuropsychobiology. 1993;28(1-2):76-81.
  doi: 10.1159/000119004
  year: 1993
  verified: false
interop:
  bids_task: stress
notes: 'Lead refs (curation/literature.csv): R0108 [first_source_candidate], R0468 [other], R0785 [review]. R0108 has no DOI
  in literature.csv. MIST origin (Dedovic et al. 2005) is a memory-only lead; no MIST variant written for lack of a lead.
  First-pass skeleton (curator_e, 2026-10-03); all sources unverified. Sprint 2 (curator_e, 2026-10-03): protocol block added
  per D-057; see curation/work/pkg_E/sprint2/split_log.csv. Sprint 3 (curator_d, 2026-10-05): bibliography corrected (OpenAlex,
  2026-10-05): doi added. [maintainer sprint 3, 2026-10-07, D-073] origin candidate recalled, record confirmed via OpenAlex.'
status: draft
contributors:
- curator_e
