  (curator_d). Marker mapping provisional: repetition suppression of BOLD in ventral visual cortex is mapped to MK.BOLD_category_selective
  and the ERP word repetition effect to MK.N400 attenuation; the maintainer may prefer a dedicated MK.repetition_suppression
  marker. Origin not retrieved; first_source TBD. Leads: DN22, DN23, DN24. first_source blocked: see curation/work/pkg_D/status.csv.
  Sprint 2 (D-057, curator_d, 2026-10-03): protocol block added (-001 = earliest/standard configuration). first_source TBD
  resolved by bibliographic search (Crossref, 2026-10-05; curator_c): candidate origin found by bibliographic search; content
  unverified. Previous entry: "TBD: no origin source identified yet (see curation/work/pkg_D/status.csv)" [maintainer sprint
  3, 2026-10-07] bibliography confirmed (Crossref, 2026-10-05; origin candidate, content unverified).'
