schema_version: '0.2'
id: MEM-RPRIM-001
class: MEM-RPRIM
name:
  en: Repetition priming
  zh: 重复启动（内隐记忆）
aliases:
- repetition suppression
- fMRI adaptation (memory)
- word repetition effect
- implicit memory priming
family: memory
bci_category:
- none
recording_modality:
- fMRI
- EEG
stimulus_modality:
- visual
- auditory
markers:
- MK.BOLD_category_selective
- MK.N400
description:
  en: Stimuli such as words, pictures or faces are presented once and later repeated, usually in an incidental task, and behavioural
    facilitation for repeated items is measured without requiring conscious recollection. Repeated items evoke reduced BOLD
    responses in ventral visual and prefrontal cortex (repetition suppression) and, for words, an attenuated N400 relative
    to first presentations.
  zh: 词语、图片或面孔等刺激先呈现一次，之后（通常在附带任务中）重复呈现，在不要求有意识回忆的情况下测量重复项目的行为易化。与首次呈现相比，重复项目在腹侧视觉皮层和前额叶诱发较弱的 BOLD 响应（重复抑制），对于词语还表现为 N400
    减弱。
trial_structure:
  conditions:
  - first
  - repeat
protocol:
  n_classes: 2
  classes:
  - first presentation
  - repeated presentation
  cue: words, pictures or faces in an incidental task
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表）：偶然任务中的首次 vs 重复呈现（源头 TBD）。本类只有这一配置。
first_source:
  citation: 'Scarborough DL, Cortese C, Scarborough HS. Frequency and repetition effects in lexical memory. Journal of Experimental
    Psychology: Human Perception and Performance. 1977;3(1):1-17.'
  doi: 10.1037/0096-1523.3.1.1
  year: 1977
  verified: false
interop:
  bids_task: repetitionpriming
