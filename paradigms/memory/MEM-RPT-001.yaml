  by bibliographic search (OpenAlex, 2026-10-05; curator_c): candidate origin found by bibliographic search; content unverified.
  Previous entry: "TBD: no origin source identified yet (see curation/work/pkg_D/status.csv)" [maintainer sprint 3, 2026-10-07]
  bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified).'
