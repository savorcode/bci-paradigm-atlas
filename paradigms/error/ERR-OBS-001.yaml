schema_version: '0.2'
id: ERR-OBS-001
class: ERR-OBS
name:
  en: Observation of errors (human performer, choice task)
  zh: 观察性错误（观察他人完成选择任务）
aliases:
- Observed error paradigm
- oERN
- observation ErrP
- observer ERN
family: error
bci_category:
- passive
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.oERN
- MK.ErrP
description:
  en: Participants watch another person perform a speeded choice task such as the flanker task and monitor the performer's
    responses without acting themselves. Observed errors elicit an observer error-related negativity (oERN) over medial frontal
    sites.
  zh: 被试观看另一人完成快速选择任务（如 flanker 任务），只监视其反应而不亲自操作。被观察到的错误在内侧额区诱发观察性错误相关负波（oERN）。
trial_structure:
  conditions:
  - observed correct response
  - observed error
protocol:
  n_classes: 2
  classes:
  - observed correct response
  - observed error
  cue: observer watches another person perform a speeded choice (flanker) task and its responses, without acting
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表）：观察者观看另一名被试完成 Eriksen flanker 任务（van Schie et al. 2004，R0279；同类研究见 R0714 所列 Carp et al. 2009 等）。
first_source:
  citation: van Schie HT, Mars RB, Coles MGH, Bekkering H. Modulation of activity in medial frontal and motor cortices during
    error observation. Nature Neuroscience. 2004;7(5):549-554.
  doi: 10.1038/nn1239
  year: 2004
  verified: false
interop:
  bids_task: errorobservation
notes: 'Leads used: R0279; R0714. first_source lead: R0279. Task-sheet memory lead (unconfirmed): Miltner et al. 2004 J Cogn
  Neurosci as alternative origin. Review: R0714. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2
  (D-057): protocol added and description narrowed to observing a human performer in a choice task; observed Go/NoGo performance
  split off as ERR-OBS-002 and first-person VR avatar errors as ERR-OBS-003 (both from R0714). Monitoring an autonomous cursor
  is recorded as ERR-ERRP-002 (overlap flagged for the meeting). bibliography corrected (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_c
