schema_version: '0.2'
id: ERR-PSEL-001
class: ERR-PSEL
name:
  en: Probabilistic selection task
  zh: 概率选择任务
aliases:
- Frank Task
- PSS
- PST
- Probabilistic Selection
- Probabilistic Stimulus Selection Task
family: error
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.FRN
- MK.frontal_midline_theta
description:
  en: In a training phase participants learn from probabilistic feedback to choose within fixed stimulus pairs that differ
    in reward probability; a subsequent test phase with novel pairings without feedback reveals whether they learned more
    from positive or from negative outcomes. Feedback during training elicits the FRN and frontal midline theta, which relate
    to subsequent behavioural adaptation.
  zh: 训练阶段，被试依据概率性反馈在奖赏概率不同的固定刺激对中学习选择；随后的测试阶段使用无反馈的新组合，检验被试更多地从正性还是负性结果中学习。训练阶段的反馈诱发 FRN 与额中线 θ，二者与随后的行为调整相关。
trial_structure:
  conditions:
  - training pairs with feedback
  - novel test pairs without feedback
protocol:
  n_classes: 3
  classes:
  - pair AB
  - pair CD
  - pair EF
  cue: fixed visual stimulus pairs differing in reward probability during training; novel pairings without feedback at test
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早发表）：训练阶段 3 对固定刺激对的概率反馈学习，测试阶段新组合、无反馈（Frank et al. 2004，R0272）。本包仅此一个配置。
first_source:
  citation: 'Frank MJ, Seeberger LC, O''Reilly RC. By Carrot or by Stick: Cognitive Reinforcement Learning in Parkinsonism.
    Science. 2004;306(5703):1940-1943.'
  doi: 10.1126/science.1102941
  pmid: '15528409'
  year: 2004
  verified: false
interop:
  bids_task: probselection
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_probabilistic_selection.html. Leads used: R0272; R0463;
  R0365. first_source lead: R0272. EEG lead: R0463. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint
  2 (D-057): protocol added; single configuration, no split. bibliography corrected (Crossref, 2026-10-05)'
status: draft
contributors:
