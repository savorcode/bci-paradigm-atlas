schema_version: '0.2'
id: ERR-CAUS-001
class: ERR-CAUS
name:
  en: Causal learning
  zh: 因果学习
aliases:
- Allergy Prediction Task
- Causal Induction Task
- Causal Judgment Task
- Contingency Judgment Task
- Contingency Learning Task
- Delta-P Task
family: error
bci_category:
- none
recording_modality:
- fMRI
stimulus_modality:
- visual
markers:
- MK.BOLD_dlPFC
description:
  en: Participants observe or produce sequences of cue and outcome events (e.g., foods and allergic reactions) and judge how
    strongly a cue causes the outcome, with the statistical contingency between them manipulated. In fMRI, prediction-error
    and contingency-related activity is reported in lateral prefrontal cortex.
  zh: 被试观察或自行产生线索与结果事件序列（如食物与过敏反应），并判断线索在多大程度上导致结果，二者之间的统计关联性被系统操纵。fMRI 研究报告外侧前额叶存在与预测误差和关联性相关的活动。
protocol:
  cue: sequences of cue or action and outcome events with manipulated contingency, followed by causal or contingency judgements
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早行为学线索）：动作/线索与结果事件的统计关联被操纵，被试判断因果强度（Dickinson et al. 1984，R0066）。本包仅此一个配置。
first_source:
  citation: 'Dickinson, A., Shanks, D., & Evenden, J. Judgement of act-outcome contingency: The role of selective attribution.
    Quarterly Journal of Experimental Psychology Section A, 36(1), 29-50. 1984.'
  doi: 10.1080/14640748408401502
  year: 1984
  verified: false
interop:
  bids_task: causallearning
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_causal_learning.html. Leads used: R0066; R0077; R0218.
  first_source lead: R0066. First source is the earliest behavioural lead (R0066); no neuroimaging origin among leads. Marker
  MK.BOLD_dlPFC is assigned by the registry and needs a supporting neural lead in pass 2. Review: R0218. Pass 1 skeleton (curator_c,
  2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; single configuration, no split. bibliography confirmed
  (OpenAlex, 2026-10-05)'
status: draft
contributors:
- curator_c
