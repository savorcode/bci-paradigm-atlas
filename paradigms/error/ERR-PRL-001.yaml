schema_version: '0.2'
id: ERR-PRL-001
class: ERR-PRL
name:
  en: Probabilistic reversal learning
  zh: 概率反转学习
aliases:
- PRL
- Probabilistic reversal learning task
- Reversal learning task
family: error
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.FRN
- MK.BOLD_striatum_reward
description:
  en: Participants learn by probabilistic feedback which of two stimuli is usually rewarded, and the stimulus-reward contingency
    is reversed without warning once learning criteria are met. Feedback elicits the FRN, and reward prediction errors and
    reversal-related shifts are tracked by striatal (and orbitofrontal) BOLD.
  zh: 被试依据概率性反馈学习两个刺激中哪一个通常获得奖赏，达到学习标准后刺激–奖赏关联在无提示的情况下反转。反馈诱发 FRN，奖赏预测误差和与反转相关的转换反映在纹状体（及眶额）BOLD 信号中。
trial_structure:
  conditions:
  - stimulus A
  - stimulus B
protocol:
  n_classes: 2
  classes:
  - stimulus A
  - stimulus B
  cue: two visual stimuli with probabilistic reward feedback; contingency reversed without warning
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（首个人类神经影像线索）：两刺激概率反馈学习，达到标准后无提示反转（Cools et al. 2002，R0223）。本包仅此一个配置。
first_source:
  citation: Cools R, Clark L, Owen AM, Robbins TW. Defining the Neural Mechanisms of Probabilistic Reversal Learning Using
    Event-Related Functional Magnetic Resonance Imaging. The Journal of Neuroscience. 2002;22(11):4563-4567.
  doi: 10.1523/jneurosci.22-11-04563.2002
  pmid: '12040063'
  year: 2002
  verified: false
interop:
  bids_task: reversallearning
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_reversal_learning.html. Leads used: R0223; R0130; R0725.
  first_source lead: R0223. R0130 (Dias et al. 1996) is older but is an animal (marmoset) study; R0223 is the earliest human
  neuroimaging lead. Review: R0725. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol
  added; single configuration, no split. bibliography corrected (Crossref, 2026-10-05)'
status: draft
