schema_version: '0.2'
id: ERR-ERRP-001
class: ERR-ERRP
name:
  en: Interaction error-related potentials (discrete user commands)
  zh: 交互式错误电位（离散用户指令）
aliases:
- Interaction ErrP
- error-related potentials in BCI
- iErrP
family: error
bci_category:
- passive
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.ErrP
description:
  en: The user issues discrete commands (e.g., key presses) to move a cursor towards a target, and the interface occasionally
    executes an action other than the one intended. Such interface errors elicit a fronto-central error-related potential
    (interaction ErrP) time-locked to the erroneous feedback, which can be detected on single trials and used to correct or
    adapt a BCI.
  zh: 用户以离散指令（如按键）移动光标接近目标，界面偶尔执行与用户意图不符的动作。这类界面错误在错误反馈之后诱发额中央的交互式错误电位（ErrP），可在单试次上检测，用于纠正或自适应调整脑机接口。
trial_structure:
  conditions:
  - correct interface action
  - erroneous interface action
protocol:
  n_classes: 2
  classes:
  - correct interface action
  - erroneous interface action
  cue: user issues discrete commands (e.g., key presses) to move a cursor towards a target; the interface executes the opposite
    action on a fixed proportion of trials
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早发表）：用户发出离散指令移动光标，界面以固定概率执行相反动作（模拟 BCI 交互），错误反馈锁时诱发 ErrP（Ferrez & Millán 2008，R0403）。
first_source:
  citation: Ferrez PW, Millán JdR. Error-Related EEG Potentials Generated during Simulated Brain-Computer Interaction. IEEE
    Transactions on Biomedical Engineering 55(3). 2008.
  year: 2008
  verified: false
interop:
  bids_task: errp
notes: 'Leads used: R0403; R1085; R0603. first_source lead: R0403. Earliest candidate R1085 (''You are wrong!'', no year/authors
  in lead; reported in task sheet as Ferrez & Millán IJCAI 2005, unconfirmed) may predate R0403; first_source uses R0403 because
  it is the earliest lead with bibliographic data. Review: R0603. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified.
  Sprint 2 (D-057): protocol added and description narrowed to discrete-command interaction; split off ERR-ERRP-002 (monitoring
  an autonomous device, BNCI 013-2015), ERR-ERRP-003 (P300-speller feedback errors, BCI Challenge @ NER 2015) and ERR-ERRP-004
  (continuous feedback, Spüler & Niethammer 2015).'
status: draft
contributors:
- curator_c
