schema_version: '0.2'
id: ERR-APC-001
class: ERR-APC
name:
  en: Appetitive Pavlovian conditioning (reward prediction error)
  zh: 食欲性巴甫洛夫条件化（时间差分预测误差）
aliases:
- Appetitive classical conditioning
- Reward conditioning
- TD prediction-error paradigm
family: error
bci_category:
- none
recording_modality:
- fMRI
stimulus_modality:
- visual
- gustatory
markers:
- MK.BOLD_striatum_reward
description:
  en: Visual conditioned stimuli are paired with delivery of a pleasant taste (e.g., juice), and occasional omissions or unexpected
    deliveries create reward prediction errors. Ventral striatal (and orbitofrontal) BOLD activity follows a temporal-difference
    prediction-error signal that shifts from reward delivery to cue onset with learning.
  zh: 视觉条件刺激与愉快味觉（如果汁）的给予配对，偶尔省略或意外给予奖赏以产生奖赏预测误差。腹侧纹状体（及眶额）BOLD 活动遵循时间差分预测误差信号，随着学习从奖赏给予时刻转移到线索出现时刻。
trial_structure:
  conditions:
  - expected reward delivery
  - reward omission
  - unexpected reward delivery
protocol:
  n_classes: 3
  classes:
  - expected reward delivery
  - reward omission
  - unexpected reward delivery
  cue: visual conditioned stimuli predicting delivery of a pleasant taste
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置：视觉条件刺激预测味觉奖赏，偶尔省略或意外给予奖赏，不要求反应（O'Doherty et al. 2003 线索 S_ODOHERTY2003）。本包仅此一个配置。
first_source:
  citation: O'Doherty JP, Dayan P, Friston K, Critchley H, Dolan RJ. Temporal Difference Models and Reward-Related Learning
    in the Human Brain. Neuron. 2003;38(2):329-337.
  doi: 10.1016/s0896-6273(03)00169-7
  year: 2003
  verified: false
interop:
  bids_task: pavlovianreward
notes: 'Leads used: S_ODOHERTY2003 (search: https://www.qxmd.com/r/12718865). first_source lead: S_ODOHERTY2003. First-source
  lead seen as title + journal + year only (authors not shown on the page fetched). Distinct from EMO-FC-001 (aversive fear
  conditioning) and ERR-INST-001 (no action requirement). Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified.
  Sprint 2 (D-057): protocol added; single configuration, no split. bibliography corrected (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_c
