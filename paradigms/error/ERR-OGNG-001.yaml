schema_version: '0.2'
id: ERR-OGNG-001
class: ERR-OGNG
name:
  en: Orthogonalized Go/NoGo learning task
  zh: 正交化 Go/NoGo 学习任务
aliases:
- Go/NoGo learning task
- Pavlovian bias task
- Go-to-win / NoGo-to-avoid task
family: error
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.frontal_midline_theta
description:
  en: Four cues are learned by feedback, each requiring either a response (Go) or withholding (NoGo) to obtain a reward or
    avoid a punishment, so that action and outcome valence are orthogonal and Pavlovian biases (Go for reward, NoGo for punishment)
    can be measured. Overcoming the Pavlovian bias is associated with increased cue-locked midfrontal theta power.
  zh: 被试依据反馈学习四种线索，每种线索要求以反应（Go）或不反应（NoGo）来获得奖赏或避免惩罚，使动作与结果效价相互正交，从而可以测量巴甫洛夫偏向（为奖赏而 Go、为避罚而 NoGo）。克服巴甫洛夫偏向与线索锁时的额中线 θ 功率升高相关。
trial_structure:
  conditions:
  - go to win
  - go to avoid losing
  - no-go to win
  - no-go to avoid losing
protocol:
  n_classes: 4
  classes:
  - go to win
  - go to avoid losing
  - no-go to win
  - no-go to avoid losing
  cue: four abstract visual cues, each assigned to one action (go/no-go) × outcome valence (win/avoid loss) combination
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早发表线索）：4 个线索分别对应 动作（做/不做）× 结果效价（得奖/免罚），由概率反馈学习（S_GUITARTMASIP_GNG）。本包仅此一个配置。
first_source:
  citation: 'Go and no-go learning in reward and punishment: Interactions between affect and effect.'
  verified: false
interop:
  bids_task: ogng
notes: 'Leads used: S_GUITARTMASIP_GNG (search: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3387384/); S_CAVANAGH2013 (search:
  https://ski.clps.brown.edu/papers/CavanaghPVLV_JN.pdf). first_source lead: S_GUITARTMASIP_GNG. First-source lead seen only
  as title + PMC URL (authors/year not shown; from memory: Guitart-Masip et al. 2012, unconfirmed). EEG lead: S_CAVANAGH2013
  (midfrontal theta). Distinct from CTL-GNG-001: responses are learned from valenced outcomes rather than instructed. Pass
  1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; single configuration, no split.'
status: draft
contributors:
- curator_c
