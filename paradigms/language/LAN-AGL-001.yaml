schema_version: '0.2'
id: LAN-AGL-001
class: LAN-AGL
name:
  en: Artificial grammar learning
  zh: 人工语法学习
aliases:
- AGL
- Artificial Grammar
family: language
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.P600
- MK.ERAN
description:
  en: Participants are exposed to letter strings generated by a finite-state artificial grammar and are then asked to classify
    new strings as grammatical or ungrammatical. After learning, grammar violations elicit ERP responses resembling those
    to natural-language syntactic violations, including a late positivity (P600) and an early anterior negativity.
  zh: 被试先接触由有限状态人工语法生成的字母串，随后对新的字母串做合乎/不合语法的分类。学习后，违反语法的串诱发与自然语言句法违例相似的 ERP，包括晚期正波（P600）和早期前部负波。
trial_structure:
  conditions:
  - grammatical
  - ungrammatical
protocol:
  n_classes: 2
  classes:
  - grammatical string
  - ungrammatical string
  cue: letter strings generated by a finite-state grammar
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表）：字母串，学习后做合语法性分类（Reber 1967, R0017）。音调串版本暂记为提议。
first_source:
  citation: Reber, A. S. Implicit learning of artificial grammars. Journal of Verbal Learning and Verbal Behavior, 6(6), 855–863.
    1967.
  doi: 10.1016/s0022-5371(67)80149-x
  year: 1967
  verified: false
interop:
  bids_task: agl
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_artificial_grammar_learning.html. Leads: R0017, R0086,
  R0129, R0387, R0607, R0645 (R#### = curation/literature.csv; DN## = curation/work/pkg_D/new_leads.csv). Sprint 2 (D-057,
  curator_d, 2026-10-03): protocol block added (-001 = earliest/standard configuration). Narrowed to letter strings; tone-sequence
  grammars logged as proposed (no lead). bibliography confirmed (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_d
