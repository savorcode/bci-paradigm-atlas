schema_version: '0.2'
id: PER-MLR-001
class: PER-MLR
name:
  en: Auditory middle-latency response
  zh: 听觉中潜伏期反应
aliases:
- MLR
- AMLR
- Na-Pa
family: perception
bci_category:
- none
recording_modality:
- EEG
- MEG
stimulus_modality:
- auditory
markers:
- MK.MLR
description:
  en: Clicks or tone bursts are presented at moderate rates and the averaged response between about 10 and 80 ms is analysed.
    It contains the Na, Pa, Nb and Pb waves, thought to arise from thalamo-cortical and primary auditory cortex activity,
    and is used in audiology and anaesthesia monitoring.
  zh: 以中等速率呈现短声或短纯音，分析约 10–80 ms 之间的平均响应。其中包含 Na、Pa、Nb、Pb 波，被认为来自丘脑—皮层及初级听皮层活动，用于听力学和麻醉监测。
protocol:
  n_classes: 1
  classes:
  - click / tone burst
  cue: clicks or tone bursts at moderate rate
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：中等速率短声/短纯音，分析 10–80 ms。本类暂无其他具体范式（no sibling protocol yet）。
first_source:
  citation: Geisler CD, Frishkopf LS, Rosenblith WA. Extracranial responses to acoustic clicks in man. Science. 1958;128(3333):1210-1211.
  doi: 10.1126/science.128.3333.1210
  year: 1958
  verified: false
