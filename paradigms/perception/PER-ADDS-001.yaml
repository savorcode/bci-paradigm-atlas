schema_version: '0.2'
id: PER-ADDS-001
class: PER-ADDS
name:
  en: Additional singleton / distractor suppression
  zh: 附加单例与干扰抑制
aliases:
- additional singleton paradigm
- attentional capture
- Pd paradigm
family: perception
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.Pd
description:
  en: Participants search for a shape target while a salient colour singleton distractor is sometimes present. Lateralised
    distractors that are suppressed elicit a distractor positivity (Pd) contralateral to the distractor, whereas captured
    distractors elicit an N2pc.
  zh: 被试搜索形状靶刺激，有时会出现显著的颜色单例干扰项。被抑制的偏侧干扰项在其对侧诱发干扰正波（Pd），而捕获注意的干扰项则诱发 N2pc。
protocol:
  n_classes: 2
  classes:
  - salient distractor present
  - distractor absent
  cue: shape-singleton search display with an optional colour-singleton distractor
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：形状单例搜索，部分试次出现颜色单例干扰物。本类暂无其他具体范式（no sibling protocol yet）。
first_source:
  citation: Theeuwes J. Perceptual selectivity for color and form. Percept Psychophys. 1992;51(6):599-606.
  doi: 10.3758/BF03211656
  year: 1992
  verified: false
interop:
  bids_task: additionalsingleton
