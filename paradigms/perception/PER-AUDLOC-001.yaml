schema_version: '0.2'
id: PER-AUDLOC-001
class: PER-AUDLOC
name:
  en: Free-field sound localization
  zh: 自由场声源定位
aliases:
- sound localization
- sound localisation
- free-field localization
- spatial hearing
- azimuth localization
family: perception
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- auditory
markers:
- MK.BOLD_auditory_cortex
- MK.N1_auditory
description:
  en: Sounds are presented from sources at different azimuths (and elevations) around the listener, who reports the perceived
    direction of each sound. Rayleigh (1907) used such listening experiments to show that low-frequency direction depends
    on interaural phase (time) differences and high-frequency direction on interaural intensity differences (duplex theory).
    Localization error and front-back confusions are the main outcome measures.
  zh: 从被试周围不同方位角（及仰角）的声源呈现声音，被试报告每个声音的感知方向。Rayleigh（1907）用此类听觉实验表明，低频声音方向取决于双耳相位（时间）差，高频声音方向取决于双耳强度差（双重理论）。主要指标为定位误差和前后混淆。
trial_structure:
  phases:
  - name: fixation / orienting
    duration_ms: self-paced
    note: head oriented to a reference direction
  - name: sound
    duration_ms: 150
    note: broadband noise burst in the standard modern protocol (Makous & Middlebrooks 1990); to be checked against the full
      text
  - name: response
    duration_ms: self-paced
    note: pointing or reporting the perceived direction
  conditions:
  - source direction (azimuth, elevation)
protocol:
  n_classes: 1
  classes:
  - source direction (continuous report)
  cue: brief sounds from loudspeakers at different directions in free field
  stimulus_coding: source position varied; response = perceived direction
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：自由场中不同方向的声音，被试报告感知方向（Rayleigh 1907）。耳机虚拟声源与基于空间声源的 P300 脑机接口（已有 PER-ODD-008）不在本文件。
first_source:
  citation: Lord Rayleigh. XII. On our perception of sound direction. The London, Edinburgh, and Dublin Philosophical Magazine
    and Journal of Science. 1907;13(74):214-232.
  doi: 10.1080/14786440709463595
  year: 1907
  verified: false
variants:
- name: Two-dimensional localization with head-pointing responses
  source:
    citation: Makous JC, Middlebrooks JC. Two-dimensional sound localization by human listeners. The Journal of the Acoustical
      Society of America. 1990;87(5):2188-2200.
    doi: 10.1121/1.399186
    year: 1990
    verified: false
  note: Modern free-field protocol (azimuth and elevation, many loudspeaker positions, head-pointing response); same stimulus
    and response scheme.
interop:
  bids_task: soundlocalization
notes: 'Rayleigh 1907 (Crossref) is the earliest retrieved record; it is partly theoretical, and the listening procedures
  are not described here in detail, so the trial structure follows Makous & Middlebrooks 1990 (Crossref; noise-burst duration
  from general knowledge of the paper, to be checked). Zatorre et al. 2002 (Crossref) supports MK.BOLD_auditory_cortex. MK.N1_auditory
  is the closest EEG marker in the registry; no localization-specific marker exists (see marker_requests.csv). Overlap with
  PER-ODD-008 (auditory spatial P300 BCI): Schreuder et al. 2010 (Crossref) is an earlier record of that BCI than its current
  first_source (2011), noted in worklog for the owner of PER-ODD-008. No public dataset verified. [curator_a sprint 6, 2026-10-16]'
status: draft
contributors:
- curator_a
