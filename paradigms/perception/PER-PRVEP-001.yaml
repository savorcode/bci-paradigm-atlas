id: PER-PRVEP-001
class: PER-PRVEP
name:
  en: Pattern-reversal VEP
  zh: 棋盘格翻转 VEP
aliases:
- P100
- PR-VEP
- checkerboard VEP
- pattern reversal VEP
family: perception
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.P100_PRVEP
description:
  en: A black-and-white checkerboard reverses contrast at a fixed rate while the participant fixates its centre. Each reversal
    evokes a VEP with a robust occipital P100, whose latency is the standard clinical measure of optic nerve conduction.
  zh: 被试注视棋盘格中心，棋盘格以固定速率进行黑白翻转。每次翻转诱发一个 VEP，其稳定的枕区 P100 潜伏期是临床评估视神经传导的标准指标。
protocol:
  n_classes: 1
  classes:
  - pattern reversal
  cue: black-and-white checkerboard reversing at a fixed rate, central fixation
  stimulus_coding: 翻转率、方格大小为参数。本类暂无其他具体范式（no sibling protocol yet）。
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：黑白棋盘格以固定速率翻转，注视中心。本类暂无其他具体范式（no sibling protocol yet）。
first_source:
