schema_version: '0.2'
id: PER-IC-001
class: PER-IC
name:
  en: Illusory contour perception
  zh: 错觉轮廓知觉
aliases:
- Kanizsa illusory contours
- IC paradigm
family: perception
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.N1_visual
description:
  en: Inducers (for example Kanizsa 'pac-man' elements) are arranged so that they either form an illusory shape or not. Illusory
    contour configurations modulate the visual N1 range over lateral occipital sites (the IC effect) compared with rotated
    inducers.
  zh: 将诱导元素（如 Kanizsa “吃豆人”图形）排列成能形成或不能形成错觉图形的两种布局。与旋转诱导元素相比，错觉轮廓布局在外侧枕区调制视觉 N1 时程（IC 效应）。
protocol:
  n_classes: 2
  classes:
  - illusory contour configuration
  - rotated inducers
  cue: Kanizsa-type inducers forming or not forming an illusory shape
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：Kanizsa 诱导物构成/不构成错觉图形。本类暂无其他具体范式（no sibling protocol yet）。
first_source:
  citation: Kanizsa G. Subjective contours. Sci Am. 1976;234(4):48-52.
  doi: 10.1038/scientificamerican0476-48
  year: 1976
  verified: false
