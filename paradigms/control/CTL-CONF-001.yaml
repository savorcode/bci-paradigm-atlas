schema_version: '0.2'
id: CTL-CONF-001
class: CTL-CONF
name:
  en: Decision confidence judgement (perceptual metacognition)
  zh: 决策信心判断（知觉元认知）
aliases:
- Confidence rating task
- Perceptual metacognition task
- Post-decision confidence
family: control
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.Pe
description:
  en: After each perceptual decision, participants rate their confidence that the decision was correct, on a scale ranging
    from certainly wrong to certainly correct. The amplitude of the post-response error positivity varies continuously with
    confidence, linking confidence judgements and error detection.
  zh: 每次知觉决策后，被试在从“肯定错误”到“肯定正确”的量表上评定对决策正确性的信心。反应后错误正波（Pe）的波幅随信心连续变化，把信心判断与错误检测联系起来。
trial_structure:
  conditions:
  - correct
  - error
protocol:
  n_classes: 2
  classes:
  - correct decision
  - error
  cue: two-choice perceptual stimulus followed by a confidence rating from certainly wrong to certainly correct
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表线索）：每次知觉判断后作从"肯定错"到"肯定对"的信心评分（Boldt & Yeung 2015，R1145）。本包仅此一个配置。
first_source:
  citation: Boldt A, Yeung N. Shared neural markers of decision confidence and error detection. Journal of Neuroscience 35:3478-3484.
    2015.
  doi: 10.1523/JNEUROSCI.0797-14.2015
  year: 2015
  verified: false
interop:
  bids_task: confidence
notes: 'Leads used: S_BOLDT2015 (search: https://www.psy.ox.ac.uk/people/nicholas-yeung/publication_modal/508513). first_source
  lead: S_BOLDT2015. Distinct from MEM-META-001 (metamemory judgements) and ERR-AWARE-001 (binary error signalling); overlap
  with ERR-AWARE-001 to be discussed at the meeting. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint
  2 (D-057): protocol added; single configuration, no split. bibliography confirmed (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_c
