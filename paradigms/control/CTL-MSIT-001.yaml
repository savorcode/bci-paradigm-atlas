schema_version: '0.2'
id: CTL-MSIT-001
class: CTL-MSIT
name:
  en: Multi-source interference task (MSIT)
  zh: 多源干扰任务
aliases:
- MSIT
- Multi-Source Interference Task
family: control
bci_category:
- none
recording_modality:
- fMRI
stimulus_modality:
- visual
markers:
- MK.BOLD_dACC
description:
  en: Participants see three digits and report the identity of the one that differs from the other two; on interference trials
    the target's identity conflicts with its position and flanking digits are possible responses, combining Stroop-, flanker-
    and Simon-type interference. Interference trials reliably increase dorsal anterior cingulate BOLD activity in individual
    subjects.
  zh: 被试看到三个数字，报告与另两个不同的那个数字；干扰试次中目标数字的身份与其位置冲突，且两侧数字本身也是可选反应，从而合并了 Stroop、Flanker 与 Simon 型干扰。干扰试次在个体被试中稳定地增加背侧前扣带 BOLD 活动。
trial_structure:
  conditions:
  - control
  - interference
protocol:
  n_classes: 2
  classes:
  - control trials
  - interference trials
  cue: three digits; report the identity of the digit that differs
  paradigm_timing: block
  feedback: none
  distinguishing: 标准配置（最早发表）：三位数字中报告不同的那个，干扰与控制试次分组块呈现（Bush et al. 2003 线索 R1143）；组块设计待核对原文。
first_source:
  citation: 'Bush G, Shin LM, Holmes J, Rosen BR, Vogt BA. The Multi-Source Interference Task: validation study with fMRI
    in individual subjects. Molecular Psychiatry. 2003;8(1):60-70.'
  doi: 10.1038/sj.mp.4001217
  pmid: '12556909'
  year: 2003
  verified: false
interop:
  bids_task: msit
notes: 'Leads used: S_BUSH2003 (search: https://www.nmr.mgh.harvard.edu/node/468). first_source lead: S_BUSH2003. First-source
  lead seen with title, journal, DOI and PMID; authors not shown on the page (task designer reportedly Bush et al., unconfirmed).
  Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; single configuration,
