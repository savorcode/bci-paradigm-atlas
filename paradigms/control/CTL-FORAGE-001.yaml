schema_version: '0.2'
id: CTL-FORAGE-001
class: CTL-FORAGE
name:
  en: Foraging decision task
  zh: 觅食决策（留守/探索）
aliases:
- Patch foraging task
- Engage-or-search task
- Foraging task
family: control
bci_category:
- none
recording_modality:
- fMRI
stimulus_modality:
- visual
markers:
- MK.BOLD_dACC
description:
  en: Participants decide whether to engage with a currently offered option or to search the environment for alternatives
    at a cost, so that the value of foraging depends on the average value of the environment. Dorsal anterior cingulate BOLD
    activity tracks the value of searching and the average environmental value.
  zh: 被试决定是接受当前提供的选项，还是付出代价在环境中搜索其他选项，因而觅食的价值取决于环境的平均价值。背侧前扣带 BOLD 活动反映搜索的价值和环境平均价值。
trial_structure:
  conditions:
  - engage
  - search
protocol:
  n_classes: 2
  classes:
  - engage with current offer
  - search for alternatives
  cue: offer and environment of alternative options with a search cost
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早发表）：接受当前选项或付出代价搜索（Kolling et al. 2012，R1147）。本包仅此一个配置。
first_source:
  citation: Kolling N, Behrens TEJ, Mars RB, Rushworth MFS. Neural mechanisms of foraging. Science 336:95-98. 2012.
  doi: 10.1126/science.1216930
  year: 2012
  verified: false
interop:
  bids_task: foraging
notes: 'Leads used: S_KOLLING2012 (search: https://www.psy.ox.ac.uk/people/matthew-rushworth/publication_modal/322703). first_source
  lead: S_KOLLING2012. Distinct from ERR-BANDIT-001 (explore-exploit among fixed arms) by the engage-versus-search structure.
  Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; single configuration,
  no split. bibliography confirmed (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_c
