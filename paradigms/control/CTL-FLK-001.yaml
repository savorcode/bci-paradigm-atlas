schema_version: '0.2'
id: CTL-FLK-001
class: CTL-FLK
name:
  en: Eriksen flanker task (letter version)
  zh: Flanker 任务（字母版）
aliases:
- Eriksen flanker
- Flanker
- Flanker Task
- Letter flanker task
family: control
bci_category:
- none
recording_modality:
- EEG
- MEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.ERN
- MK.Pe
- MK.N2_frontocentral
description:
  en: Participants identify a central target letter flanked by noise letters that are associated with the same (compatible)
    or the opposite (incompatible) response. Incompatible trials elicit a fronto-central N2, and erroneous responses elicit
    the error-related negativity followed by the error positivity.
  zh: 被试辨认中央目标字母，其两侧干扰字母对应相同（相容）或相反（不相容）的反应。不相容试次诱发额中央 N2，错误反应诱发错误相关负波（ERN），随后出现错误正波（Pe）。
trial_structure:
  conditions:
  - compatible
  - incompatible
protocol:
  n_classes: 2
  classes:
  - response-compatible flankers
  - response-incompatible flankers
  cue: central target letter flanked by noise letters assigned to the same or the other response
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表）：中央目标字母两侧为与其同反应或异反应的干扰字母（Eriksen & Eriksen 1974，R0030）。
first_source:
  citation: Eriksen BA, Eriksen CW. Effects of noise letters upon the identification of a target letter in a nonsearch task.
    Perception & Psychophysics. 1974;16(1):143-149.
  doi: 10.3758/bf03203267
  year: 1974
  verified: false
interop:
  bids_task: flanker
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_eriksen_flanker.html. Leads used: R0030; R0103; R0204;
  R1094. first_source lead: R0030. ERN lead: R0103 (Gehring et al. 1993); task-sheet memory lead Falkenstein et al. 1991 unconfirmed.
  Conflict review: R0204. Dataset from candidates.csv datasets column (ERP CORE, NeuroImage 2021 per DOAJ listing); URL not
  in leads. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; -001 narrowed
  to the letter version; the arrow version split off as CTL-FLK-002 (criterion 2), and the ERP CORE dataset moved there. bibliography
  corrected (OpenAlex, 2026-10-05)'
status: draft
contributors:
- curator_c
