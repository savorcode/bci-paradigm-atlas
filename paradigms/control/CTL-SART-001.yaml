schema_version: '0.2'
id: CTL-SART-001
class: CTL-SART
name:
  en: Sustained attention to response task
  zh: 持续注意反应任务（SART）
aliases:
- SART
- Sustained Attention to Response
family: control
bci_category:
- none
recording_modality:
- EEG
stimulus_modality:
- visual
markers:
- MK.NoGo_P3
- MK.alpha_posterior
description:
  en: Digits are presented at a fixed rapid rate and participants respond to every digit except a rare target (e.g., 3), so
    that withholding requires sustained attention to an otherwise automatic response. Withheld targets elicit a NoGo-P3, and
    pre-stimulus posterior alpha power relates to attentional lapses.
  zh: 数字以固定的快速节奏呈现，被试对除罕见目标（如 3）以外的每个数字都要反应，因此抑制反应依赖于对原本自动化反应的持续注意。成功抑制的目标诱发 NoGo-P3，刺激前后部 α 功率与注意失误相关。
trial_structure:
  conditions:
  - non-target
  - target
protocol:
  n_classes: 2
  classes:
  - non-target digits (respond)
  - target digit (withhold)
  cue: single digits at a fixed rapid rate
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 标准配置（最早发表）：对所有数字反应、对罕见目标数字抑制（Robertson et al. 1997，R0139）。本包仅此一个配置。
first_source:
  citation: 'Robertson IH, Manly T, Andrade J, Baddeley BT, Yiend J. ''Oops!'': Performance correlates of everyday attentional
    failures in traumatic brain injured and normal subjects. Neuropsychologia. 1997;35(6):747-758.'
  doi: 10.1016/s0028-3932(97)00015-8
  pmid: '9204482'
  year: 1997
  verified: false
interop:
  bids_task: sart
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_sustained_attention_to_response.html. Leads used: R0139;
  R0184; R0372. first_source lead: R0139. Maintainer note (候议): possible overlap with CTL-GNG-001. EEG lead: R0372. Pass 1
  skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol added; single configuration, no split.
  bibliography corrected (Crossref, 2026-10-05)'
status: draft
contributors:
- curator_c
