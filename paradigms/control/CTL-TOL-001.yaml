notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_tower_of_london.html. Leads used: R0057; R0136; R0348.
  first_source lead: R0057. PET lead: R0136; review: R0348. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified.
