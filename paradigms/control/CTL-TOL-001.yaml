schema_version: '0.2'
id: CTL-TOL-001
class: CTL-TOL
name:
  en: Tower of London
  zh: 伦敦塔（计划）
aliases:
- Shallice Tower Task
- Stockings of Cambridge (CANTAB variant)
- TOL
- TOL-F
family: control
bci_category:
- none
recording_modality:
- fMRI
- fNIRS
stimulus_modality:
- visual
markers:
- MK.BOLD_dlPFC
- MK.HbO_prefrontal
description:
  en: Participants plan the minimum sequence of moves needed to rearrange coloured balls on pegs from a start state into a
    goal state, with problem difficulty set by the number of moves. Planning load increases dorsolateral prefrontal activity
    in fMRI and prefrontal oxygenated haemoglobin in fNIRS.
  zh: 被试规划以最少步数把木桩上的彩球从初始状态重排为目标状态，问题难度由所需步数决定。规划负荷增加 fMRI 中的背外侧前额叶活动，以及 fNIRS 中前额叶的氧合血红蛋白。
protocol:
  cue: start and goal arrangements of coloured balls on pegs of different capacity; problems graded by minimum number of moves
  distinguishing: 标准配置（最早发表）：把起始状态的彩球移成目标状态，难度按最少步数（Shallice 1982，R0057）。计算机化与 Stockings of Cambridge 等版本未拆分（无线索核对其配置差异）。
first_source:
  citation: Shallice T. Specific impairments of planning. Philosophical Transactions of the Royal Society of London. B, Biological
    Sciences. 1982;298(1089):199-209.
  doi: 10.1098/rstb.1982.0082
  pmid: '6125971'
  year: 1982
  verified: false
interop:
