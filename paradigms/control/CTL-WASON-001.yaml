schema_version: '0.2'
id: CTL-WASON-001
class: CTL-WASON
name:
  en: Wason selection task
  zh: Wason 选择任务
aliases:
- Card Selection Task
- Wason
family: control
bci_category:
- none
recording_modality:
- fMRI
stimulus_modality:
- visual
markers:
- MK.BOLD_dlPFC
description:
  en: Participants are shown four cards and a conditional rule ('if P then Q') and must select the cards that need to be turned
    over to test whether the rule holds; performance depends strongly on rule content. Neuroimaging studies of the task report
    lateral prefrontal activity during rule-based reasoning.
  zh: 被试看到四张卡片和一条条件规则（“如果 P 则 Q”），须选出需要翻开以检验规则是否成立的卡片；成绩强烈依赖规则内容。该任务的神经影像研究报告基于规则推理时外侧前额叶的活动。
protocol:
  cue: four cards and a conditional rule ('if P then Q'); select cards to test the rule
  distinguishing: 标准配置（最早发表）：四卡选择任务（Wason 1966，R0015）；抽象 vs 主题/社会交换内容（R0058、R0089）是内容条件，未拆分。
first_source:
  citation: Wason, P. C. Reasoning. New Horizons in Psychology. 1966.
  year: 1966
  verified: false
interop:
  bids_task: wason
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_wason_selection.html. Leads used: R0015; R0089. first_source
  lead: R0015. No neuroimaging lead among the leads; marker MK.BOLD_dlPFC is assigned by the registry and needs a supporting
  neural source in pass 2 (D-023 criterion). Behavioural lead: R0089. Pass 1 skeleton (curator_c, 2026-10-03); all sources
  unverified. Sprint 2 (D-057): protocol added; single configuration, no split.'
status: draft
