schema_version: '0.2'
id: CTL-WCST-001
class: CTL-WCST
name:
  en: Wisconsin Card Sorting Test
  zh: 威斯康星卡片分类
aliases:
- Card Sorting Task
- WCST
family: control
bci_category:
- none
recording_modality:
- EEG
- fMRI
- fNIRS
stimulus_modality:
- visual
markers:
- MK.BOLD_dlPFC
- MK.P3b
- MK.HbO_prefrontal
description:
  en: Participants sort cards by colour, shape or number according to a rule they must infer from right/wrong feedback, and
    the rule changes without warning after a run of correct sorts. Rule shifts engage dorsolateral prefrontal cortex (fMRI,
    fNIRS), and feedback signalling a shift elicits a P3.
  zh: 被试按颜色、形状或数量对卡片分类，分类规则须从对/错反馈中推断，连续正确若干次后规则会无提示地改变。规则转换激活背外侧前额叶（fMRI、fNIRS），提示需要转换的反馈诱发 P3。
trial_structure:
  conditions:
  - colour
  - shape
  - number
protocol:
  n_classes: 3
  classes:
  - sort by colour
  - sort by shape
  - sort by number
  cue: response cards matched to key cards; right/wrong feedback; rule changes without warning
  paradigm_timing: synchronous
  feedback: discrete
  distinguishing: 标准配置（最早发表线索）：按颜色/形状/数量分类，规则由反馈推断且无预告地改变（Grant & Berg 1948，R1136）。本包仅此一个配置。
first_source:
  citation: Grant DA, Berg E. A behavioral analysis of degree of reinforcement and ease of shifting to new responses in a
    Weigl-type card-sorting problem. Journal of Experimental Psychology. 1948;38(4):404-411.
  doi: 10.1037/h0059831
  year: 1948
  verified: false
interop:
  bids_task: wcst
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_wisconsin_card_sorting.html. Leads used: S_GRANTBERG1948
  (search: https://kennisdatabank.efp.nl/literatuur/a-behavioral-analysis-of-degree-of-reinforcement-and-ease-of-shifting-to-new-responses-in-a-weigl-ty);
  R0445; R0699. first_source lead: S_GRANTBERG1948. No origin paper among leads; first_source found by search (Grant & Berg
  1948). Reviews: R0445, R0699. Pass 1 skeleton (curator_c, 2026-10-03); all sources unverified. Sprint 2 (D-057): protocol
  added; single configuration, no split. bibliography corrected (Crossref, 2026-10-05)'
status: draft
