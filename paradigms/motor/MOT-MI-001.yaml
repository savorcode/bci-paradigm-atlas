schema_version: '0.2'
id: MOT-MI-001
class: MOT-MI
name:
  en: Cued motor imagery
  zh: 提示性运动想象
aliases:
- motor imagery
- MI
- kinesthetic motor imagery
- movement imagery
- left/right hand motor imagery
family: motor
bci_category:
- active
recording_modality:
- EEG
- MEG
- ECoG
- fNIRS
- fMRI
stimulus_modality:
- mental_imagery
- visual
markers:
- MK.SMR_ERD
description:
  en: >-
    On each trial a visual arrow cue instructs the participant to imagine moving the left or the right hand without executing
    it. Lateralised ERD of sensorimotor mu/beta rhythms over the contralateral hand area distinguishes the two classes; no
    feedback is given during the trials (screening/calibration design).
  zh: 每个试次由视觉箭头提示被试想象左手或右手的动作，但不实际执行。对侧手区感觉运动 mu/β 节律的偏侧化 ERD 区分两类；试次中不给反馈（筛查/校准设计）。
trial_structure:
  phases:
  - name: fixation
    duration_ms: 2000
  - name: cue
    duration_ms: 1250
  - name: imagery
    duration_ms: 4000
  - name: rest
    duration_ms: 1500-2500
  typical_trials: 40-100 per class
  conditions:
  - left hand
  - right hand
protocol:
  n_classes: 2
  classes:
  - left hand
  - right hand
  cue: visual arrow cue
  paradigm_timing: synchronous
  feedback: none
  distinguishing: >-
    Standard configuration (earliest published) / 标准配置（最早发表）: left- vs right-hand kinaesthetic imagery, visual cue, cue-paced
    trials, no feedback (Pfurtscheller & Neuper 1997). Siblings differ by class set (-002 four classes, -003 upper-limb multi-joint,
    -004 feet vs rest, -006 right hand vs feet, -008 three classes, -010 both hands vs both feet, -011 eleven upper-limb tasks),
    feedback (-005, -007) or trial structure (-009 asynchronous).
first_source:
  citation: >-
    Pfurtscheller G, Neuper C. Motor imagery activates primary sensorimotor area in humans. Neurosci Lett. 1997;239(2-3):65-68.
  doi: 10.1016/S0304-3940(97)00889-6
  year: 1997
  verified: false
datasets:
- name: BCI Competition IV, dataset 2b (screening sessions without feedback)
  url: https://moabb.neurotechx.com/docs/generated/moabb.datasets.BNCI2014_004.html
  subjects: 9
- name: PhysioNet EEG Motor Movement/Imagery Dataset (eegmmidb), left/right fist imagery runs
  url: https://moabb.neurotechx.com/docs/generated/moabb.datasets.PhysionetMI.html
  subjects: 109
- name: Cho2017 (MOABB; left/right hand MI)
  url: https://moabb.neurotechx.com/docs/dataset_summary.html
  subjects: 52
interop:
  bids_task: motorimagery
notes: >-
  Origin attribution under review; earlier work by the same group and others on imagery-related EEG changes should be assessed.
  Trial timing above reflects a common cue-based design and varies across studies. Leads (pkg B first pass): R0996 (same title
  as first_source; title-only lead), R0921, R0991, R0994, R0997, R0883, R0922, R0955. Datasets added from candidates.csv leads
  (MOT-MI-001, MOT-GAIT-001); URLs to be added. Candidate note: action observation combined with imagery was proposed as a
  variant; no lead yet. Sprint 2 (D-057): narrowed to the two-class configuration. Moved out: BCI Competition IV 2a -> MOT-MI-002;
  dataset 1 -> MOT-MI-009; foot MI variant and the exoskeleton-walking MI database -> MOT-MI-004; feedback sessions of 2b
  -> MOT-MI-005. 'BNCI Horizon 2020 database' removed as a non-specific entry (individual BNCI sets are now attached to the
  matching concrete paradigms). Dataset 2b mixes screening and feedback sessions; only the screening sessions match this protocol
  (MOABB BNCI2014_004 page). [maintainer, sprint 2] Lead registered as R1291 (literature.csv). [maintainer, sprint 2] Lead
  registered as R1293 (literature.csv). bibliography confirmed (OpenAlex, 2026-10-05)
status: draft
