id: MOT-REACH-002
class: MOT-REACH
name:
  en: Four-direction wrist centre-out movement (MEG)
  zh: 四方向腕部中心外伸运动（脑磁）
aliases:
- BCI Competition IV dataset 3 paradigm
- wrist movement direction decoding
family: motor
bci_category:
- active
recording_modality:
- MEG
stimulus_modality:
- motor_execution
- visual
markers:
- MK.low_freq_kinematics
description:
  en: Participants make actual wrist movements in one of four directions from a centre position, and the movement direction
    is decoded from directionally modulated low-frequency MEG activity over motor areas.
  zh: 被试从中心位置向四个方向之一做实际的腕部运动，依据运动区上受方向调制的低频脑磁活动解码运动方向。
protocol:
  n_classes: 4
  classes:
  - direction 1
  - direction 2
  - direction 3
  - direction 4
  cue: visual target
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Criterion 1 vs MOT-REACH-001: four wrist-movement directions instead of eight arm-reaching targets.'
