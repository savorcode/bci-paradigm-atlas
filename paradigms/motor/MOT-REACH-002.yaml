  citation: Waldert S, Preissl H, Demandt E, Braun C, Birbaumer N, Aertsen A, Mehring C. Hand movement direction decoded from
    MEG and EEG. Journal of Neuroscience. 2008;28(4):1000-1008.
  doi: 10.1523/JNEUROSCI.5171-07.2008
  year: 2008
  verified: false
