schema_version: '0.2'
id: MOT-MI-005
class: MOT-MI
name:
  en: Left/right-hand motor imagery with continuous visual feedback
  zh: 带连续视觉反馈的左/右手运动想象
aliases:
- Graz feedback paradigm
- smiley feedback
- BCI Competition IV 2b feedback sessions
family: motor
bci_category:
- active
recording_modality:
- EEG
stimulus_modality:
- mental_imagery
- visual
markers:
- MK.SMR_ERD
description:
  en: As in the two-class cue-based paradigm, an arrow cue instructs left- or right-hand imagery, but during the imagery period
    the output of an online classifier is fed back continuously as a moving visual object (e.g. a smiley moving left or right).
    The closed loop lets participants adjust their sensorimotor rhythm modulation within the trial.
  zh: 与二分类提示范式相同，箭头提示被试想象左手或右手；不同的是在想象期内，在线分类器的输出以移动的视觉对象（如向左或向右移动的笑脸）连续反馈给被试。闭环使被试能在试次内调整其感觉运动节律调制。
protocol:
  n_classes: 2
  classes:
  - left hand
  - right hand
  cue: visual arrow cue
  paradigm_timing: synchronous
  feedback: continuous
  distinguishing: 'Criterion 4 vs MOT-MI-001: same class set and cue, but continuous online visual feedback of the classifier
    output (closed loop) instead of no feedback.'
first_source:
