schema_version: '0.2'
id: MOT-ME-001
class: MOT-ME
name:
  en: Motor execution
  zh: 运动执行
aliases:
- executed movement
- overt movement
family: motor
bci_category:
- active
- none
recording_modality:
- EEG
- MEG
- ECoG
- fMRI
- fNIRS
stimulus_modality:
- motor_execution
- visual
- auditory
markers:
- MK.SMR_ERD
- MK.high_gamma
- MK.BOLD_motor_network
description:
  en: >-
    Participants perform a brief overt movement of one hand or finger (e.g. finger flexion, hand opening/closing) on cue,
    alternating with rest. Movement produces contralateral sensorimotor mu/beta ERD with post-movement beta rebound and, in
    intracranial recordings, focal high-gamma increases.
  zh: 被试按提示完成一侧手或手指的短暂实际动作（如手指屈曲、手的张合），与休息交替。运动引起对侧感觉运动区 mu/β ERD 及运动后 β 反弹，颅内记录中可见局灶性高 γ 增强。
protocol:
  n_classes: 2
  classes:
  - hand/finger movement
  - rest
  cue: visual cue
  paradigm_timing: synchronous
  feedback: none
  distinguishing: >-
    Standard configuration (earliest published) / 标准配置（最早发表）: cued overt unilateral hand or finger movement contrasted with
    rest, sensorimotor ERD/ERS (class origin R0928). Siblings: -002 individual finger movements (criterion 1), -003 walking
    (criteria 1, 3), -004 paced finger tapping blocks (criteria 2, 3), -005 single upper-limb multi-joint movements (criterion
    1).
first_source:
  citation: >-
    Szurhaj W, Labyt E, Bourriez JL, Cassim F, Defebvre L, Hauser JJ, Guieu JD, Derambure P. Event-related variations in the
    activity of EEG-rhythms. Application to the physiology and the pathology of movements. 2001;(Spec Issue 2):59-66.
  pmid: '11781201'
  year: 2001
  verified: false
