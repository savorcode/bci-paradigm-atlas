notes: >-
  HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_finger_tapping.html. Leads: R0145, R0189, R0280, R0405, R0837,
  R0871, R0878, R0908, R0928, R0946, R0955, R0959, R0960, R0994. first_source R0928 is a title-only lead (PMID present); authors/year
  to be confirmed. Memory leads (unverified): Pfurtscheller & Aranibar 1979; Crone et al. 1998 Brain (ECoG high gamma). BCI
  Competition IV dataset 4 entered from the merged MOT-FING-001 candidate (content from memory per task sheet; verify). Sprint
  2 (D-057): the three variants were configuration changes and are now MOT-ME-002 (individual fingers, BCI Competition IV
  dataset 4 moved there), MOT-ME-003 (walking) and MOT-ME-004 (paced finger tapping; tapping aliases and the HED finger-tapping
  page moved there). The configuration of R0928 (title-only lead) is still to be confirmed; the PhysioNet runs use a visual
  target and opening/closing of the fist (MOABB page). [maintainer, sprint 2] Lead registered as R1291 (literature.csv). bibliography
  corrected (OpenAlex, 2026-10-05)
