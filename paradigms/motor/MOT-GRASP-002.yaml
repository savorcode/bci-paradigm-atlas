description:
  en: >-
    Participants form one of four complex hand gestures after a visual cue, and the gesture is classified from high-density
    electrocorticography over hand sensorimotor cortex. Gesture-specific high-gamma patterns carry the information.
  zh: 被试按视觉提示做出 4 种复杂手势之一，依据覆盖手部感觉运动皮层的高密度皮层脑电对手势分类。手势特异的高 γ 模式提供信息。
protocol:
  n_classes: 4
  classes:
  - gesture 1
  - gesture 2
  - gesture 3
  - gesture 4
  cue: visual cue (gesture picture)
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Criterion 1 vs MOT-GRASP-001: four static hand gestures (postures) instead of object-directed grasp types.'
