  citation: >-
    Bleichner MG, Freudenburg ZV, Jansma JM, Aarnoutse EJ, Vansteensel MJ, Ramsey NF. Give me a sign: decoding four complex
    hand gestures based on high-density ECoG. Brain Structure and Function. 2016;221(1):203-216.
  doi: 10.1007/s00429-014-0902-x
