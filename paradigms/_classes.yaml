  - curator_d
  - curator_c
- id: LAN-READ
  name:
    en: Natural reading with eye tracking
    zh: 自然阅读（眼动同步）
  family: language
  description:
    en: Participants read sentences or texts freely while EEG and eye movements are recorded simultaneously, and EEG epochs
      are time-locked to the onset of fixations on words. Fixation-related potentials reveal word-level effects such as predictability,
      which can be compared with ERPs from serial word-by-word presentation.
    zh: 被试自由阅读句子或文本，同时记录 EEG 和眼动，EEG 以注视词语的起始时刻为锁时点进行分段。注视相关电位可揭示可预测性等词汇层面的效应，并可与逐词序列呈现所得的 ERP 相比较。
  markers:
  - MK.FRP
  first_source:
    citation: 'Dimigen O, Sommer W, Hohlfeld A, Jacobs AM, Kliegl R. Coregistration of eye movements and EEG in natural reading:
      Analyses and review. Journal of Experimental Psychology: General. 2011;140(4):552-572.'
    doi: 10.1037/a0023885
    year: 2011
    verified: false
  aliases:
  - co-registered EEG/eye-tracking reading
  - fixation-related potentials (FRP)
  - natural reading
  notes: migrated from schema-0.1 file LAN-READ-001. bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-SC
  name:
    en: Sentence comprehension
    zh: 句子理解
  family: language
  description:
    en: Participants read or listen to sentences that vary in structural complexity or temporary ambiguity, such as object-
      versus subject-relative clauses or garden-path sentences, and answer comprehension questions. Complex or reanalysis-requiring
      sentences increase BOLD activity in the left frontotemporal language network and modulate N400 and P600 responses at
      the critical words.
    zh: 被试阅读或聆听结构复杂度或暂时歧义程度不同的句子（如宾语关系从句与主语关系从句、花园路径句），并回答理解问题。复杂句或需要重新分析的句子提高左侧额颞语言网络的 BOLD 活动，并在关键词处调制 N400 和 P600 响应。
  markers:
  - MK.N400
  - MK.P600
  - MK.BOLD_language_network
  first_source:
    citation: 'Frazier L, Rayner K. Making and correcting errors during sentence comprehension: Eye movements in the analysis
      of structurally ambiguous sentences. Cognitive Psychology. 1982;14(2):178-210.'
    doi: 10.1016/0010-0285(82)90008-1
    year: 1982
    verified: false
  aliases:
  - Garden-Path Reading
  - Syntactic Ambiguity Task
  - sign language sentence comprehension
  - sign language comprehension
  - ASL sentence processing
  notes: 'migrated from schema-0.1 file LAN-SC-001; sprint 2 (D-057): aliases updated from curation/work/pkg_D/sprint2/class_updates.yaml.
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_d
  - curator_c
- id: LAN-SEMD
  name:
    en: Semantic decision task
    zh: 语义判断任务（语言定位）
  family: language
  description:
    en: Participants hear or read words, typically animal names, and decide whether each meets a semantic criterion, compared
      with a control task such as deciding whether a tone sequence contains a target pitch. The semantic-minus-tone contrast
      activates a left-lateralised network of frontal, temporal and parietal regions and is used for presurgical language
      lateralisation.
    zh: 被试听或读词语（通常为动物名称），判断其是否满足某个语义标准，并与对照任务（如判断音调序列中是否包含目标音高）比较。“语义减音调”对比激活左侧化的额、颞、顶区网络，用于术前语言偏侧化评估。
  markers:
  - MK.BOLD_language_network
  first_source:
    citation: Binder JR, Rao SM, Hammeke TA, Frost JA, Bandettini PA, Jesmanowicz A, Hyde JS. Lateralized Human Brain Language
      Systems Demonstrated by Task Subtraction Functional Magnetic Resonance Imaging. Archives of Neurology. 1995;52(6):593-601.
    doi: 10.1001/archneur.1995.00540300067015
    pmid: '7763208'
    year: 1995
    verified: false
  aliases:
  - semantic decision vs tone decision
  - animal semantic decision
  - semantic categorization
  notes: migrated from schema-0.1 file LAN-SEMD-001. bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-SIS
  name:
    en: Speaking-induced suppression / altered auditory feedback
    zh: 言语诱发抑制与听觉反馈
  family: language
  description:
    en: Participants produce speech sounds while hearing their own voice, and the auditory responses are compared with passive
      listening to recordings of the same sounds; in feedback-perturbation versions the pitch or formants of the voice are
      shifted in real time. Auditory-cortex responses (M100/N1 and high-gamma activity) are suppressed during speaking compared
      with listening, and the suppression is reduced when the feedback is altered.
    zh: 被试发出言语声音并听到自己的声音，将其听觉响应与被动聆听同一声音录音时的响应进行比较；在反馈扰动版本中，实时改变声音的音高或共振峰。与聆听相比，说话时听皮层响应（M100/N1 和高 γ 活动）受到抑制，反馈被改变时抑制减弱。
  markers:
  - MK.N1_auditory
  - MK.high_gamma
  first_source:
    citation: Curio G, Neuloh G, Numminen J, Jousmäki V, Hari R. Speaking modifies voice-evoked activity in the human auditory
      cortex. Human Brain Mapping. 2000;9(4):183-191.
    doi: 10.1002/(sici)1097-0193(200004)9:4<183::aid-hbm1>3.0.co;2-z
    pmid: '10770228'
    year: 2000
    verified: false
  aliases:
  - speaking-induced suppression
  - SIS
  - altered auditory feedback
  - speak vs listen
  - pitch perturbation
  - feedback perturbation during speech
  notes: 'migrated from schema-0.1 file LAN-SIS-001; sprint 2 (D-057): aliases updated from curation/work/pkg_D/sprint2/class_updates.yaml.
    bibliography corrected (OpenAlex, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_d
  - curator_c
- id: LAN-SL
  name:
    en: Statistical learning of speech streams
    zh: 统计学习（言语切分）
  family: language
  description:
    en: Participants are exposed to a continuous stream of syllables (or visual shapes) in which items form recurring 'words'
      defined only by transitional probabilities, and are then tested on recognising the embedded words. As learning proceeds,
      neural responses come to track the word rate in addition to the syllable rate, a frequency-tagged index of segmentation.
    zh: 被试接触连续的音节流（或视觉图形流），其中项目组成仅由转移概率界定、反复出现的“词”，随后测试其对嵌入词的再认。随着学习进行，神经响应除了跟随音节频率外，还开始跟随词频率，这一频率标记指标反映了切分过程。
  markers:
  - MK.linguistic_structure_tracking
  first_source:
    citation: Saffran JR, Aslin RN, Newport EL. Statistical Learning by 8-Month-Old Infants. Science. 1996;274(5294):1926-1928.
    doi: 10.1126/science.274.5294.1926
    pmid: '8943209'
    year: 1996
    verified: false
  aliases:
  - statistical word segmentation
  - triplet stream learning
  - auditory statistical learning
  notes: migrated from schema-0.1 file LAN-SL-001. bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-SWITCH
  name:
    en: Bilingual language switching
    zh: 双语语言切换
  family: language
  description:
    en: Bilingual participants name pictures or digits, or comprehend words, in one of their languages as indicated by a cue,
      with the language either repeating or switching between trials. Switch trials incur reaction-time costs, and ERP studies
      report an enhanced frontocentral N2 on switch trials that is interpreted as inhibition of the non-target language.
    zh: 双语被试根据线索用其中一种语言命名图片或数字，或理解词语，相邻试次的语言或重复或切换。切换试次产生反应时代价，ERP 研究报告切换试次额中央 N2 增强，被解释为对非目标语言的抑制。
  markers:
  - MK.N2_frontocentral
  first_source:
