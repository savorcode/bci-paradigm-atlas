- id: SOC-ANIM
  name:
    en: Animated shapes mentalizing (Frith-Happé animations)
    zh: 几何图形动画心智化（Frith-Happé 动画）
  family: social
  description:
    en: Short animations of moving geometric shapes depict interactions that invite mental-state attribution (e.g. coaxing,
      mocking), goal-directed actions or random movement, and participants describe or classify them. Mental-state animations
      increase activity in the temporoparietal junction and medial prefrontal cortex.
    zh: 短动画中移动的几何图形表现出诱发心理状态归因的互动（如哄骗、嘲弄）、目标导向动作或随机运动，被试对其进行描述或分类。心理状态类动画增强颞顶联合区与内侧前额叶的活动。
  markers:
  - MK.BOLD_TPJ
  - MK.BOLD_mPFC
