- id: MEM-RPRIM
  name:
    en: Repetition priming
    zh: 重复启动（内隐记忆）
  family: memory
  description:
    en: Stimuli such as words, pictures or faces are presented once and later repeated, usually in an incidental task, and
      behavioural facilitation for repeated items is measured without requiring conscious recollection. Repeated items evoke
      reduced BOLD responses in ventral visual and prefrontal cortex (repetition suppression) and, for words, an attenuated
      N400 relative to first presentations.
    zh: 词语、图片或面孔等刺激先呈现一次，之后（通常在附带任务中）重复呈现，在不要求有意识回忆的情况下测量重复项目的行为易化。与首次呈现相比，重复项目在腹侧视觉皮层和前额叶诱发较弱的 BOLD 响应（重复抑制），对于词语还表现为 N400
      减弱。
  markers:
  - MK.BOLD_category_selective
  - MK.N400
  first_source:
    citation: 'Scarborough DL, Cortese C, Scarborough HS. Frequency and repetition effects in lexical memory. Journal of Experimental
      Psychology: Human Perception and Performance. 1977;3(1):1-17.'
    doi: 10.1037/0096-1523.3.1.1
    year: 1977
    verified: false
  aliases:
  - repetition suppression
  - fMRI adaptation (memory)
  - word repetition effect
  - implicit memory priming
  notes: 'migrated from schema-0.1 file MEM-RPRIM-001. first_source TBD resolved by bibliographic search (Crossref, 2026-10-05;
