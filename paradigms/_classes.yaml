- id: LAN-N400
  name:
    en: Semantic violation
    zh: 语义违例
  family: language
  description:
    en: Sentences are presented word by word, visually or auditorily, and end either with a congruent word or with a semantically
      anomalous or less expected word. Anomalous and unexpected sentence-final words elicit a larger centro-parietal negativity,
      the N400, whose amplitude decreases with the word's expectancy in context.
    zh: 以视觉或听觉方式逐词呈现句子，句末为语义一致的词，或为语义违例或较不符合预期的词。违例和意外的句末词诱发更大的中央—顶区负波 N400，其波幅随该词在语境中的预期程度提高而减小。
  markers:
  - MK.N400
  first_source:
    citation: Kutas M, Hillyard SA. Event-related brain potentials to semantically inappropriate and surprisingly large words.
      Biological Psychology. 1980;11(2):99-116.
    doi: 10.1016/0301-0511(80)90046-0
    pmid: '7272388'
    year: 1980
    verified: false
  aliases:
  - semantic anomaly
  - semantic incongruity
  - sentence N400 paradigm
  - cloze probability N400
  - word expectancy N400
