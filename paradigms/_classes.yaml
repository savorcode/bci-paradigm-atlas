- id: PER-MASK
  name:
    en: Masking / threshold perception
    zh: 掩蔽与阈限知觉
  family: perception
  description:
    en: 'A brief target is followed (backward masking) or surrounded (metacontrast) by a mask, and the target-mask interval
      is varied around the visibility threshold. Seen versus unseen trials are compared: awareness is associated with a posterior
      visual awareness negativity and a later P3b.'
    zh: 短暂呈现的靶刺激之后跟随掩蔽刺激（后向掩蔽）或被其环绕（元对比掩蔽），并在可见性阈限附近改变靶–掩蔽间隔。比较“看见”与“未看见”试次：觉知与后部视觉觉知负波（VAN）及其后的 P3b 相关。
  markers:
  - MK.VAN
  - MK.P3b
