- id: SSR-ASSR
  name:
    en: Auditory steady-state response (ASSR)
    zh: 听觉稳态响应
  family: steady_state
  description:
    en: Clicks or amplitude-modulated tones are presented at a constant rate, typically around 40 Hz or 80-100 Hz. The auditory
      system follows the modulation rate, producing an auditory steady-state response at that frequency, which is used to
      estimate hearing thresholds, to probe gamma-band function and, with streams at different rates, as an auditory BCI.
    zh: 以恒定速率呈现短声或调幅音，通常约 40 Hz 或 80–100 Hz。听觉系统跟随调制频率，在该频率产生听觉稳态响应，用于估计听阈、探查 γ 频段功能；多路不同频率的声流也可用于听觉脑机接口。
  markers:
  - MK.ASSR
  first_source:
    citation: Galambos R, Makeig S, Talmachoff PJ. A 40-Hz auditory potential recorded from the human scalp. Proc Natl Acad
      Sci U S A. 1981;78(4):2643-2647.
    doi: 10.1073/pnas.78.4.2643
    year: 1981
    verified: false
  aliases:
  - 40-Hz ASSR
  - AM-tone ASSR
  - ASSR
  - auditory steady-state evoked potential
  - ASSR BCI
  - vision-free ASSR BCI
