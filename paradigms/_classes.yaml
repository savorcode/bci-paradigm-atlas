- id: MEM-SWM
  name:
    en: Spatial working memory
    zh: 空间工作记忆
  family: memory
  description:
    en: Participants maintain a sequence or set of spatial locations (for example blocks tapped by the experimenter in the
      Corsi task, or locations in a delayed-response or self-ordered search task) and reproduce or recognize them after a
      delay. Spatial working-memory maintenance engages frontoparietal hemodynamic activity, and in lateralized EEG versions
      produces a contralateral delay activity over posterior sites.
    zh: 被试保持一个空间位置序列或集合（如 Corsi 任务中主试敲击的方块，或延迟反应、自定顺序搜索任务中的位置），并在延迟后复现或再认。空间工作记忆的保持引起额顶网络血流动力学活动，在偏侧化 EEG 版本中还在后部电极产生对侧延迟活动。
