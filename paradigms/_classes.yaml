- id: PER-NAT
  name:
    en: Naturalistic image / movie viewing
    zh: 自然图像与影片观看
  family: perception
  description:
    en: Participants freely view natural images or continuous films without an explicit task. Stimulus-driven activity is
      identified as inter-subject correlation of the time courses across viewers and with visual cortex BOLD encoding of image
      features.
    zh: 被试在无明确任务的情况下自由观看自然图像或连续影片。以被试间时间进程的相关（ISC）以及视皮层 BOLD 对图像特征的编码来识别刺激驱动的活动。
  markers:
  - MK.ISC
  - MK.BOLD_visual_cortex
