- id: LAN-AGL
  name:
    en: Artificial grammar learning
    zh: 人工语法学习
  family: language
  description:
    en: Participants are exposed to letter or tone strings generated by a finite-state artificial grammar and are then asked
      to classify new strings as grammatical or ungrammatical. After learning, grammar violations elicit ERP responses resembling
      those to natural-language or music-syntactic violations, including a late positivity (P600) and an early anterior negativity
      (ERAN-like).
    zh: 被试接触由有限状态人工语法生成的字母串或音调串，随后对新串进行合乎语法或不合乎语法的分类。学习之后，语法违例诱发与自然语言或音乐句法违例相似的 ERP 响应，包括晚期正波（P600）和早期前部负波（类 ERAN）。
  markers:
  - MK.P600
  - MK.ERAN
  first_source:
    citation: Reber, A. S. Implicit learning of artificial grammars. Journal of Verbal Learning and Verbal Behavior, 6(6),
      855–863. 1967.
    doi: 10.1016/s0022-5371(67)80149-x
    year: 1967
    verified: false
  aliases:
  - AGL
  - Artificial Grammar
  notes: migrated from schema-0.1 file LAN-AGL-001. bibliography confirmed (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-CPS
  name:
    en: Prosodic boundary processing (closure positive shift)
    zh: 韵律边界加工
  family: language
  description:
    en: Participants listen to naturally spoken sentences that differ in the number or position of intonational phrase boundaries,
      sometimes with otherwise identical words, or read sentences in which commas mark phrase boundaries. Each prosodic boundary
      elicits a positive shift (closure positive shift, CPS) over centro-parietal sites, which indexes prosodic phrasing independently
      of the acoustic pause.
    zh: 被试聆听自然朗读的句子，这些句子在语调短语边界的数量或位置上不同（有时词语完全相同），或阅读以逗号标示短语边界的句子。每个韵律边界在中央—顶区诱发正向偏移（闭合正漂移，CPS），反映韵律切分，且不依赖于声学停顿本身。
  markers:
  - MK.CPS
  first_source:
    citation: Steinhauer K, Alter K, Friederici AD. Brain potentials indicate immediate use of prosodic cues in natural speech
      processing. Nature Neuroscience. 1999;2(2):191-196.
    doi: 10.1038/5757
    year: 1999
    verified: false
  aliases:
  - CPS paradigm
  - intonational phrase boundary
  - prosodic phrasing
  - comma CPS
  - reading CPS
  notes: 'migrated from schema-0.1 file LAN-CPS-001; sprint 2 (D-057): aliases updated from curation/work/pkg_D/sprint2/class_updates.yaml.
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_d
  - curator_c
- id: LAN-GEST
  name:
    en: Speech-gesture integration
    zh: 言语—手势整合
  family: language
  description:
    en: Participants watch videos of a speaker producing words or sentences accompanied by iconic hand gestures that either
      match or mismatch the speech, sometimes with varied timing between gesture and speech. Gestures that are semantically
      incongruent with the accompanying speech elicit a larger N400 than congruent gestures, indicating integration of gestural
      and verbal meaning.
    zh: 被试观看说话者的视频，说话时伴随的形象手势与言语内容一致或不一致，有时还改变手势与言语的时间关系。与一致手势相比，与言语语义不一致的手势诱发更大的 N400，表明手势意义与言语意义发生了整合。
  markers:
  - MK.N400
  first_source:
    citation: Kelly SD, Kravitz C, Hopkins M. Neural correlates of bimodal speech and gesture comprehension. Brain and Language.
      2003;89(1):253-260.
    doi: 10.1016/s0093-934x(03)00335-3
    year: 2003
    verified: false
  aliases:
  - co-speech gesture
  - iconic gesture comprehension
  - gesture-speech mismatch
  notes: 'migrated from schema-0.1 file LAN-GEST-001. first_source TBD resolved by bibliographic search (OpenAlex, 2026-10-05; curator_c):
    candidate origin found by bibliographic search; content unverified. Previous entry: "TBD: no origin source identified
    yet (see curation/work/pkg_D/status.csv)" [maintainer sprint 3, 2026-10-07] bibliography confirmed (OpenAlex, 2026-10-05;
    origin candidate, content unverified).'
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-HIER
  name:
    en: Hierarchical linguistic structure tracking
    zh: 语言层级结构频率标记
  family: language
  description:
    en: Isochronous sequences of syllables are presented in which syllables combine into phrases and sentences that carry
      no acoustic cue to their boundaries; control sequences use random syllables or an unknown language. Cortical responses
      show spectral peaks not only at the syllable rate but also at the phrase and sentence rates, which appear only when
      listeners can parse the linguistic structure.
    zh: 呈现等时的音节序列，音节组合成短语和句子，但边界处没有任何声学线索；对照序列使用随机音节或被试不懂的语言。皮层响应不仅在音节频率处出现谱峰，还在短语与句子频率处出现谱峰，且只有当听者能够解析语言结构时才出现。
  markers:
  - MK.linguistic_structure_tracking
  first_source:
    citation: Ding N, Melloni L, Zhang H, Tian X, Poeppel D. Cortical tracking of hierarchical linguistic structures in connected
      speech. Nature Neuroscience. 2016;19(1):158-164.
    doi: 10.1038/nn.4186
    year: 2016
    verified: false
  aliases:
  - Ding paradigm
  - frequency-tagging of linguistic structure
  - hierarchical linguistic tracking
  notes: migrated from schema-0.1 file LAN-HIER-001. bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-LDT
  name:
    en: Lexical decision
    zh: 词汇判断
  family: language
  description:
    en: Letter strings (or spoken forms) are presented one at a time and participants decide as quickly as possible whether
      each is a real word or a pronounceable pseudoword, while lexical variables such as frequency are manipulated. Words
      and pseudowords differ in the N400, whose amplitude is also modulated by lexical variables such as word frequency.
    zh: 逐个呈现字母串（或口语形式），被试尽快判断其为真词还是可发音的假词，同时操纵词频等词汇变量。真词与假词的 N400 不同，N400 波幅也受词频等词汇变量调制。
  markers:
  - MK.N400
  first_source:
    citation: 'Meyer, D. E., & Schvaneveldt, R. W. Facilitation in recognizing pairs of words: Evidence of a dependence between
      retrieval operations. Journal of Experimental Psychology, 90(2), 227-234. 1971.'
    doi: 10.1037/h0031564
    pmid: '5134329'
    year: 1971
    verified: false
  aliases:
  - LDT
  - word/nonword decision
  notes: migrated from schema-0.1 file LAN-LDT-001. bibliography confirmed (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: LAN-LOC
  name:
    en: Language localizer (sentences vs nonwords)
    zh: 语言定位任务
  family: language
  description:
    en: Participants read or listen to blocks of sentences and of control stimuli such as lists of pronounceable nonwords,
      and the sentences > nonwords contrast is used to define language-responsive regions in each individual. The contrast
      identifies a left-lateralised frontotemporal language network whose BOLD response is then examined in other conditions.
    zh: 被试阅读或聆听句子组块和对照刺激组块（如可发音假词列表），用“句子 > 假词”对比在每名被试中界定对语言敏感的脑区。该对比确定一个左侧化的额颞语言网络，随后在其他条件下考察该网络的 BOLD 响应。
  markers:
  - MK.BOLD_language_network
  first_source:
    citation: 'Fedorenko E, Hsieh PJ, Nieto-Castañón A, Whitfield-Gabrieli S, Kanwisher N. New Method for fMRI Investigations
      of Language: Defining ROIs Functionally in Individual Subjects. Journal of Neurophysiology. 2010;104(2):1177-1194.'
    doi: 10.1152/jn.00032.2010
    pmid: '20410363'
    year: 2010
