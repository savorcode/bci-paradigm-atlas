- id: IMG-VIS
  name:
    en: Visual imagery
    zh: 视觉想象
  family: imagery
  description:
    en: Participants generate a visual mental image of a cued object, scene or pattern with eyes closed or while viewing a
      blank screen, often compared with perceiving the same item. Imagery modulates posterior alpha power and activates visual
      cortex, with category-specific activation of ventral regions such as the fusiform face area or parahippocampal place
      area for imagined faces or places.
    zh: 被试在闭眼或注视空白屏幕时，对提示的物体、场景或图案生成视觉心理表象，常与实际知觉同一内容相比较。想象调制后部 α 功率并激活视觉皮层；想象面孔或场所时，梭状回面孔区或海马旁回位置区等腹侧区域出现类别特异性激活。
  markers:
  - MK.alpha_posterior
  - MK.BOLD_visual_cortex
  - MK.BOLD_category_selective
  first_source:
    citation: 'Kosslyn SM, Pascual-Leone A, Felician O, Camposano S, Keenan JP, Thompson WL, Ganis G, Sukel KE, Alpert NM.
      The role of area 17 in visual imagery: convergent evidence from PET and rTMS. Science. 1999;284(5411):167-170.'
