- id: MEM-CFMT
  name:
    en: Cambridge face memory test
    zh: 剑桥面孔记忆
  family: memory
  description:
    en: Participants learn unfamiliar faces from several viewpoints and then identify the learned face among distractor faces
      in three-alternative forced-choice trials of increasing difficulty, including novel views and added visual noise. Performance
      on the test is used to characterise individual face-recognition ability and is related to face-selective neural responses
      such as the N170 and BOLD activity in face-selective ventral visual cortex.
    zh: 被试从多个视角学习陌生面孔，然后在难度递增的三选一强迫选择试次中（包括新视角和加噪声的图片）从干扰面孔中识别学过的面孔。该测验用于刻画个体的面孔识别能力，其成绩与面孔选择性的神经响应（如 N170 和腹侧视觉皮层面孔选择区的 BOLD
      活动）相关。
  markers:
  - MK.N170
  - MK.BOLD_category_selective
  first_source:
    citation: 'Duchaine, B., & Nakayama, K. The Cambridge Face Memory Test: Results for neurologically intact individuals
      and an investigation of its validity using inverted face stimuli and prosopagnosic participants. Neuropsychologia, 44(4),
      576–585. 2006.'
    doi: 10.1016/j.neuropsychologia.2005.07.001
    pmid: '16169565'
    year: 2006
