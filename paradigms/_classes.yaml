  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-SEP
  name:
    en: Median-nerve somatosensory evoked potential
    zh: 正中神经体感诱发电位
  family: stimulation
  description:
    en: Brief electrical pulses are applied to the median nerve at the wrist at a low repetition rate, and EEG/MEG responses
      are averaged over hundreds of stimuli. The earliest cortical response, the N20 over the contralateral parietal scalp,
      reflects activation of primary somatosensory cortex and is used clinically and as a timing reference.
    zh: 以低重复频率在腕部向正中神经施加短暂电脉冲，对数百次刺激的 EEG/MEG 响应进行平均。最早的皮层响应——对侧顶区头皮上的 N20——反映初级体感皮层的激活，用于临床评估并作为时间参照。
  markers:
  - MK.SEP_N20
  first_source:
    citation: Dawson GD. Cerebral responses to electrical stimulation of peripheral nerve in man. Journal of Neurology, Neurosurgery
      and Psychiatry. 1947;10(3):134-140.
    doi: 10.1136/jnnp.10.3.134
    year: 1947
    verified: false
  aliases:
  - SEP
  - SSEP
  - somatosensory evoked potential
  - N20
  notes: migrated from schema-0.1 file STM-SEP-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
