- id: SSR-FPAS
  name:
    en: Fast periodic auditory stimulation
    zh: 快速周期听觉刺激
  family: steady_state
  description:
    en: Short sounds are presented at a fast fixed rate, with sounds of a target category (for example voices) inserted at
      a slower periodic rate. A response at the oddball frequency indicates category discrimination, analogous to visual FPVS.
    zh: 以较快的固定速率呈现短声，并以较慢的周期速率插入目标类别的声音（如人声）。oddball 频率处的响应表明类别辨别，与视觉 FPVS 相类似。
  markers:
  - MK.FPAS_oddball
  first_source:
    citation: Barbero F, Calce RP, Rossion B, Collignon O. Fast periodic auditory stimulation reveals a robust voice-selective
      electrophysiological response in the human brain. B-Audio conference, Louvain-la-Neuve. 2019.
    year: 2019
    verified: false
  aliases:
  - FPAS
  - auditory frequency-tagging oddball
  notes: migrated from schema-0.1 file SSR-FPAS-001
  status: draft
  contributors:
  - maintainer
- id: SSR-FPVS
  name:
    en: Fast periodic visual stimulation (FPVS)
    zh: 快速周期视觉刺激（频率标记）
  family: steady_state
  description:
    en: Images are presented at a fast fixed rate (for example 6 Hz), and an image of a different category or identity appears
      at a slower periodic rate (for example every fifth image). A response at the oddball frequency and its harmonics, separate
      from the base-frequency response, indicates that the brain discriminates the oddball category.
    zh: 以较快的固定速率（如 6 Hz）呈现图像，并以较慢的周期速率（如每第五张）插入不同类别或身份的图像。在 oddball 频率及其谐波处出现、区别于基频响应的反应，表明大脑对 oddball 类别进行了辨别。
  markers:
  - MK.FPVS_oddball
  first_source:
    citation: Liu-Shuang J, Norcia AM, Rossion B. An objective index of individual face discrimination in the right occipito-temporal
      cortex by means of fast periodic oddball stimulation. Neuropsychologia. 2014;52:57-72.
    doi: 10.1016/j.neuropsychologia.2013.10.022
    year: 2014
    verified: false
