- id: MEM-SRC
  name:
    en: Source memory
    zh: 来源记忆
  family: memory
  description:
    en: Items are studied in one of two or more contexts (for example presented on the left or right, in one of two voices,
      or with one of two encoding tasks); at test, participants recognise items and report the context in which each was studied.
      Retrieval of source information is associated with a late, sustained right frontal old/new ERP effect in addition to
      the earlier recognition effects.
    zh: 项目在两种或以上的情境之一中学习（如呈现在左侧或右侧、由两种声音之一朗读、配合两种编码任务之一）；测试时被试再认项目并报告其学习情境。除较早的再认效应外，来源信息的提取还伴随晚期持续的右额新旧 ERP 效应。
