      Nest T, Orban C, Leech R, Williams LT, Williams TM, Bolstridge M, Sessa B, McGonigle J, Sereno MI, Nichols D, Hellyer
      PJ, Hobden P, Evans J, Singh KD, Wise RG, Curran HV, Feilding A, Nutt DJ. Neural correlates of the LSD experience revealed
      by multimodal neuroimaging. Proceedings of the National Academy of Sciences. 2016;113(17):4853-4858.
    doi: 10.1073/pnas.1518377113
    year: 2016
    verified: false
