- id: LAN-PN
  name:
    en: Picture naming
    zh: 图片命名
  family: language
  description:
    en: Participants name pictures of objects or actions aloud as quickly and accurately as possible; versions with distractor
      words test lexical selection. Naming engages left-lateralised language and speech-motor regions in fMRI, and ECoG shows
      sequential high-gamma increases from visual to temporal, frontal and sensorimotor cortex, which is used clinically for
      language mapping.
    zh: 被试尽快、准确地说出物体或动作图片的名称；带有干扰词的版本用于考察词汇选择。命名在 fMRI 中激活左侧化的语言和言语运动区，ECoG 显示高 γ 活动依次从视觉皮层扩展到颞叶、额叶和感觉运动皮层，并被用于临床语言定位。
  markers:
  - MK.high_gamma
  - MK.BOLD_language_network
  first_source:
    citation: Crone NE, Hao L, Hart J, Boatman DF, Lesser RP, Irizarry RA, Gordon B. Electrocorticographic gamma activity
      during word production in spoken and sign language. Neurology. 2001;57(11):2045-2053.
    doi: 10.1212/wnl.57.11.2045
    pmid: '11739824'
    year: 2001
    verified: false
  aliases:
  - Confrontation Naming
  - Object Naming
  - picture-word interference (variant)
  - visual naming
  - PWI
  - picture-word interference paradigm
  - semantic interference in naming
