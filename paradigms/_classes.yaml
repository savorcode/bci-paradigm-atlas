- id: MOT-SRT
  name:
    en: Serial reaction time task
    zh: 序列反应时（运动序列学习）
  family: motor
  description:
    en: Participants press the key corresponding to the location of a visual cue; unknown to them, cue locations follow a
      repeating sequence, and switching to a random sequence reveals implicit learning as a reaction-time cost. Sequence learning
      is reflected in earlier lateralized readiness potentials and in modulation of sensorimotor beta activity.
    zh: 被试按与视觉提示位置对应的键作答；提示位置在被试不知情的情况下遵循重复序列，切换为随机序列时出现的反应时代价揭示了内隐学习。序列学习表现为偏侧化准备电位提前以及感觉运动 β 活动的调制。
  markers:
  - MK.LRP
  - MK.SMR_ERD
  first_source:
    citation: 'Nissen MJ, Bullemer P. Attentional requirements of learning: evidence from performance measures. Cognitive
      Psychology. 1987;19(1):1-32.'
    doi: 10.1016/0010-0285(87)90002-8
    year: 1987
    verified: false
  aliases:
  - SRTT
  - Serial RT
  - Serial Reaction Time
  - serial reaction time task
