- id: IMG-TACT
  name:
    en: Tactile imagery
    zh: 触觉想象
  family: imagery
  description:
    en: Participants first experience a tactile stimulus (e.g. vibration on the wrist) and then, on cued trials, imagine that
      sensation in its absence. Tactile imagery produces mu-band ERD over the contralateral somatosensory cortex that can
      be classified, in a way comparable to motor imagery.
    zh: 被试先体验触觉刺激（如腕部振动），随后在提示试次中在无刺激时想象该感觉。触觉想象在对侧体感皮层引起可被分类的 mu 频段 ERD，方式与运动想象相似。
  markers:
