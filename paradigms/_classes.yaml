- id: MEM-RMEM
  name:
    en: Reward-motivated memory encoding
    zh: 奖赏驱动的记忆编码
  family: memory
  description:
    en: Before each item is studied, a cue signals whether successfully remembering it will earn a high or a low reward; memory
      is tested later, often after a delay. High-reward cues increase activity in the mesolimbic reward system, and anticipatory
      reward-related activity together with hippocampal activity predicts better subsequent memory.
    zh: 每个项目学习前，线索提示成功记住该项目将获得高奖赏或低奖赏，之后（常在延迟后）测试记忆。高奖赏线索提高中脑边缘奖赏系统的活动，预期性的奖赏相关活动与海马活动共同预测更好的后续记忆。
  markers:
  - MK.BOLD_striatum_reward
  - MK.BOLD_hippocampus
  first_source:
    citation: 'Adcock RA, Thangavel A, Whitfield-Gabrieli S, Knutson B, Gabrieli JDE. Reward-Motivated Learning: Mesolimbic
      Activation Precedes Memory Formation. Neuron. 2006;50(3):507-517.'
    doi: 10.1016/j.neuron.2006.03.036
    year: 2006
    verified: false
  aliases:
  - reward-motivated memory
  - high/low reward encoding
  - value-directed remembering
