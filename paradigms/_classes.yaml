- id: MOT-FORCE
  name:
    en: Isometric force control
    zh: 等长力控制
  family: motor
  description:
    en: Participants maintain or track a target force with an isometric muscle contraction (e.g. pinch or wrist extension)
      while EEG/MEG and surface EMG are recorded. Sustained contraction is accompanied by beta-band coherence between contralateral
      motor cortex and the active muscle, together with modulation of sensorimotor beta power.
    zh: 被试以等长收缩（如捏力或伸腕）维持或跟踪目标力，同时记录 EEG/MEG 和表面肌电。持续收缩期间，对侧运动皮层与活动肌肉之间出现 β 频段相干，并伴随感觉运动 β 功率的调制。
  markers:
  - MK.SMR_ERD
  - MK.corticomuscular_coherence
  first_source:
    citation: Conway BA, Halliday DM, Farmer SF, Shahani U, Maas P, Weir AI, Rosenberg JR. Synchronization between motor cortex
      and spinal motoneuronal pool during the performance of a maintained motor task in man. The Journal of Physiology. 1995;489(3):917-924.
    doi: 10.1113/jphysiol.1995.sp021104
    pmid: '8788955'
    year: 1995
    verified: false
  aliases:
