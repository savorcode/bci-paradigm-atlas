  - curator_c
- id: LAN-OVS
  name:
    en: Overt / attempted speech production
    zh: 出声或尝试言语产生
  family: language
  description:
    en: Participants read aloud or repeat prompted syllables, words or sentences, or, if paralysed, attempt to speak them;
      neural activity is recorded from ventral sensorimotor and surrounding speech cortex. Articulator-specific high-gamma
      activity in ECoG and single- and multi-unit activity in intracortical arrays are used to decode phonemes, words and
      sentences for speech neuroprostheses.
    zh: 被试朗读或复述提示的音节、单词或句子；瘫痪者则尝试说出它们。记录腹侧感觉运动皮层及周围言语相关皮层的神经活动。ECoG 中与发音器官相关的高 γ 活动以及皮层内电极阵列的单/多神经元活动被用于解码音素、单词和句子，以实现言语神经假体。
  markers:
  - MK.high_gamma
  - MK.motor_cortical_spiking
  first_source:
    citation: Bouchard KE, Mesgarani N, Johnson K, Chang EF. Functional organization of human sensorimotor cortex for speech
      articulation. Nature. 2013;495(7441):327-332.
    doi: 10.1038/nature11911
    pmid: '23426266'
    year: 2013
    verified: false
  aliases:
