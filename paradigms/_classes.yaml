- id: SOC-PAIN
  name:
    en: Empathy for pain
    zh: 疼痛共情
  family: social
  description:
    en: Participants observe pictures, videos or cues indicating that another person is receiving painful versus non-painful
      stimulation, sometimes alternating with receiving pain themselves. Observed pain increases anterior insula BOLD and
