  - curator_b
- id: ERR-TS
  name:
    en: Two-stage decision task
    zh: 两阶段决策（基于模型/无模型）
  family: error
  description:
    en: Participants make a first-stage choice that leads probabilistically (via common or rare transitions) to one of two
      second-stage states, where a second choice yields reward with slowly drifting probabilities. Stay/switch behaviour after
      rare transitions separates model-based from model-free control, and striatal BOLD prediction errors reflect both.
    zh: 被试在第一阶段做出选择，该选择按概率（常见或罕见转移）进入两个第二阶段状态之一，在第二阶段再做选择并以缓慢漂移的概率获得奖赏。罕见转移后的保持/转换行为可区分基于模型与无模型控制，纹状体 BOLD 预测误差同时反映二者。
  markers:
  - MK.BOLD_striatum_reward
  - MK.FRN
  first_source:
    citation: Daw ND, Gershman SJ, Seymour B, Dayan P, Dolan RJ. Model-Based Influences on Humans' Choices and Striatal Prediction
      Errors. Neuron. 2011;69(6):1204-1215.
    doi: 10.1016/j.neuron.2011.02.027
    pmid: '21435563'
    year: 2011
    verified: false
