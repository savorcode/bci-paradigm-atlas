- id: PER-STREAM
  name:
    en: Auditory stream segregation
    zh: 听觉流分离
  family: perception
  description:
    en: Alternating tone sequences (for example ABA- triplets) are presented with varying frequency separation and rate, so
      that they are heard as one or as two streams. Deviants defined within one stream elicit an MMN only when the streams
      are segregated, which is used as an index of stream formation.
    zh: 以不同频率间隔和速率呈现交替音序列（如 ABA- 三音组），使其被听成一个或两个声流。只有在声流分离时，定义在单一声流内的偏差才诱发 MMN，以此作为声流形成的指标。
  markers:
  - MK.MMN
  first_source:
    citation: Sussman E, Ritter W, Vaughan HG. An investigation of the auditory streaming effect using event-related brain
      potentials. Psychophysiology. 1999;36(1):22-34.
    doi: 10.1017/S0048577299971056
    year: 1999
    verified: false
