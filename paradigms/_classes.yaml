- id: ERR-VRPE
  name:
    en: Visuo-haptic mismatch in virtual reality
    zh: 虚拟现实视觉–触觉失配（预测误差负波）
  family: error
  description:
    en: Participants reach to touch virtual objects in VR, and on a minority of trials the visual/haptic touch feedback is
      delivered prematurely, creating a mismatch between predicted and actual sensory feedback. Mismatching feedback elicits
      a fronto-central negativity (prediction error negativity, ~100-200 ms), proposed as a passive-BCI signal of interaction
      errors.
    zh: 被试在虚拟现实中伸手触碰虚拟物体，少数试次中视觉/触觉的触碰反馈被提前给出，造成预测感觉反馈与实际反馈之间的失配。失配反馈诱发额中央负波（预测误差负波，约 100–200 ms），被提出可作为被动式脑机接口检测交互错误的信号。
  markers:
  - MK.ErrP
  first_source:
    citation: Gehrke L, Akman S, Lopes P, Chen A, Singh AK, Chen HT, Lin CT, Gramann K. Detecting Visuo-Haptic Mismatches
      in Virtual Reality using the Prediction Error Negativity of Event-Related Brain Potentials. Proceedings of the 2019
      CHI Conference on Human Factors in Computing Systems. 2019:1-11.
    doi: 10.1145/3290605.3300657
    year: 2019
    verified: false
