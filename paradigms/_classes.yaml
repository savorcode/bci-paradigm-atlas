- id: SOC-IAT
  name:
    en: Implicit association test
    zh: 内隐联想测验
  family: social
  description:
    en: Participants sort words or pictures from two concept categories and two attribute categories using two response keys,
      in blocks where the key pairings are compatible or incompatible with an assumed association. Incompatible pairings slow
      responses and modulate the N400 and late positive potential.
    zh: 被试用两个按键对来自两个概念类别和两个属性类别的词或图片进行归类；在不同组块中，按键配对与假定的联想相容或不相容。不相容配对使反应变慢，并调制 N400 与晚期正电位。
