- id: MEM-PA
  name:
    en: Paired-associate learning
    zh: 配对联想学习
  family: memory
  description:
    en: Participants study pairs of items (word-word, object-location or face-name) and are later cued with one member of
      each pair to recall or recognize its associate. Successful associative encoding and retrieval are associated with hippocampal
      BOLD activity and with hippocampal theta oscillations in intracranial recordings.
    zh: 被试学习成对的项目（词—词、物体—位置或面孔—姓名），随后以每对中的一个项目为线索回忆或再认与之配对的项目。成功的联结编码与提取伴随海马 BOLD 活动，以及颅内记录中的海马 θ 振荡。
