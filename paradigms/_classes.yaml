- id: EMO-FC
  name:
    en: Pavlovian fear conditioning
    zh: 巴甫洛夫恐惧条件化
  family: emotion
  description:
    en: A neutral conditioned stimulus (CS+) is repeatedly paired with an aversive unconditioned stimulus such as a mild shock
      or loud noise, while a control stimulus (CS-) is never paired; extinction and recall phases may follow. Differential
      CS+ > CS- responses include amygdala BOLD changes during acquisition.
    zh: 中性条件刺激（CS+）反复与厌恶性非条件刺激（如轻微电击或强噪声）配对，而对照刺激（CS-）从不配对；之后可接消退与消退回忆阶段。CS+ 相对 CS- 的差异反应包括习得阶段的杏仁核 BOLD 变化。
  markers:
  - MK.BOLD_amygdala
  - MK.frontal_midline_theta
  first_source:
    citation: 'LaBar KS, Gatenby JC, Gore JC, LeDoux JE, Phelps EA. Human amygdala activation during conditioned fear acquisition
      and extinction: a mixed-trial fMRI study. Neuron. 1998;20(5):937-945.'
