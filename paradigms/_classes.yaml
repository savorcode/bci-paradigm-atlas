- id: PER-PRVEP
  name:
    en: Pattern-reversal VEP
    zh: 棋盘格翻转 VEP
  family: perception
  description:
    en: A black-and-white checkerboard reverses contrast at a fixed rate while the participant fixates its centre. Each reversal
      evokes a VEP with a robust occipital P100, whose latency is the standard clinical measure of optic nerve conduction.
    zh: 被试注视棋盘格中心，棋盘格以固定速率进行黑白翻转。每次翻转诱发一个 VEP，其稳定的枕区 P100 潜伏期是临床评估视神经传导的标准指标。
  markers:
  - MK.P100_PRVEP
  first_source:
    citation: Halliday AM, McDonald WI, Mushin J. Delayed visual evoked response in optic neuritis. Lancet. 1972;299(7758):982-985.
    doi: 10.1016/S0140-6736(72)91155-5
