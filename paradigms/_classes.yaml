- id: MOT-PASS
  name:
    en: Passive movement / proprioceptive stimulation
    zh: 被动运动（本体感觉刺激）
  family: motor
  description:
    en: A finger or limb of the relaxed participant is moved passively by an experimenter or a (pneumatic or robotic) device,
      often rhythmically, while movement kinematics are recorded together with MEG/EEG. Coherence between sensorimotor cortex
      activity and movement kinematics (corticokinematic coherence), driven mainly by proprioceptive afference, and beta ERD/rebound
      are the main markers.
    zh: 由实验者或（气动、机器人）装置被动移动放松被试的手指或肢体（常为节律性运动），同时记录运动学信号和 MEG/EEG。主要标记物为主要由本体感觉传入驱动的感觉运动皮层活动与运动学之间的相干（皮层-运动学相干）以及 β ERD/反弹。
  markers:
  - MK.corticokinematic_coherence
  - MK.SMR_ERD
  first_source:
    citation: Bourguignon M, Piitulainen H, De Tiege X, Jousmaki V, Hari R. Corticokinematic coherence mainly reflects movement-induced
      proprioceptive feedback. NeuroImage 106:382-390. 2015.
    doi: 10.1016/j.neuroimage.2014.11.026
    year: 2015
    verified: false
  aliases:
  - passive movement
  - proprioceptive stimulation
  - corticokinematic coherence paradigm
  - CKC
  notes: migrated from schema-0.1 file MOT-PASS-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
