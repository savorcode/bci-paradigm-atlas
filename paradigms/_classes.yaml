  - curator_a
- id: STM-TACS
  name:
    en: Transcranial alternating current stimulation with EEG
    zh: 经颅交流电刺激同步脑电
  family: stimulation
  description:
    en: A weak sinusoidal current at a chosen frequency (often the individual alpha frequency) is applied through scalp electrodes,
      and EEG is recorded before, during and after stimulation, compared with sham. Stimulation can phase-align ongoing oscillations
      at the stimulation frequency (entrainment) and is followed by an increase in power in the stimulated band after stimulation
      ends.
    zh: 通过头皮电极施加选定频率（常为个体 α 频率）的弱正弦电流，在刺激前、刺激中和刺激后记录脑电，并与伪刺激比较。刺激可使进行中的节律与刺激频率相位对齐（夹带），刺激结束后该频段功率升高。
  markers:
  - MK.oscillatory_entrainment
  - MK.tES_power_aftereffect
  first_source:
    citation: Zaehle T, Rach S, Herrmann CS. Transcranial alternating current stimulation enhances individual alpha activity
      in human EEG. PLoS ONE. 2010;5(11):e13766.
    doi: 10.1371/journal.pone.0013766
    year: 2010
    verified: false
  aliases:
  - tACS-EEG
  - oscillatory entrainment
  - tACS
  notes: migrated from schema-0.1 file STM-TACS-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TAVNS
  name:
    en: Transcutaneous auricular vagus nerve stimulation
    zh: 经皮耳迷走神经刺激
  family: stimulation
  description:
    en: Electrical stimulation is applied to the auricular branch of the vagus nerve at the outer ear (cymba conchae), compared
      with sham stimulation of the earlobe, while participants perform a task or rest. Effects on the noradrenergic system
      are assessed through the amplitude of the P3b in a concurrent oddball task, among other measures.
    zh: 在外耳（耳甲艇）对迷走神经耳支施加电刺激，并与耳垂伪刺激比较，被试同时完成任务或静息。通过同时进行的 oddball 任务中 P3b 的波幅等指标评估其对去甲肾上腺素能系统的作用。
  markers:
  - MK.P3b
  first_source:
    citation: 'Ventura-Bort C, Wirkner J, Genheimer H, Wendt J, Hamm AO, Weymar M. Effects of transcutaneous vagus nerve stimulation
      (tVNS) on the P300 and alpha-amylase level: a pilot study. Frontiers in Human Neuroscience 12:202. 2018.'
    doi: 10.3389/fnhum.2018.00202
    year: 2018
    verified: false
  aliases:
  - taVNS
  - tVNS
  - transcutaneous vagus nerve stimulation
  notes: migrated from schema-0.1 file STM-TAVNS-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TDCS
  name:
    en: Transcranial direct current stimulation with EEG / fNIRS
    zh: 经颅直流电刺激同步记录
  family: stimulation
  description:
    en: A weak constant current (anodal or cathodal) is applied between scalp electrodes for several minutes, with brain activity
      recorded before, during or after stimulation and compared with sham. Polarity-dependent changes in excitability are
      assessed through band-power changes in EEG (for example of sensorimotor mu ERD) and haemodynamic responses under the
      stimulated region.
    zh: 在头皮电极之间施加数分钟的弱恒定电流（阳极或阴极），在刺激前、刺激中或刺激后记录脑活动，并与伪刺激比较。通过脑电频段功率变化（如感觉运动 mu ERD）以及受刺激区域下方的血流动力学响应评估依极性而定的兴奋性改变。
  markers:
  - MK.tES_power_aftereffect
  - MK.BOLD_stimulated_region
  first_source:
    citation: Nitsche MA, Paulus W. Excitability changes induced in the human motor cortex by weak transcranial direct current
      stimulation. The Journal of Physiology. 2000;527(3):633-639.
    doi: 10.1111/j.1469-7793.2000.t01-1-00633.x
    pmid: '10990547'
    year: 2000
    verified: false
  aliases:
  - tDCS-EEG
  - tDCS-fNIRS
  - tDCS
  notes: migrated from schema-0.1 file STM-TDCS-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TEP
  name:
    en: TMS-evoked potentials (TMS-EEG)
    zh: TMS 诱发脑电
  family: stimulation
  description:
    en: Single TMS pulses are delivered to a cortical target while EEG is recorded with TMS-compatible amplifiers, and responses
      are averaged across pulses. The resulting TMS-evoked potential, a series of deflections over the first few hundred milliseconds
      that spreads from the stimulated site, indexes local cortical reactivity and effective connectivity.
    zh: 在使用兼容 TMS 的放大器记录脑电的同时，向皮层靶点施加单个 TMS 脉冲，并对多次脉冲的响应进行平均。由此得到的 TMS 诱发电位是刺激后数百毫秒内由受刺激部位向外扩散的一系列波，反映局部皮层反应性与有效连接。
  markers:
  - MK.TEP
  first_source:
    citation: Ilmoniemi RJ, Virtanen J, Ruohonen J, Karhu J, Aronen HJ, Näätänen R, Katila T. Neuronal responses to magnetic
      stimulation reveal cortical reactivity and connectivity. Neuroreport. 1997;8(16):3537-3540.
    doi: 10.1097/00001756-199711100-00024
    year: 1997
    verified: false
  aliases:
  - TEP
  - TMS-EEG
  - perturbational complexity index
  notes: migrated from schema-0.1 file STM-TEP-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TI
  name:
    en: Temporal interference stimulation
    zh: 时间干涉电刺激
  family: stimulation
  description:
    en: Two high-frequency alternating currents with slightly different frequencies are applied through separate scalp electrode
      pairs, so that their interference produces an envelope at the difference frequency that is maximal in a deep target
      (e.g. the hippocampus). Target engagement is assessed with BOLD responses in the targeted region during a task, compared
      with control stimulation.
    zh: 通过两组独立的头皮电极施加频率略有差异的两路高频交流电，二者干涉在差频处形成包络，并在深部靶点（如海马）达到最大。通过任务期间靶区 BOLD 响应并与对照刺激比较，评估对靶点的作用。
  markers:
  - MK.BOLD_stimulated_region
  first_source:
    citation: Violante IR, Alania K, Cassarà AM, Neufeld E, Acerbo E, Carron R, Williamson A, Kurtin DL, Rhodes EJ, Hampshire
      A, Kuster N, Boyden ES, Pascual-Leone A, Grossman N. Non-invasive temporal interference electrical stimulation of the
      human hippocampus. Nature Neuroscience. 2023;26(11):1994-2004.
    doi: 10.1038/s41593-023-01456-8
    year: 2023
    verified: false
  aliases:
  - temporal interference
  - TI stimulation
  - tTIS
  notes: migrated from schema-0.1 file STM-TI-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TMSFMRI
  name:
    en: Concurrent TMS-fMRI
    zh: TMS 与功能磁共振同步
  family: stimulation
  description:
    en: TMS pulses or short trains are delivered inside the MRI scanner, interleaved with image acquisition, at different
      intensities or sites (including sham). BOLD responses are measured at the stimulated cortex and in remote, connected
      regions, providing a measure of local and network effects of stimulation.
    zh: 在磁共振扫描仪内与图像采集交错施加 TMS 单脉冲或短串，变化刺激强度或部位（包括伪刺激）。测量受刺激皮层及远隔连接区域的 BOLD 响应，以评估刺激的局部与网络效应。
  markers:
  - MK.BOLD_stimulated_region
  first_source:
    citation: Bohning DE, Shastri A, Nahas Z, Lorberbaum JP, Andersen SW, Dannels WR, Haxthausen EU, Vincent DJ, George MS.
      Echoplanar BOLD fMRI of brain activation induced by concurrent transcranial magnetic stimulation. Investigative Radiology
      33(6):336-340. 1998.
    doi: 10.1097/00004424-199806000-00004
    pmid: '9647445'
    year: 1998
    verified: false
  aliases:
  - concurrent TMS-fMRI
  - interleaved TMS-fMRI
  - TMS-BOLD
  notes: migrated from schema-0.1 file STM-TMSFMRI-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-TUS
  name:
    en: Transcranial focused ultrasound stimulation
    zh: 经颅超声刺激
  family: stimulation
  description:
    en: Low-intensity focused ultrasound is delivered through the skull to a cortical or deep target, either alone or time-locked
      to a sensory stimulus, and compared with sham or off-target sonication. Effects are measured as changes in somatosensory
      evoked potentials (e.g. to median-nerve stimulation when targeting S1) or as BOLD responses at and connected to the
      sonicated region.
    zh: 经颅骨向皮层或深部靶点施加低强度聚焦超声，可单独施加或与感觉刺激锁时，并与伪刺激或非靶点刺激比较。效应以体感诱发电位的变化（如靶向 S1 时对正中神经刺激的响应）或受刺激区域及其连接区域的 BOLD 响应来测量。
  markers:
  - MK.BOLD_stimulated_region
  - MK.SEP_N20
  first_source:
