- id: CTL-GNG
  name:
    en: Go/NoGo task
    zh: Go/NoGo
  family: control
  description:
    en: Participants respond quickly to frequent Go stimuli and withhold the response to infrequent NoGo stimuli. Correctly
      withheld NoGo trials elicit an enhanced fronto-central N2 followed by a fronto-central NoGo-P3.
    zh: 被试对高频的 Go 刺激快速反应，对低频的 NoGo 刺激抑制反应。成功抑制的 NoGo 试次诱发增强的额中央 N2，随后出现额中央的 NoGo-P3。
  markers:
  - MK.N2_frontocentral
