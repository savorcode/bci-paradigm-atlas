- id: MOT-REACH
  name:
    en: Center-out reaching
    zh: 中心外伸伸够任务
  family: motor
  description:
    en: From a central start position, the participant reaches (or moves a cursor/manipulandum) to one of several targets
      arranged radially around the centre. Firing rates of motor cortical neurons are broadly tuned to movement direction,
      and population activity or high-gamma features are used to decode reach direction.
    zh: 被试从中央起始位置伸手（或移动光标/操纵杆）指向环绕中心径向排列的若干目标之一。运动皮层神经元放电率对运动方向呈宽调谐，群体活动或高 γ 特征用于解码伸够方向。
  markers:
  - MK.motor_cortical_spiking
  - MK.high_gamma
  - MK.low_freq_kinematics
  first_source:
    citation: Georgopoulos AP, Kalaska JF, Caminiti R, Massey JT. On the relations between the direction of two-dimensional
      arm movements and cell discharge in primate motor cortex. Journal of Neuroscience. 1982;2(11):1527-1537.
    doi: 10.1523/jneurosci.02-11-01527.1982
    pmid: '7143039'
    year: 1982
    verified: false
