- id: PER-MMN
  name:
    en: Passive oddball (mismatch negativity)
    zh: 被动 oddball（失匹配负波）
  family: perception
  description:
    en: Frequent standard sounds are interrupted by infrequent deviants differing in a physical or abstract feature while
      the participant ignores the sounds. Deviants elicit the mismatch negativity, a fronto-central negativity at about 100-250
      ms that reflects automatic detection of a violation of the regularity encoded from the standards.
    zh: 被试不注意声音，高频标准音中穿插在物理或抽象特征上不同的低频偏差音。偏差音诱发失匹配负波（MMN），即约 100–250 ms 出现的额中央负波，反映大脑对标准音所建立规律被违反的自动检测。
  markers:
  - MK.MMN
  first_source:
    citation: Naatanen, R., Gaillard, A. W. K., & Mantysalo, S. Early selective-attention effect on evoked potential reinterpreted.
      Acta Psychologica, 42(4), 313-329. 1978.
    doi: 10.1016/0001-6918(78)90006-9
    pmid: '685709'
    year: 1978
    verified: false
  aliases:
