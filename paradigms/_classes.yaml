- id: SSR-CVEP
  name:
    en: Code-modulated VEP (c-VEP)
    zh: 编码调制视觉诱发电位
  family: steady_state
  description:
    en: Each target flickers according to a pseudorandom binary code (circularly shifted m-sequences, independent Gold codes
      or sparse burst codes). The attended target is identified by matching the EEG response to code-specific templates, which
      allows many targets in a speller.
    zh: 每个目标按伪随机二值编码闪烁（同一 m 序列的循环移位、彼此独立的 Gold 码或稀疏突发码）。将脑电响应与各编码的模板匹配来识别被注视目标，可在拼写器中容纳大量目标。
  markers:
  - MK.cVEP
  first_source:
    citation: 'Sutter EE. The brain response interface: communication through visually-induced electrical brain responses.
      J Microcomput Appl. 1992;15(1):31-45.'
    doi: 10.1016/0745-7138(92)90045-7
    year: 1992
    verified: false
  aliases:
