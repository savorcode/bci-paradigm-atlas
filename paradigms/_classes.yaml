- id: SOC-BIO
  name:
    en: Biological motion perception
    zh: 生物运动知觉
  family: social
  description:
    en: Point-light displays depicting human actions are compared with scrambled or inverted versions in which the local dot
      motions are kept but the body configuration is destroyed. Intact biological motion evokes larger posterior N170/N2 responses
      and pSTS BOLD than the control displays.
    zh: 将表现人体动作的光点显示与保留局部光点运动但破坏身体结构的打乱版或倒置版进行比较。完整生物运动比对照刺激诱发更大的后部 N170／N2 以及后颞上沟 BOLD。
