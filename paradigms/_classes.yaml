- id: LAN-VWFA
  name:
    en: Visual word form processing
    zh: 视觉词形加工（字词定位）
  family: language
  description:
    en: Participants view written words alongside control stimuli such as consonant strings, false fonts, faces or objects,
      often with a simple detection task. Written words evoke stronger responses in the left ventral occipitotemporal 'visual
      word form area' and a larger, left-lateralised occipitotemporal N170 than control strings (print tuning).
    zh: 被试观看书面词语以及辅音串、伪字体、面孔或物体等对照刺激，常配合简单的检测任务。与对照串相比，书面词语在左侧腹侧枕颞“视觉词形区”诱发更强的响应，并诱发更大、左侧化的枕颞 N170（文字调谐）。
  markers:
  - MK.BOLD_category_selective
