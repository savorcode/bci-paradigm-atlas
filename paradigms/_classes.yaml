- id: CTL-CPT
  name:
    en: Continuous performance task
    zh: 持续操作任务
  family: control
  description:
    en: Participants monitor a long stream of stimuli and respond to targets, which requires sustained attention; in context
      versions (AX-CPT) the target is defined by a preceding cue, and in gradual-onset versions stimuli morph continuously.
      Targets elicit a P3, cues in the AX-CPT a contingent negative variation, and attentional fluctuations are tracked by
      default-mode activity.
    zh: 被试监视长时间的刺激流并对目标作反应，需要持续注意；情境版本（AX-CPT）中目标由前一线索界定，渐变版本中刺激连续过渡。目标诱发 P3，AX-CPT 的线索诱发关联性负变，注意波动可由默认模式网络活动追踪。
  markers:
  - MK.CNV
  - MK.P3b
  - MK.DMN_connectivity
  first_source:
    citation: Rosvold HE, Mirsky AF, Sarason I, Bransome ED, Beck LH. A continuous performance test of brain damage. Journal
      of Consulting Psychology. 1956;20(5):343-350.
    doi: 10.1037/h0043220
    pmid: '13367264'
