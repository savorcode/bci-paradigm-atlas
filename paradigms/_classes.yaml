- id: MEM-SB
  name:
    en: Sternberg task
    zh: Sternberg 工作记忆
  family: memory
  description:
    en: A memory set of one to several items is presented, followed by a retention interval and a single probe; participants
      decide whether the probe was in the set. Reaction time increases with set size, and during retention frontal-midline
      theta and posterior alpha power increase with memory load.
    zh: 先呈现包含一到数个项目的记忆集，经过保持期后呈现单个探测项，被试判断探测项是否属于记忆集。反应时随记忆集大小增加而延长；保持期内额中线 θ 与后部 α 功率随记忆负荷增加而增强。
