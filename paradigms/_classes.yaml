- id: MEM-ON
  name:
    en: Old/new recognition
    zh: 新旧再认
  family: memory
  description:
    en: 'After a study phase, participants see studied (old) items intermixed with unstudied (new) items and judge whether
      each item is old or new, often with confidence ratings. Correctly recognized old items elicit more positive ERPs than
      correctly rejected new items: an earlier mid-frontal effect (FN400) associated with familiarity and a later left parietal
      effect associated with recollection.'
    zh: 学习阶段之后，学过的（旧）项目与未学过的（新）项目混合呈现，被试判断每个项目是旧还是新，常附加信心评定。被正确再认的旧项目比被正确拒绝的新项目诱发更正的 ERP：较早的额中部效应（FN400）与熟悉性相关，较晚的左顶叶效应与回忆相关。
  markers:
  - MK.FN400
  - MK.parietal_old_new
  first_source:
    citation: 'Mandler G. Recognizing: The judgment of previous occurrence. Psychological Review. 1980;87(3):252-271.'
    doi: 10.1037/0033-295x.87.3.252
    year: 1980
    verified: false
  aliases:
