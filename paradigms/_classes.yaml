  - curator_a
- id: MOT-GRASP
  name:
    en: Grasping and hand gestures
    zh: 抓握与手势
  family: motor
  description:
    en: Participants perform (or attempt) different grasp types, hand postures or gestures, usually after a visual cue, and
      the hand configuration is decoded from cortical activity. Grasp-specific patterns of high-gamma activity over sensorimotor
      cortex and of motor cortical spiking carry the information used for classification.
    zh: 被试通常在视觉提示后执行（或尝试）不同的抓握类型、手部姿势或手势，并从皮层活动中解码手部构型。感觉运动皮层上的高 γ 活动与运动皮层神经元放电呈现与抓握类型相关的模式，用于分类。
  markers:
  - MK.high_gamma
  - MK.motor_cortical_spiking
  - MK.SMR_ERD
  - MK.low_freq_kinematics
  first_source:
    citation: Pistohl T, Schulze-Bonhage A, Aertsen A, Mehring C, Ball T. Decoding natural grasp types from human ECoG. NeuroImage.
      2012;59(1):248-260.
    doi: 10.1016/j.neuroimage.2011.06.084
    pmid: '21763434'
    year: 2012
    verified: false
  aliases:
