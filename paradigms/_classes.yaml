- id: EMO-STRESS
  name:
    en: Psychosocial stress induction (TSST / MIST)
    zh: 社会心理应激诱发（TSST／MIST）
  family: emotion
  description:
    en: Participants perform public speaking and mental arithmetic in front of an evaluative panel (Trier Social Stress Test)
      or mental arithmetic under time pressure with negative social feedback in the scanner (Montreal Imaging Stress Task).
      Acute stress is accompanied by changes in frontal alpha asymmetry and prefrontal HbO.
    zh: 被试在评价性评审面前进行公开演讲与心算（特里尔社会应激测验 TSST），或在扫描仪内于时间压力和负性社会反馈下进行心算（蒙特利尔影像应激任务 MIST）。急性应激伴随额叶 α 不对称和前额叶 HbO 的变化。
