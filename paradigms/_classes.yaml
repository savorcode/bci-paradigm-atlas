- id: STA-MED
  name:
    en: Meditation
    zh: 冥想
  family: state
  description:
    en: Practitioners or trained novices perform focused-attention, open-monitoring or other meditation for minutes, compared
      with mind-wandering or rest baselines. Meditation states are associated with changes in posterior alpha and frontal
      midline theta power.
    zh: 冥想者或受训新手进行数分钟的专注型、开放觉察型或其他冥想，并与走神或静息基线比较。冥想状态与后部 α 及额中线 θ 功率的变化有关。
