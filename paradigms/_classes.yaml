- id: MEM-TMR
  name:
    en: Targeted memory reactivation
    zh: 睡眠中目标记忆再激活
  family: memory
  description:
    en: During learning, material is associated with sensory cues (item-specific sounds, or an odour present throughout the
      learning session); during subsequent sleep, usually slow-wave sleep, the cues are re-presented, and memory is compared
      after waking between cued and uncued items or between sleep with and without the cue. Cue presentation evokes slow oscillations
      and sleep spindles and activates the hippocampus, and these responses are related to the memory benefit of reactivation.
    zh: 学习时材料与感觉线索相关联（项目特异的声音，或整个学习过程中存在的气味）；随后在睡眠中（通常是慢波睡眠）重放线索，醒后比较被提示与未被提示的项目，或比较有/无线索的睡眠条件下的记忆。线索呈现诱发慢振荡与睡眠纺锤波并激活海马，这些反应与再激活带来的记忆获益相关。
  markers:
  - MK.sleep_spindle
  - MK.slow_wave
  - MK.BOLD_hippocampus
  first_source:
    citation: Rasch B, Büchel C, Gais S, Born J. Odor Cues During Slow-Wave Sleep Prompt Declarative Memory Consolidation.
      Science. 2007;315(5817):1426-1429.
    doi: 10.1126/science.1138581
    pmid: '17347444'
    year: 2007
    verified: false
  aliases:
  - Cued memory reactivation during sleep
  - TMR
  - odour TMR
  - olfactory memory reactivation
  - odor cueing during slow-wave sleep
  notes: 'migrated from schema-0.1 file MEM-TMR-001; sprint 2 (D-057): description, markers, first_source, aliases updated from
    curation/work/pkg_D/sprint2/class_updates.yaml. D-062 (2026-10-05): class origin = Rasch et al. 2007 (R1327, odour context
    reactivation), taken from MEM-TMR-002, the earliest bibliographically identifiable configuration; MEM-TMR-001 (Rudoy 2009)
    remains the canonical configuration and keeps its number. bibliography corrected (OpenAlex, 2026-10-05)'
  status: draft
