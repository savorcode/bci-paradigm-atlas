- id: MEM-NAV
  name:
    en: Virtual spatial navigation
    zh: 虚拟空间导航记忆
  family: memory
  description:
    en: Participants learn and navigate virtual environments, for example finding a hidden platform in a virtual water maze
      or learning routes and object locations in a virtual town, and are then tested on their spatial memory. Navigation and
      spatial learning are associated with hippocampal theta oscillations in intracranial and MEG recordings and with hippocampal
      BOLD responses that relate to the use of place-based strategies.
    zh: 被试在虚拟环境中学习和导航，例如在虚拟水迷宫中寻找隐藏平台，或在虚拟城镇中学习路线和物体位置，随后测试空间记忆。导航和空间学习伴随颅内和 MEG 记录中的海马 θ 振荡，以及与基于位置的策略相关的海马 BOLD 响应。
