- id: PER-OMIT
  name:
    en: Stimulus omission paradigm
    zh: 刺激遗漏范式
  family: perception
  description:
    en: A regular or predictable sound sequence occasionally omits a stimulus, or a self-initiated button press unexpectedly
      produces no sound. Although no input arrives, an omission response is evoked at the expected time, taken as evidence
      of sensory prediction.
    zh: 在规则或可预测的声音序列中偶尔省略一个刺激，或被试自行按键后意外地没有出现声音。尽管没有输入，在预期时间仍会出现遗漏响应，被视为感觉预测的证据。
  markers:
  - MK.omission_response
  first_source:
    citation: Sutton S, Tueting P, Zubin J, John ER. Information delivery and the sensory evoked potential. Science. 1967;155(3768):1436-1439.
    doi: 10.1126/science.155.3768.1436
    year: 1967
    verified: false
