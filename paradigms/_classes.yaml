- id: MEM-MST
  name:
    en: Mnemonic similarity task
    zh: 记忆相似性（模式分离）
  family: memory
  description:
    en: After an incidental encoding phase with pictures of everyday objects, participants judge test items as old, similar
      or new; similar lures are perceptually related to studied items. Correctly calling lures 'similar' indexes behavioural
      pattern separation, and fMRI studies show lure-related BOLD responses in the hippocampal dentate gyrus/CA3 region that
      resemble responses to new items.
    zh: 被试在附带编码阶段观看日常物体图片，随后把测试项目判断为“旧”“相似”或“新”；相似诱饵与学过的项目在知觉上相近。把诱饵正确判断为“相似”反映行为上的模式分离；fMRI 研究显示海马齿状回/CA3 区对诱饵的 BOLD 响应与对新项目的响应相似。
  markers:
