- id: CTL-VBC
  name:
    en: Value-based choice (willingness to pay)
    zh: 基于价值的选择（支付意愿）
  family: control
  description:
    en: Hungry participants view food items and bid how much they are willing to pay for each in an incentive-compatible auction,
      providing a trial-wise measure of subjective goal value. Medial orbitofrontal/ventromedial prefrontal BOLD activity
      scales with willingness to pay.
    zh: 饥饿的被试观看食物，并在激励相容的拍卖中出价表示愿意为每种食物支付多少，从而得到逐试次的主观目标价值指标。内侧眶额/腹内侧前额叶 BOLD 活动随支付意愿增加而升高。
  markers:
  - MK.BOLD_vmPFC_value
  first_source:
