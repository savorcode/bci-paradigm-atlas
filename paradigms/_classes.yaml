- id: IMG-SPI
  name:
    en: Imagined / inner speech
    zh: 想象语音（内部言语）
  family: imagery
  description:
    en: Participants are cued to imagine saying a vowel, syllable or word without moving the articulators or producing sound,
      and the imagined item is decoded from brain activity. In intracranial recordings, high-gamma activity over speech-related
      temporal and frontal cortex carries item-specific information; scalp-EEG studies use oscillatory features.
    zh: 被试按提示在不运动发音器官、不发声的情况下想象说出一个元音、音节或词，并从脑活动中解码想象的内容。颅内记录中，言语相关颞叶和额叶皮层上的高 γ 活动携带与内容相关的信息；头皮脑电研究则使用节律特征。
  markers:
