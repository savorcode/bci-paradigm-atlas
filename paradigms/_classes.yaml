- id: LAN-PRIME
  name:
    en: Semantic priming
    zh: 语义启动
  family: language
  description:
    en: A prime word is followed by a target word that is either semantically related or unrelated to it, and participants
      respond to the target, for example with a lexical decision, or simply read it. Related targets are processed faster
      and elicit a smaller N400 than unrelated targets.
    zh: 先呈现启动词，随后呈现与之语义相关或无关的目标词，被试对目标词作出反应（如词汇判断）或仅阅读。与无关目标词相比，相关目标词加工更快，诱发的 N400 更小。
  markers:
  - MK.N400
  first_source:
    citation: 'Meyer, D. E., & Schvaneveldt, R. W. Facilitation in recognizing pairs of words: Evidence of a dependence between
      retrieval operations. Journal of Experimental Psychology, 90(2), 227-234. 1971.'
    doi: 10.1037/h0031564
    pmid: '5134329'
    year: 1971
    verified: false
  aliases:
  - Associative Priming
  - Morphological Priming
  - Orthographic Priming
  - Phonological Priming
  - Priming
  - masked semantic priming
  - word-pair priming
  - masked priming
  - subliminal semantic priming
  notes: 'migrated from schema-0.1 file LAN-PRIME-001; sprint 2 (D-057): aliases updated from curation/work/pkg_D/sprint2/class_updates.yaml.
    bibliography confirmed (Crossref, 2026-10-05)'
  status: draft
  contributors:
