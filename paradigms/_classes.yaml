- id: CTL-CNV
  name:
    en: S1-S2 paradigm
    zh: S1-S2 预期任务
  family: control
  description:
    en: A warning stimulus (S1) is followed after a fixed interval by an imperative stimulus (S2) that requires a speeded
      response. During the S1-S2 interval a slow negative shift, the contingent negative variation, develops over fronto-central
      scalp sites.
    zh: 警示刺激（S1）出现后经固定间隔呈现要求快速反应的命令刺激（S2）。在 S1–S2 间隔中，额中央头皮区逐渐形成一个缓慢的负向偏移，即关联性负变（CNV）。
  markers:
