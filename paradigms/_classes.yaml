- id: MEM-META
  name:
    en: Metamemory (feeling-of-knowing / judgment-of-learning)
    zh: 元记忆（知晓感、学习判断）
  family: memory
  description:
    en: 'Participants judge their own memory: in feeling-of-knowing procedures they rate, after a failed recall, how likely
      they are to recognize the answer later; in judgment-of-learning procedures they predict, after study, how likely they
      are to remember an item. The accuracy of these judgments is assessed against later memory, and metamemory judgments
      engage frontopolar (anterior prefrontal) cortex in fMRI studies.'
    zh: 被试对自己的记忆作出判断：知晓感程序中，被试在回忆失败后评定之后能再认出答案的可能性；学习判断程序中，被试在学习后预测自己记住某个项目的可能性。以随后的记忆成绩评估这些判断的准确性；fMRI 研究显示元记忆判断激活额极（前部前额叶）皮层。
  markers:
  - MK.BOLD_frontopolar
  first_source:
    citation: Hart, J. T. Memory and the feeling-of-knowing experience. Journal of Educational Psychology, 56(4), 208-216.
      1965.
    doi: 10.1037/h0022263
    pmid: '5825050'
    year: 1965
    verified: false
