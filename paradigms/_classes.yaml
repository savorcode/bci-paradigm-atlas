- id: SSR-SWEEP
  name:
    en: Sweep VEP
    zh: 扫描 VEP（视敏度评估）
  family: steady_state
  description:
    en: A pattern stimulus reversing at a fixed rate is swept through a range of spatial frequencies (or contrasts) within
      a single trial of several seconds. The amplitude of the steady-state VEP is plotted against spatial frequency and extrapolated
      to zero to estimate visual acuity, for example in infants.
    zh: 以固定速率翻转的图形刺激在数秒的单个试次中扫过一系列空间频率（或对比度）。将稳态 VEP 波幅对空间频率作图并外推至零，估计视敏度，例如用于婴儿。
