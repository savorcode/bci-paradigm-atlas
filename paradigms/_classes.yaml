- id: PER-ODD
  name:
    en: Oddball paradigm
    zh: Oddball 范式（怪球范式）
  family: perception
  description:
    en: Infrequent target stimuli are embedded among frequent non-target stimuli, and attended targets elicit a P3b; infrequent
      non-target distractors elicit a P3a. Concrete paradigms differ in the condition set (two- or three-stimulus), the stimulus
      coding (row/column, checkerboard, single-item or RSVP presentation) and the sensory modality (visual, auditory spatial,
      tactile), and include the P300-based BCIs.
    zh: 低频靶刺激嵌入高频非靶刺激中，被注意的靶刺激诱发 P3b；低频非靶干扰刺激诱发 P3a。具体范式在条件集（两刺激或三刺激）、刺激编码（行/列、棋盘格、单项闪烁或 RSVP 呈现）和感觉通道（视觉、听觉空间、触觉）上不同，包括基于
      P300 的脑机接口。
  markers:
