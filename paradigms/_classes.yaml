- id: PER-LG
  name:
    en: Local-global paradigm
    zh: 局部-全局范式
  family: perception
  description:
    en: Sequences of five tones are presented in blocks in which one sequence type is frequent. A deviant final tone violates
      the local (within-sequence) regularity and elicits an MMN, whereas a rare sequence that violates the global (across-sequence)
      regularity elicits a P3b that is linked to conscious processing.
    zh: 以组块呈现五音序列，每组块中某一序列类型高频出现。末音偏离违反局部（序列内）规律时诱发 MMN；而违反全局（序列间）规律的低频序列诱发 P3b，后者与有意识加工相关。
  markers:
  - MK.MMN
  - MK.P3b
  first_source:
    citation: Bekinschtein TA, Dehaene S, Rohaut B, Tadel F, Cohen L, Naccache L. Neural signature of the conscious processing
      of auditory regularities. Proc Natl Acad Sci U S A. 2009;106(5):1672-1677.
    doi: 10.1073/pnas.0809667106
    year: 2009
    verified: false
