- id: MEM-PM
  name:
    en: Prospective memory
    zh: 前瞻记忆
  family: memory
  description:
    en: Participants perform an ongoing task while holding an intention to make a different response when a specific cue appears
      (event-based) or at a specific time (time-based). Prospective-memory cues elicit an N300 over occipito-parietal sites
      relative to ongoing-task stimuli, and maintaining the intention engages anterior prefrontal (frontopolar) cortex.
    zh: 被试在执行进行中任务的同时保持一个意图：当特定线索出现时（基于事件）或到达特定时间时（基于时间）作出另一种反应。与进行中任务刺激相比，前瞻记忆线索在枕顶区诱发 N300；保持意图时激活前部前额叶（额极）皮层。
  markers:
  - MK.N300_prospective
  - MK.BOLD_frontopolar
  first_source:
    citation: 'Einstein GO, McDaniel MA. Normal aging and prospective memory. Journal of Experimental Psychology: Learning,
      Memory, and Cognition. 1990;16(4):717-726.'
    doi: 10.1037/0278-7393.16.4.717
    year: 1990
    verified: false
