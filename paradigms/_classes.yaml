- id: SOC-NAME
  name:
    en: Own-name paradigm
    zh: 自我名字范式
  family: social
  description:
    en: The participant's own first name is presented infrequently among other names, either passively or with an instruction
      to count a target name. The own name elicits a larger P3b than other names, a response also probed in patients with
      disorders of consciousness.
    zh: 在其他名字中低频呈现被试自己的名字，可被动呈现，也可要求被试对某个目标名字计数。自我名字比其他名字诱发更大的 P3b，该反应也用于意识障碍患者的评估。
