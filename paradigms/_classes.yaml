- id: STA-MATB
  name:
    en: Multi-attribute task battery (MATB)
    zh: 多属性任务组（MATB）
  family: state
  description:
    en: Participants simultaneously monitor gauges, track a target, manage fuel resources and respond to communication requests
      in a simulated cockpit, with workload set by the rate and number of subtasks. Higher workload increases frontal midline
      theta and prefrontal HbO and decreases posterior alpha power.
    zh: 被试在模拟驾驶舱中同时监视仪表、追踪目标、管理燃油资源并回应通信请求，工作负荷由子任务的速率和数量设定。负荷升高时额中线 θ 和前额叶 HbO 增加，后部 α 功率降低。
  markers:
