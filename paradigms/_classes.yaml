  - curator_c
- id: MEM-TNT
  name:
    en: Think/No-Think
    zh: 想/不想
  family: memory
  description:
    en: Participants learn cue-target pairs and then, on each trial, see a cue with an instruction either to retrieve the
      associated target (think) or to prevent it from coming to mind (no-think); memory for all targets is tested afterwards.
      No-think trials are associated with reduced hippocampal BOLD activity and with enhanced frontocentral N2-like negativity,
      and suppressed targets are later remembered less well.
    zh: 被试先学习线索—目标词对，之后每个试次呈现线索并指示其回忆相应目标（想）或阻止目标进入意识（不想），最后测试全部目标的记忆。“不想”试次伴随海马 BOLD 活动降低和额中央类 N2 负波增强，被抑制的目标随后记忆成绩较差。
  markers:
  - MK.N2_frontocentral
  - MK.BOLD_hippocampus
  first_source:
    citation: Anderson MC, Green C. Suppressing unwanted memories by executive control. Nature. 2001;410(6826):366-369.
    doi: 10.1038/35066572
    pmid: '11268212'
    year: 2001
    verified: false
  aliases:
  - TNT Task
  - Think No-Think
  notes: migrated from schema-0.1 file MEM-TNT-001. bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
