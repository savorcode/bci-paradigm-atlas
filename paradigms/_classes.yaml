- id: LAN-PCAT
  name:
    en: Phoneme categorization
    zh: 音位范畴化
  family: language
  description:
    en: Participants hear syllables drawn from an acoustic continuum between two phonemes (for example /ba/-/da/-/ga/) and
      identify each token. Population activity in the superior temporal gyrus, measured as high-gamma responses, reflects
      the perceived phoneme category rather than the linear acoustic change, mirroring categorical perception.
    zh: 被试聆听取自两个音位之间声学连续体的音节（如 /ba/-/da/-/ga/），并识别每个刺激。以高 γ 响应测得的颞上回群体活动反映的是被知觉到的音位范畴，而非线性变化的声学参数，与范畴知觉相对应。
  markers:
  - MK.high_gamma
  first_source:
    citation: Chang EF, Rieger JW, Johnson K, Berger MS, Barbaro NM, Knight RT. Categorical speech representation in human
      superior temporal gyrus. Nature Neuroscience. 2010;13(11):1428-1432.
    doi: 10.1038/nn.2641
    pmid: '20890293'
    year: 2010
    verified: false
  aliases:
  - categorical speech perception
  - speech continuum identification
  - phonetic categorization
  notes: migrated from schema-0.1 file LAN-PCAT-001. bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
