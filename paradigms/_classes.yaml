- id: CTL-WASON
  name:
    en: Wason selection task
    zh: Wason 选择任务
  family: control
  description:
    en: Participants are shown four cards and a conditional rule ('if P then Q') and must select the cards that need to be
      turned over to test whether the rule holds; performance depends strongly on rule content. Neuroimaging studies of the
      task report lateral prefrontal activity during rule-based reasoning.
    zh: 被试看到四张卡片和一条条件规则（“如果 P 则 Q”），须选出需要翻开以检验规则是否成立的卡片；成绩强烈依赖规则内容。该任务的神经影像研究报告基于规则推理时外侧前额叶的活动。
  markers:
  - MK.BOLD_dlPFC
  first_source:
    citation: Wason, P. C. Reasoning. New Horizons in Psychology. 1966.
    year: 1966
