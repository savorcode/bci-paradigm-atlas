- id: MEM-NBK
  name:
    en: n-back task
    zh: n-back
  family: memory
  description:
    en: Participants monitor a continuous stream of stimuli and respond whenever the current item matches the item presented
      n positions earlier; raising n increases working-memory load while keeping the stimuli constant. Higher load is accompanied
      by increased frontal-midline theta, decreased posterior alpha and a reduced P3b to probes, and by load-dependent prefrontal
      and frontoparietal hemodynamic responses, which is why the task is a standard workload manipulation in passive BCI research.
    zh: 被试监视连续呈现的刺激序列，当当前刺激与 n 个位置之前的刺激相同时作出反应；在刺激不变的情况下，增大 n 即提高工作记忆负荷。负荷升高伴随额中线 θ 增强、后部 α 减弱、探测刺激诱发的 P3b 波幅降低，以及前额叶和额顶网络随负荷变化的血流动力学响应，因此该任务是被动式脑机接口研究中常用的负荷操纵范式。
  markers:
  - MK.frontal_midline_theta
  - MK.P3b
  - MK.alpha_posterior
  - MK.HbO_prefrontal
  - MK.BOLD_frontoparietal
  first_source:
    citation: Kirchner WK. Age differences in short-term retention of rapidly changing information. Journal of Experimental
      Psychology. 1958;55(4):352-358.
    doi: 10.1037/h0043688
    pmid: '13539317'
    year: 1958
    verified: false
  aliases:
