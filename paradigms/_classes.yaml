- id: PER-MOT
  name:
    en: Multiple object tracking
    zh: 多目标追踪
  family: perception
  description:
    en: Several identical objects move independently; a subset is briefly highlighted as targets and must be tracked until
      the objects stop. Tracking load modulates contralateral delay activity in lateralised designs and BOLD in frontoparietal
      attention regions.
    zh: 若干相同物体独立运动，其中一部分短暂高亮作为靶，被试需追踪至物体停止。追踪负荷调制偏侧设计中的对侧延迟活动（CDA）以及额顶注意区域的 BOLD。
