- id: PER-MSI
  name:
    en: Audiovisual multisensory integration
    zh: 视听多感觉整合
  family: perception
  description:
    en: Auditory, visual and combined audiovisual stimuli (for example tones and flashes, or syllables and lip movements)
      are presented. Multisensory interaction is measured as the difference between the audiovisual response and the sum of
      the unisensory responses (AV - [A+V]), which shows early ERP deviations; incongruent speech stimuli produce the McGurk
      illusion.
    zh: 呈现听觉、视觉以及视听组合刺激（如纯音与闪光、音节与唇动）。多感觉交互以视听响应与单感觉响应之和的差值（AV −［A+V］）度量，在早期 ERP 上即可见偏离；不一致的言语刺激会产生 McGurk 错觉。
  markers:
  - MK.AV_interaction_ERP
  first_source:
    citation: 'McGurk, H.; MacDonald, J. Hearing lips and seeing voices. Nature 264 (5588): 746–748. 1976.'
    doi: 10.1038/264746a0
    pmid: '1012311'
    year: 1976
