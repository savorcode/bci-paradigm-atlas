- id: ERR-OBS
  name:
    en: Observation of errors
    zh: 观察性错误
  family: error
  description:
    en: Participants watch another agent - a person, a virtual avatar or a machine - perform a task and monitor its actions
      without acting themselves. Observed errors elicit an observer error-related negativity (oERN) over medial frontal sites,
      a signal also exploited for passive BCI supervision of automated systems.
    zh: 被试观看另一个行动者（他人、虚拟化身或机器）完成任务，只监视其动作而不亲自操作。被观察到的错误在内侧额区诱发观察性错误相关负波（oERN），这一信号也用于对自动化系统进行被动式 BCI 监督。
  markers:
