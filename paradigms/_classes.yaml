- id: STA-CLAS
  name:
    en: Closed-loop auditory stimulation of sleep slow oscillations
    zh: 睡眠慢振荡闭环听觉刺激
  family: state
  description:
    en: During NREM sleep, the online EEG is monitored and brief sounds such as pink-noise bursts are delivered phase-locked
      to the up-states of slow oscillations. In-phase stimulation enhances the slow oscillation rhythm and phase-coupled spindle
      activity.
    zh: 在 NREM 睡眠期间实时监测脑电，并将短暂声音（如粉红噪声脉冲）锁相于慢振荡的上升态呈现。同相刺激增强慢振荡节律及与其相位耦合的纺锤波活动。
  markers:
