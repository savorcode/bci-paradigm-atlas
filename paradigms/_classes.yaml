- id: EMO-DOT
  name:
    en: Dot-probe task
    zh: 点探测注意偏向任务
  family: emotion
  description:
    en: Two cues, one emotional (e.g. threatening) and one neutral, appear briefly at two locations, and a probe then replaces
      one of them; faster responses to probes at the emotional location index attentional bias. In EEG, the emotional cue
      elicits an N2pc and modulates the P1 to the subsequent probe.
    zh: 两个线索（一个情绪性如威胁性、一个中性）短暂呈现于两个位置，随后探测刺激替换其中之一；对出现在情绪线索位置的探测刺激反应更快，即为注意偏向。在脑电中，情绪线索诱发 N2pc，并调制随后探测刺激的 P1。
  markers:
  - MK.N2pc
  - MK.P1_visual
