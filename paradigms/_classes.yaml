- id: CTL-PDM
  name:
    en: Perceptual decision making (random-dot motion)
    zh: 知觉决策（随机点运动）
  family: control
  description:
    en: Participants view random-dot motion in which a variable fraction of dots moves coherently - in discrete trials or
      as unannounced periods within a continuous display - and report the net motion direction. Sensory evidence accumulation
      is reflected in a centro-parietal positivity that builds up at a rate proportional to motion coherence and peaks around
      the decision.
    zh: 被试观看随机点运动，其中一部分点一致运动——按离散试次呈现，或作为连续画面中无预告出现的片段——并报告净运动方向。感觉证据的累积表现为中央顶正波，其累积速率与运动一致性成正比，并在决策附近达峰。
  markers:
  - MK.CPP
  first_source:
    citation: 'Britten KH, Shadlen MN, Newsome WT, Movshon JA. The analysis of visual motion: a comparison of neuronal and
      psychophysical performance. The Journal of Neuroscience. 1992;12(12):4745-4765.'
    doi: 10.1523/jneurosci.12-12-04745.1992
    pmid: '1464765'
    year: 1992
    verified: false
  aliases:
  - Dot Motion
  - Dot Motion Task
  - Motion coherence discrimination
  - Perceptual decision making
