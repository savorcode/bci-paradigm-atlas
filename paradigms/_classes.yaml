- id: MEM-RC
  name:
    en: Retro-cue paradigm
    zh: 回溯线索
  family: memory
  description:
    en: A memory array is encoded and, during the retention interval, a cue indicates which item or hemifield will be tested;
      performance improves for the cued item relative to no-cue or uninformative-cue trials. Retro-cues directing attention
      to one hemifield of the internal representation produce posterior alpha lateralization, with relative alpha decrease
      contralateral to the cued location.
    zh: 被试编码记忆阵列，在保持期中出现线索，指示哪个项目或哪一侧视野将被测试；与无线索或无信息线索相比，被提示项目的成绩提高。指向内部表征一侧的回溯线索引起后部 α 偏侧化，表现为被提示位置对侧的 α 相对降低。
  markers:
  - MK.alpha_lateralization
  first_source:
