- id: MOT-IB
  name:
    en: Intentional binding
    zh: 意向绑定（主体感）
  family: motor
  description:
    en: Participants make a voluntary key press that is followed after a short delay by a tone, and judge the timing of the
      action or the tone (e.g. with a Libet clock) or the interval between them. Perceived action and outcome times shift
      towards each other for voluntary actions; neural correlates include the readiness potential before the action and attenuation
      of the auditory N1 to self-caused tones.
    zh: 被试自主按键，短暂延迟后出现声音，被试判断动作或声音出现的时刻（如借助 Libet 时钟）或二者的间隔。自主动作时，知觉到的动作与结果时刻相互靠近；神经相关指标包括动作前的准备电位，以及对自身引起声音的听觉 N1 衰减。
  markers:
  - MK.MRCP
  - MK.N1_auditory
  first_source:
    citation: Haggard, P., Clark, S., & Kalogeras, J. Voluntary action and conscious awareness. Nature Neuroscience, 5(4),
      382-385. 2002.
    doi: 10.1038/nn827
    pmid: '11896397'
    year: 2002
    verified: false
  aliases:
  - Temporal Binding Task
  - Action-Effect Binding Task
  - Interval Estimation Agency Task
  - Libet Clock Binding Task
  notes: migrated from schema-0.1 file MOT-IB-001 bibliography confirmed (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-LIBET
  name:
    en: Libet intention-timing task
    zh: Libet 意图时刻判断任务
  family: motor
  description:
    en: Participants make spontaneous wrist or finger movements while watching a rotating clock and afterwards report the
      clock position at which they first felt the urge or intention to move (W) or actually moved (M). The readiness potential
      averaged to movement onset begins before the reported time of intention.
    zh: 被试一边观看旋转的时钟，一边做自发的手腕或手指动作，事后报告首次感到想动的冲动或意图（W）时、或实际动作（M）时时钟指针的位置。以动作起始为零点平均的准备电位早于所报告的意图时刻出现。
  markers:
  - MK.MRCP
  first_source:
    citation: 'Libet B, Gleason CA, Wright EW, Pearl DK. Time of conscious intention to act in relation to onset of cerebral
      activity (readiness-potential): the unconscious initiation of a freely voluntary act. Brain 106(3):623-642. 1983.'
    doi: 10.1093/brain/106.3.623
    pmid: '6640273'
    year: 1983
    verified: false
  aliases:
  - Libet task
  - W judgement
  - conscious intention timing
  - Libet clock task
  notes: migrated from schema-0.1 file MOT-LIBET-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-ME
  name:
    en: Motor execution
    zh: 运动执行
  family: motor
  description:
    en: Participants perform overt, cued or self-paced movements of a body part (e.g. finger tapping, hand opening/closing,
      foot movement), usually alternating with rest. Movement produces contralateral sensorimotor mu/beta ERD with post-movement
      beta rebound, focal high-gamma increases in intracranial recordings, and BOLD/HbO increases in the motor network.
    zh: 被试执行提示或自定步调的实际肢体动作（如手指敲击、手的张合、足部动作），通常与休息交替。运动引起对侧感觉运动区 mu/β ERD 及运动后 β 反弹、颅内记录中的局灶性高 γ 增强，以及运动网络的 BOLD/HbO 升高。
  markers:
  - MK.SMR_ERD
  - MK.high_gamma
  - MK.BOLD_motor_network
  - MK.low_freq_kinematics
  first_source:
    citation: Szurhaj W, Labyt E, Bourriez JL, Cassim F, Defebvre L, Hauser JJ, Guieu JD, Derambure P. Event-related variations
      in the activity of EEG-rhythms. Application to the physiology and the pathology of movements. 2001;(Spec Issue 2):59-66.
    pmid: '11781201'
    year: 2001
    verified: false
  aliases:
  - executed movement
  - overt movement
  - finger tapping
  - finger tapping localizer
  - FTT
  - Tapping Task
  - individual finger movement
  - finger flexion decoding
  - walking
  - gait EEG
  - paced finger tapping
  notes: 'migrated from schema-0.1 file MOT-ME-001; sprint 2 (D-057): markers, aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
    bibliography corrected (OpenAlex, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_b
  - curator_a
- id: MOT-MI
  name:
    en: Cued motor imagery
    zh: 提示性运动想象
  family: motor
  description:
    en: The participant imagines movements of specific body parts (e.g. left or right hand, feet, tongue, or joints of one
      arm) without executing them, usually on a visual cue and in cue-paced trials, but also in self-paced mode and with or
      without online feedback. Class-specific, somatotopically organised ERD/ERS of sensorimotor rhythms (and, for multi-joint
      upper-limb tasks, low-frequency EEG) is used as the control signal in active BCIs.
    zh: 被试想象特定身体部位的运动（如左手或右手、双脚、舌头，或单侧上肢的各关节）而不实际执行，通常由视觉提示在提示驱动的试次中进行，也可自定步调、带或不带在线反馈。具有躯体定位组织的类别特异感觉运动节律 ERD/ERS（单侧上肢多关节任务中还包括低频脑电）用作主动式脑机接口的控制信号。
  markers:
  - MK.SMR_ERD
  - MK.low_freq_kinematics
  first_source:
    citation: Pfurtscheller G, Neuper C. Motor imagery activates primary sensorimotor area in humans. Neurosci Lett. 1997;239(2-3):65-68.
    doi: 10.1016/S0304-3940(97)00889-6
    year: 1997
    verified: false
  aliases:
  - motor imagery
  - MI
  - kinesthetic motor imagery
  - movement imagery
  - lower-limb MI
  - foot motor imagery
  - gait imagery
  - asynchronous MI
  - self-paced motor imagery
  notes: 'migrated from schema-0.1 file MOT-MI-001; sprint 2 (D-057): description, markers, aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
    bibliography confirmed (OpenAlex, 2026-10-05)'
