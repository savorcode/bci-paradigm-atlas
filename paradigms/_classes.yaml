  - curator_c
- id: LAN-PHA
  name:
    en: Phonological awareness
    zh: 语音意识
  family: language
  description:
    en: Participants make explicit judgments about the sound structure of words, such as whether two words rhyme or what remains
      when a phoneme is deleted. These tasks engage left temporoparietal and inferior frontal language regions, which are
      less activated in readers with dyslexia, and phonological skills are related to speech-sound mismatch negativity.
    zh: 被试对词语的语音结构作出外显判断，如两个词是否押韵、删除某个音素后剩下什么。这些任务激活左侧颞顶和额下语言区，阅读障碍者这些区域激活较弱；语音技能还与语音失匹配负波相关。
  markers:
  - MK.MMN
  - MK.BOLD_language_network
  first_source:
    citation: Shaywitz SE, Shaywitz BA, Pugh KR, Fulbright RK, Constable RT, Mencl WE, Shankweiler DP, Liberman AM, Skudlarski
      P, Fletcher JM, Katz L, Marchione KE, Lacadie C, Gatenby C, Gore JC. Functional disruption in the organization of the
      brain for reading in dyslexia. Proceedings of the National Academy of Sciences. 1998;95(5):2636-2641.
    doi: 10.1073/pnas.95.5.2636
    pmid: '9482939'
    year: 1998
    verified: false
  aliases:
