- id: CTL-RAT
  name:
    en: Remote associates test
    zh: 远距离联想（创造力）
  family: control
  description:
    en: Participants are shown three cue words and must find a fourth word that forms a compound or association with each
      of them, often reporting whether the solution came by insight. Insight solutions are preceded by changes in posterior
      alpha power.
    zh: 被试看到三个线索词，须找出能与每个词构成复合词或联想的第四个词，并常需报告答案是否通过顿悟获得。顿悟解答之前出现后部 α 功率的变化。
  markers:
  - MK.alpha_posterior
  first_source:
