- id: PER-HBD
  name:
    en: Heartbeat detection
    zh: 心跳觉察（内感受）
  family: perception
  description:
    en: Participants count their heartbeats silently (counting version) or judge whether external tones are synchronous with
      their heartbeats (discrimination version). Cortical responses time-locked to the R-peak, the heartbeat-evoked potential,
      are compared between attention to the heartbeat and to external stimuli.
    zh: 被试默数自己的心跳（计数版），或判断外部声音是否与心跳同步（辨别版）。比较注意心跳与注意外部刺激时，与 R 波锁时的皮层响应——心跳诱发电位（HEP）。
  markers:
