- id: IMG-ROT
  name:
    en: Mental rotation
    zh: 心理旋转
  family: imagery
  description:
    en: Participants judge whether two visually presented objects (or a rotated object and its standard) are identical or
      mirror images; reaction time increases with the angular disparity between them. Rotation engages posterior parietal
      and frontal regions and is accompanied by task-related changes in posterior alpha power and a parietal negativity that
      scales with rotation angle.
    zh: 被试判断两个视觉呈现的物体（或旋转后的物体与标准物体）是相同还是镜像；反应时随二者角度差增大而延长。旋转过程调用后顶叶与额叶区域，并伴随后部 α 功率的任务相关变化以及随旋转角度增大的顶叶负波。
  markers:
  - MK.alpha_posterior
  - MK.BOLD_frontoparietal
  first_source:
    citation: Shepard, R. N., & Metzler, J. Mental rotation of three-dimensional objects. Science, 171(3972), 701-703. 1971.
    doi: 10.1126/science.171.3972.701
    pmid: '5540314'
