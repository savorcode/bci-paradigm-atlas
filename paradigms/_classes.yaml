- id: STA-SLP
  name:
    en: Sleep staging (polysomnography)
    zh: 睡眠分期（多导睡眠图）
  family: state
  description:
    en: Overnight EEG, together with electro-oculogram and chin electromyogram, is scored in 30-s epochs into wake, NREM stages
      and REM according to standard rules (Rechtschaffen and Kales, or the AASM manual). NREM stages are defined by sleep
      spindles, K-complexes and slow waves.
    zh: 整夜脑电连同眼电、颏肌电，按标准规则（Rechtschaffen 与 Kales 规则或 AASM 手册）以 30 秒一帧判读为清醒、NREM 各期与 REM 期。NREM 各期由睡眠纺锤波、K 复合波与慢波界定。
  markers:
  - MK.sleep_spindle
  - MK.slow_wave
  first_source:
    citation: Rechtschaffen A, Kales A (eds). A manual of standardized terminology, techniques and scoring system for sleep
      stages of human subjects. U.S. Dept. of Health, Education, and Welfare, Bethesda, Md. 1968.
    year: 1968
    verified: false
  aliases:
  - AASM staging
  - polysomnography staging
  - sleep scoring
  notes: 'migrated from schema-0.1 file STA-SLP-001; sprint 2 (D-057): description updated from curation/work/pkg_E/sprint2/class_updates.yaml.
    Sprint 3 (curator_d, 2026-10-05): bibliography not found (Crossref, 2026-10-05); no Crossref record for this item, citation
    left as is.'
