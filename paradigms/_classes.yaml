- id: IMG-SAO
  name:
    en: Somatosensory attentional orientation
    zh: 体感注意定向
  family: imagery
  description:
    en: Both wrists (or other body sites) receive equal vibrotactile stimulation, and the participant attends to the sensation
      on one side, or orients attention to one body part without stimulation, to make a binary selection. Attentional orientation
      produces lateralised sensorimotor rhythm ERD over the contralateral somatosensory cortex, analogous to the control signal
      in motor imagery BCIs.
    zh: 双侧手腕（或其他部位）接受强度相同的振动触觉刺激，被试注意一侧的感觉，或在无刺激时将注意定向到某一身体部位，以完成二分类选择。注意定向在对侧体感皮层引起偏侧化的感觉运动节律 ERD，与运动想象脑机接口的控制信号类似。
  markers:
  - MK.SMR_ERD
  first_source:
    citation: Yao L, Meng J, Zhang D, Sheng X, Zhu X. Selective sensation based brain-computer interface via mechanical vibrotactile
