  - curator_c
- id: MEM-DS
  name:
    en: Digit span
    zh: 数字广度
  family: memory
  description:
    en: Participants hear or see sequences of digits of increasing length and repeat them in the same order (forward span)
      or in reverse order (backward span); span is the longest sequence reproduced correctly. EEG studies of computerised
      versions report load-related increases of frontal-midline theta during encoding and maintenance.
    zh: 被试听或看长度逐渐增加的数字序列，按原顺序（顺背）或倒序（倒背）复述，广度为能正确复述的最长序列。对计算机化版本的 EEG 研究报告了编码与保持期间额中线 θ 随负荷增加而增强。
  markers:
  - MK.frontal_midline_theta
  first_source:
    citation: Jacobs J. Experiments on "prehension". Mind. 1887;os-12(45):75-79.
    doi: 10.1093/mind/os-12.45.75
    year: 1887
    verified: false
  aliases:
  - DS
  - Forward/Backward Span
  - digit span backward
  - backward span
