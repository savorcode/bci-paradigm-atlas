- id: MEM-CIT
  name:
    en: Concealed information test (P300-based)
    zh: 隐匿信息测试（P300）
  family: memory
  description:
    en: Participants view a series of items in which one item (the probe) is related to information known only to knowledgeable
      participants, such as details of a mock crime, embedded among equally plausible irrelevant items, with a separate target
      item requiring a response. Because the probe is personally significant only for a knowledgeable participant, it elicits
      a larger P3b than irrelevant items, which is used to detect recognition of concealed information.
    zh: 被试观看一系列项目，其中一个项目（探测项）与只有知情者才知道的信息（如模拟犯罪的细节）有关，并混在同样合理的无关项目中，另有一个需要反应的靶项目。由于探测项只对知情被试具有个人意义，它比无关项目诱发更大的 P3b，据此检测对隐匿信息的再认。
  markers:
  - MK.P3b
  first_source:
    citation: 'Farwell LA, Donchin E. The Truth Will Out: Interrogative Polygraphy ("Lie Detection") With Event-Related Brain
      Potentials. Psychophysiology. 1991;28(5):531-547.'
    doi: 10.1111/j.1469-8986.1991.tb01990.x
    year: 1991
    verified: false
  aliases:
  - CIT
  - guilty knowledge test
  - P300-based concealed information test
  - memory detection
  - P300-based CIT
