  - curator_a
- id: IMG-MA
  name:
    en: Mental arithmetic
    zh: 心算
  family: imagery
  description:
    en: Participants silently perform calculations, typically serial subtraction of a small number from a cued starting number,
      in blocks alternating with rest or another mental task. Calculation increases prefrontal oxygenated haemoglobin in fNIRS
      and frontal midline theta in EEG, which serve as features in mental-task BCIs.
    zh: 被试默默进行计算，通常是从提示的起始数字连续减去一个小数，按组块与休息或另一种心理任务交替。计算使 fNIRS 测得的前额叶氧合血红蛋白升高、EEG 额中线 θ 增强，这些特征用于心理任务脑机接口。
  markers:
  - MK.HbO_prefrontal
  - MK.frontal_midline_theta
  first_source:
    citation: A new mode of EEG based communication.
    verified: false
  aliases:
  - MA
  - mental calculation
  - serial subtraction
  notes: 'migrated from schema-0.1 file IMG-MA-001. D-062/D-063 (2026-10-05): class origin candidate = Keirn & Aunon 1990 (R0842,
    title-only record, unverified); IMG-MA-001 is the canonical two-class configuration, IMG-MA-002 the multi-class set -
    no swap.'
  status: draft
  contributors:
  - maintainer
- id: IMG-OLF
  name:
    en: Olfactory imagery
    zh: 嗅觉想象
  family: imagery
  description:
    en: Participants are cued (e.g. by an odour name) to imagine smelling an odour, compared with imagining its visual appearance
      or with rest. Odour imagery activates primary olfactory (piriform) cortex and related regions in a way that partly mirrors
      odour perception.
    zh: 以提示（如气味名称）让被试想象闻到某种气味，并与想象其视觉外观或休息条件比较。气味想象激活初级嗅觉（梨状）皮层及相关区域，部分类似于气味知觉。
  markers:
