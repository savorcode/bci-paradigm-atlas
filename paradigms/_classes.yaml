  - curator_a
- id: IMG-CMD
  name:
    en: Command-following imagery
    zh: 指令跟随想象（意识评估）
  family: imagery
  description:
    en: Patients with disorders of consciousness (and healthy controls) are verbally instructed to alternate between rest
      and a mental imagery task, such as imagining playing tennis or walking through their home. Reliable task-locked activation
      of the supplementary motor area (motor imagery) or of parahippocampal/navigation regions (spatial imagery) in fMRI,
      or sensorimotor rhythm changes in EEG, is taken as evidence of covert command following.
    zh: 对意识障碍患者（及健康对照）给出口头指令，让其在休息与心理想象任务（如想象打网球或在家中行走）之间交替。fMRI 中辅助运动区（运动想象）或海马旁回/导航网络（空间想象）出现与任务锁时的稳定激活，或 EEG 中出现感觉运动节律变化，被视为隐性指令跟随的证据。
  markers:
  - MK.BOLD_motor_network
  - MK.BOLD_parahippocampal
  - MK.SMR_ERD
  first_source:
    citation: Owen AM, Coleman MR, Boly M, Davis MH, Laureys S, Pickard JD. Detecting awareness in the vegetative state. Science.
      2006;313(5792):1402.
    doi: 10.1126/science.1130197
    pmid: '16959998'
    year: 2006
    verified: false
  aliases:
  - mental imagery command-following
  - active paradigm for DoC
  - covert consciousness detection
  - cognitive motor dissociation assessment
  - tennis/navigation imagery
  - spatial navigation imagery
  - house navigation imagery
  - fMRI yes/no communication
  notes: 'migrated from schema-0.1 file IMG-CMD-001; sprint 2 (D-057): aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
