- id: CTL-FORAGE
  name:
    en: Foraging decision task
    zh: 觅食决策（留守/探索）
  family: control
  description:
    en: Participants decide whether to engage with a currently offered option or to search the environment for alternatives
      at a cost, so that the value of foraging depends on the average value of the environment. Dorsal anterior cingulate
      BOLD activity tracks the value of searching and the average environmental value.
    zh: 被试决定是接受当前提供的选项，还是付出代价在环境中搜索其他选项，因而觅食的价值取决于环境的平均价值。背侧前扣带 BOLD 活动反映搜索的价值和环境平均价值。
  markers:
  - MK.BOLD_dACC
