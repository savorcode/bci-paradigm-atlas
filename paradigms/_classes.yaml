- id: STA-ANES
  name:
    en: Anesthesia and level of consciousness
    zh: 麻醉与意识水平
  family: state
  description:
    en: EEG is recorded while an anaesthetic such as propofol is administered and withdrawn, often with periodic auditory
      or verbal probes to determine loss and return of responsiveness. Unconsciousness is accompanied by large slow waves
      and by anteriorization of alpha power toward frontal sites.
    zh: 在给予与撤除麻醉药（如丙泊酚）的过程中记录脑电，常以周期性的听觉或言语探测确定反应性的丧失与恢复。意识丧失伴随大幅慢波以及 α 功率向额区前移。
  markers:
