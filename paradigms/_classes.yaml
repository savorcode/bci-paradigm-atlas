  family: perception
  description:
    en: Diffuse light flashes, often delivered through closed eyelids or goggles, evoke a sequence of occipital positive and
      negative waves. The flash VEP is used when pattern stimulation is not possible, for example in infants or uncooperative
      patients.
    zh: 以弥散闪光刺激（常通过闭合的眼睑或护目镜给予）诱发枕区一系列正负波。闪光 VEP 用于无法进行图形刺激的情况，如婴儿或不能配合的患者。
