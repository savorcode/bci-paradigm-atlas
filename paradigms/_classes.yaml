- id: SSR-SSVEP
  name:
    en: Steady-state visual evoked potential paradigm
    zh: 稳态视觉诱发电位范式
  family: steady_state
  description:
    en: A visual stimulus, or several stimuli at once, flickers or reverses at a constant frequency, and occipital activity
      follows the stimulation frequency and its harmonics. Concrete paradigms range from passive single-stimulus recordings
      and clinical photic stimulation to frequency tagging of attention and SSVEP BCIs in which the attended target is identified
      by its frequency (and phase) code.
    zh: 一个或多个视觉刺激以恒定频率闪烁或翻转，枕区活动跟随刺激频率及其谐波。具体范式包括被动的单刺激记录、临床闪光刺激、注意的频率标记，以及按频率（和相位）编码识别被注视目标的 SSVEP 脑机接口。
  markers:
  - MK.SSVEP
  first_source:
    citation: Regan D. Some characteristics of average steady-state and transient responses evoked by modulated light. Electroencephalogr
      Clin Neurophysiol. 1966;20(3):238-248.
    doi: 10.1016/0013-4694(66)90088-5
    year: 1966
    verified: false
  aliases:
