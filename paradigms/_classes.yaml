- id: CTL-IGT
  name:
    en: Iowa gambling task
    zh: 爱荷华赌博任务
  family: control
  description:
    en: Participants repeatedly draw cards from four decks that differ in their schedules of gains and losses; two decks give
      large immediate gains but larger long-term losses. Loss and gain feedback elicits the FRN, and ventromedial prefrontal
      activity relates to advantageous choice.
    zh: 被试反复从四副牌中抽牌，各牌组的得失安排不同，其中两副即时收益大但长期损失更大。损失和收益反馈诱发 FRN，腹内侧前额叶活动与有利选择相关。
  markers:
  - MK.FRN
  - MK.BOLD_vmPFC_value
  first_source:
    citation: Bechara A, Damasio AR, Damasio H, Anderson SW. Insensitivity to future consequences following damage to human
      prefrontal cortex. Cognition. 1994;50(1-3):7-15.
    doi: 10.1016/0010-0277(94)90018-3
    pmid: '8039375'
