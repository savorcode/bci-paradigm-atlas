- id: CTL-FLK
  name:
    en: Eriksen flanker task
    zh: Flanker 任务
  family: control
  description:
    en: Participants identify a central target (letter or arrow) flanked by distractors that are associated with the same
      (congruent) or the opposite (incongruent) response. Incongruent trials elicit a fronto-central N2, and erroneous responses
      elicit the error-related negativity followed by the error positivity.
    zh: 被试辨认中央目标（字母或箭头），其两侧的干扰项与目标对应相同（一致）或相反（不一致）的反应。不一致试次诱发额中央 N2，错误反应诱发错误相关负波（ERN），随后出现错误正波（Pe）。
