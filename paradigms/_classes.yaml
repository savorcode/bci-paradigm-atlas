- id: IMG-AUD
  name:
    en: Auditory imagery
    zh: 听觉想象
  family: imagery
  description:
    en: Participants imagine hearing sounds, typically a familiar melody, often continuing a tune after its first notes are
      played or comparing pitches in an imagined song. Imagery activates secondary auditory cortex (with associated frontal
      and supplementary motor regions) and, in intracranial recordings, elicits high-gamma activity over auditory cortex that
      partly resembles the response to the heard sound.
    zh: 被试想象听到声音（通常为熟悉的旋律），常见做法是在播放前几个音后继续想象曲调，或比较想象歌曲中的音高。想象激活次级听皮层（以及相关的额叶和辅助运动区），颅内记录中可在听皮层引起与实际听音部分相似的高 γ 活动。
  markers:
  - MK.BOLD_auditory_cortex
  - MK.high_gamma
  first_source:
    citation: 'Zatorre RJ, Halpern AR, Perry DW, Meyer E, Evans AC. Hearing in the mind''s ear: a PET investigation of musical
      imagery and perception. Journal of Cognitive Neuroscience. 1996;8(1):29-46.'
    doi: 10.1162/jocn.1996.8.1.29
    year: 1996
    verified: false
  aliases:
  - auditory imagery
  - imagined sounds
  - musical imagery
  - imagined music
  notes: migrated from schema-0.1 file IMG-AUD-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
