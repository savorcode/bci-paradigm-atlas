- id: EMO-WORD
  name:
    en: Emotional word reading
    zh: 情绪词阅读
  family: emotion
  description:
    en: Emotionally positive, negative and neutral words are presented, often in rapid streams, during silent reading or a
      lexical or evaluative task. Emotional words elicit an enhanced early posterior negativity about 200-300 ms after onset
      and a larger late positive potential.
    zh: 在默读或词汇、评价任务中呈现正性、负性和中性情绪词，常以快速序列呈现。情绪词在出现后约 200–300 毫秒诱发增强的早期后部负波，并诱发更大的晚期正电位。
  markers:
