  first_source:
    citation: 'Kirwan, C. B., & Stark, C. E. L. Overcoming interference: An fMRI investigation of pattern separation in the
      medial temporal lobe. Learning & Memory, 14(9), 625–633. 2007.'
    doi: 10.1101/lm.663507
    pmid: '17848502'
