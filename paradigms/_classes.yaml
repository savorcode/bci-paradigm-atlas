  - curator_e
- id: SSR-NSSEP
  name:
    en: Nociceptive steady-state evoked potentials
    zh: 伤害性稳态诱发电位
  family: steady_state
  description:
    en: Rapid periodic thermal (laser) stimulation of the skin, for example at 7 Hz, activates nociceptors repeatedly. The
      EEG shows a steady-state response at the stimulation frequency with a topography different from non-nociceptive vibrotactile
      steady-state responses.
    zh: 以快速周期性热（激光）刺激皮肤（如 7 Hz），反复激活伤害感受器。脑电在刺激频率处出现稳态响应，其头皮分布不同于非伤害性振动触觉稳态响应。
  markers:
