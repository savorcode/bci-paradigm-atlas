- id: SOC-TRUST
  name:
    en: Trust game and prisoner's dilemma
    zh: 信任博弈与囚徒困境
  family: social
  description:
    en: In the trust game an investor sends money to a trustee, the amount is multiplied, and the trustee decides how much
      to return; in the prisoner's dilemma two players simultaneously choose to cooperate or defect. Partner decisions elicit
