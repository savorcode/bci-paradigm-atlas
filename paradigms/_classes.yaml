- id: SSR-SSSEP
  name:
    en: Steady-state somatosensory evoked potential (SSSEP)
    zh: 稳态体感诱发电位
  family: steady_state
  description:
    en: Vibrotactile stimulation at a constant frequency (typically 20-30 Hz) is applied to the fingers or wrists. Somatosensory
      cortex responds at the stimulation frequency, and the response is enhanced when attention is directed to the stimulated
