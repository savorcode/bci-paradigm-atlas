- id: CTL-SYLL
  name:
    en: Syllogistic (deductive) reasoning
    zh: 三段论推理
  family: control
  description:
    en: Participants evaluate whether the conclusion of a syllogism or other deductive argument follows logically from its
      premises, with content that is concrete, abstract or belief-laden. Deductive inference engages a distributed left-lateralised
      frontal and parietal network, including rostral prefrontal cortex.
    zh: 被试判断三段论或其他演绎论证的结论是否在逻辑上由前提推出，论证内容可为具体、抽象或与信念相关。演绎推理激活分布式、偏左侧的额叶与顶叶网络，包括喙部前额叶。
  markers:
  - MK.BOLD_frontoparietal
  first_source:
    citation: Goel V, Buchel C, Frith C, Dolan RJ. Dissociation of Mechanisms Underlying Syllogistic Reasoning. NeuroImage.
      2000;12(5):504-514.
    doi: 10.1006/nimg.2000.0636
