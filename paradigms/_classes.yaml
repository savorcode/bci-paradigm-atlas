schema_version: '0.2'
terms:
- id: PER-AAD
  name:
    en: Auditory selective attention (cocktail party)
    zh: 听觉选择性注意（鸡尾酒会）
  family: perception
  description:
    en: Two or more concurrent speech streams (or tone sequences) are presented and the listener attends to one of them. The
      attended stream is identified from enhanced auditory N1 responses and from cortical tracking of its speech envelope,
      which underlies auditory attention decoding for neuro-steered hearing devices.
    zh: 同时呈现两路或多路语音流（或音调序列），被试只注意其中一路。被注意语流引起更大的听觉 N1，皮层对其语音包络的跟踪更强，据此可识别注意对象，这是神经调控助听设备中听觉注意解码的基础。
  markers:
  - MK.N1_auditory
  - MK.speech_envelope_tracking
  first_source:
    citation: O'Sullivan JA, Power AJ, Mesgarani N, Rajaram S, Foxe JJ, Shinn-Cunningham BG, Slaney M, Shamma SA, Lalor EC.
      Attentional selection in a cocktail party environment can be decoded from single-trial EEG. Cereb Cortex. 2015;25(7):1697-1706.
    doi: 10.1093/cercor/bht355
    year: 2015
    verified: false
  aliases:
  - auditory attention decoding (AAD)
  - cocktail party paradigm
  - competing-talker paradigm
  - dichotic listening
  notes: migrated from schema-0.1 file PER-AAD-001 [curator_e sprint 3, 2026-10-05] bibliography corrected (Crossref, 2026-10-05)
    (class origin taken from PER-AAD-001, D-062).
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-AB
  name:
    en: Attentional blink
    zh: 注意瞬脱
  family: perception
  description:
    en: Two targets are embedded in a rapid serial visual presentation stream. When the second target follows the first within
      roughly 200-500 ms it is often missed, and missed second targets show a reduced or absent P3b compared with reported
      ones.
    zh: 在快速序列视觉呈现流中嵌入两个靶刺激。当第二个靶刺激在第一个之后约 200–500 ms 内出现时常被漏报，被漏报的第二靶刺激所诱发的 P3b 较被报告者明显减小或消失。
  markers:
  - MK.P3b
  first_source:
    citation: 'Raymond, J. E., Shapiro, K. L., & Arnell, K. M. Temporary suppression of visual processing in an RSVP task:
      An attentional blink? Journal of Experimental Psychology: Human Perception and Performance. 1992.'
    doi: 10.1037/0096-1523.18.3.849
    pmid: '1500880'
    year: 1992
    verified: false
  aliases:
  - AB
  - attentional blink
  - dual-target RSVP
  notes: migrated from schema-0.1 file PER-AB-001 [curator_e sprint 3, 2026-10-05] bibliography confirmed (OpenAlex, 2026-10-05).
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-ABR
  name:
    en: Auditory brainstem response (ABR)
    zh: 听觉脑干反应
  family: perception
  description:
    en: Brief clicks or tone bursts are presented at high rates and thousands of responses are averaged. The response within
      the first ~10 ms shows waves I-V generated along the auditory nerve and brainstem pathway; their latencies are used
      for hearing screening and neurodiagnosis.
    zh: 以较高速率呈现短声或短纯音，并对数千次响应进行叠加平均。刺激后约 10 ms 内出现由听神经和脑干通路产生的 I–V 波，其潜伏期用于听力筛查和神经诊断。
  markers:
  - MK.ABR
  first_source:
    citation: Jewett DL, Williston JS. Auditory-evoked far fields averaged from the scalp of humans. Brain. 1971;94(4):681-696.
    doi: 10.1093/brain/94.4.681
    year: 1971
    verified: false
  aliases:
  - ABR
  - BAEP
  - BAER
  - brainstem auditory evoked potential
  notes: migrated from schema-0.1 file PER-ABR-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-ABR-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-ACC
  name:
    en: Acoustic change complex
    zh: 声学变化复合波
  family: perception
  description:
    en: A change is introduced within an ongoing sound (for example in frequency, intensity or a vowel transition) and is
      presented in every trial without an oddball structure. The change evokes an N1-P2 complex, the acoustic change complex,
      which indicates cortical detection of the change and is used clinically, for example in cochlear-implant users.
    zh: 在持续的声音中引入变化（如频率、强度或元音过渡的变化），每个试次都出现该变化而不采用 oddball 结构。变化诱发 N1–P2 复合波，即声学变化复合波，表明皮层检测到了变化，临床上用于如人工耳蜗使用者。
  markers:
  - MK.N1_auditory
  - MK.P2_auditory
  first_source:
    citation: Ostroff JM, Martin BA, Boothroyd A. Cortical evoked response to acoustic change within a syllable. Ear Hear.
      1998;19(4):290-297.
    doi: 10.1097/00003446-199808000-00004
    year: 1998
    verified: false
  aliases:
  - ACC
  - acoustic change complex
  notes: migrated from schema-0.1 file PER-ACC-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-ACC-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-ADDS
  name:
    en: Additional singleton / distractor suppression
    zh: 附加单例与干扰抑制
  family: perception
  description:
    en: Participants search for a shape target while a salient colour singleton distractor is sometimes present. Lateralised
      distractors that are suppressed elicit a distractor positivity (Pd) contralateral to the distractor, whereas captured
      distractors elicit an N2pc.
    zh: 被试搜索形状靶刺激，有时会出现显著的颜色单例干扰项。被抑制的偏侧干扰项在其对侧诱发干扰正波（Pd），而捕获注意的干扰项则诱发 N2pc。
  markers:
  - MK.Pd
  first_source:
    citation: Theeuwes J. Perceptual selectivity for color and form. Percept Psychophys. 1992;51(6):599-606.
    doi: 10.3758/BF03211656
    year: 1992
    verified: false
  aliases:
  - additional singleton paradigm
  - attentional capture
  - Pd paradigm
  notes: migrated from schema-0.1 file PER-ADDS-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-ADDS-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-AEP
  name:
    en: Auditory evoked potentials (N1-P2)
    zh: 听觉诱发电位（纯音/短声）
  family: perception
  description:
    en: Pure tones or clicks are presented passively with inter-stimulus intervals of about one second or longer. Each sound
      evokes the obligatory long-latency N1-P2 complex over fronto-central sites, whose amplitude depends on stimulus intensity,
      rise time and inter-stimulus interval.
    zh: 被动呈现纯音或短声，刺激间隔约 1 秒或更长。每个声音在额中央区诱发必然出现的长潜伏期 N1–P2 复合波，其波幅随刺激强度、上升时间和刺激间隔变化。
  markers:
  - MK.N1_auditory
  - MK.P2_auditory
  first_source:
    citation: Davis PA. Effects of acoustic stimuli on the waking human brain. J Neurophysiol. 1939;2(6):494-499.
    doi: 10.1152/jn.1939.2.6.494
    year: 1939
    verified: false
  aliases:
  - N1-P2 complex
  - N1m
  - cortical auditory evoked potential (CAEP)
  - long-latency AEP
  notes: migrated from schema-0.1 file PER-AEP-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-AEP-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-AMASK
  name:
    en: Auditory masking
    zh: 听觉掩蔽
  family: perception
  description:
    en: Target tones or speech are presented in background noise or with competing maskers at varying signal-to-noise ratios.
      Masking reduces and delays the auditory N1 and the MMN to changes in the target, in parallel with detection thresholds.
    zh: 在背景噪声或竞争掩蔽声中以不同信噪比呈现目标纯音或语音。掩蔽使听觉 N1 及目标变化诱发的 MMN 减小、延迟，与检测阈限的变化相平行。
  markers:
  - MK.N1_auditory
  - MK.MMN
  first_source:
    citation: Wegel RL, Lane CE. The auditory masking of one pure tone by another and its probable relation to the dynamics
      of the inner ear. Phys Rev. 1924;23(2):266-285.
    doi: 10.1103/PhysRev.23.266
    year: 1924
    verified: false
  aliases:
  - Energetic Masking
  - Speech-in-Noise
  - Tone-in-Noise Detection
  notes: migrated from schema-0.1 file PER-AMASK-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-AMASK-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-BODY
  name:
    en: Body perception
    zh: 身体知觉
  family: perception
  description:
    en: Images of human bodies and body parts (without faces) are contrasted with objects, faces or scrambled images. Bodies
      elicit selective BOLD responses in the extrastriate body area of lateral occipito-temporal cortex and an occipito-temporal
      negativity in the N170 range.
    zh: 将人体及身体部位图像（不含面孔）与物体、面孔或打乱图像对比。身体图像在外侧枕颞皮层的纹外身体区引起选择性 BOLD 响应，并在 N170 时程诱发枕颞负波。
  markers:
  - MK.BOLD_category_selective
  - MK.N170
  first_source:
    citation: Downing PE, Jiang Y, Shuman M, Kanwisher N. A cortical area selective for visual processing of the human body.
      Science. 2001;293(5539):2470-2473.
    doi: 10.1126/science.1063414
    year: 2001
    verified: false
  aliases:
  - body localizer
  - extrastriate body area localizer
  - EBA localizer
  notes: migrated from schema-0.1 file PER-BODY-001 [curator_e sprint 3, 2026-10-05] bibliography corrected (Crossref, 2026-10-05)
    (class origin taken from PER-BODY-001, D-062).
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-BOI
  name:
    en: Body ownership illusion
    zh: 身体拥有错觉（橡胶手）
  family: perception
  description:
    en: A rubber or virtual hand in view is stroked synchronously with the participant's hidden real hand, which induces a
      feeling of ownership of the fake hand; asynchronous stroking serves as control. The illusion is associated with BOLD
      increases in premotor and posterior parietal cortex.
    zh: 在被试视野中的橡胶手或虚拟手与其被遮挡的真手同步受到刷触，诱发对假手的拥有感；异步刷触作为对照。该错觉与前运动皮层和后顶叶的 BOLD 增加相关。
  markers:
  - MK.BOLD_premotor_parietal
  first_source:
    citation: Botvinick, M., & Cohen, J. Rubber hands 'feel' touch that eyes see. Nature, 391(6669), 756. 1998.
    doi: 10.1038/35784
    pmid: '9486643'
    year: 1998
    verified: false
  aliases:
  - Body Transfer Illusion
  - Enfacement Illusion
  - Full Body Illusion
  - Multisensory Body Illusion
  - RHI
  - Rubber Hand Illusion
  - Virtual Hand Illusion
  notes: migrated from schema-0.1 file PER-BOI-001 [curator_e sprint 3, 2026-10-05] bibliography confirmed (OpenAlex, 2026-10-05).
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-BR
  name:
    en: Binocular rivalry / bistable perception
    zh: 双眼竞争与双稳态知觉
  family: perception
  description:
    en: Dissimilar images are presented to the two eyes (or an ambiguous figure is shown), and perception alternates although
      the input is constant. Neural activity tracking the dominant percept is measured with frequency-tagged steady-state
      responses, each image flickering at its own rate, or with visual cortex BOLD time-locked to reported switches.
    zh: 向双眼分别呈现不同图像（或呈现一个两可图形），输入不变而知觉在两种解释间交替。通过频率标记的稳态响应（两幅图像以不同频率闪烁）或与报告的知觉转换锁时的视皮层 BOLD 信号，测量跟随优势知觉的神经活动。
  markers:
  - MK.SSVEP
  - MK.BOLD_visual_cortex
  first_source:
    citation: Wheatstone C. Contributions to the physiology of vision. Part the first. On some remarkable, and hitherto unobserved,
      phenomena of binocular vision. Philos Trans R Soc Lond. 1838;128:371-394.
    doi: 10.1098/rstl.1838.0019
    year: 1838
    verified: false
  aliases:
  - ambiguous figure (Necker cube) paradigm
  - binocular rivalry
  - bistable perception
  - perceptual rivalry
  - frequency-tagged rivalry
  - SSVEP rivalry
  notes: 'migrated from schema-0.1 file PER-BR-001; sprint 2 (D-057): aliases updated from curation/work/pkg_A/sprint2/class_updates.yaml
    [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search (OpenAlex, 2026-10-05); content unverified
    (class origin taken from PER-BR-001, D-062); PER-BR-002 (Lansing 1964) is later. [maintainer sprint 3, 2026-10-07] bibliography
    confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07, D-073] origin
    candidate recalled, record confirmed via OpenAlex.'
  status: draft
  contributors:
  - maintainer
  - curator_a
  - curator_e
- id: PER-CAT
  name:
    en: Visual object categorization
    zh: 视觉物体类别识别
  family: perception
  description:
    en: Images of objects from different categories (for example faces, bodies, places, tools, animals) are presented, often
      in rapid succession. Category information is read out from the occipito-temporal N170/M170 and from category-selective
      BOLD responses in ventral visual cortex, and is the basis of image-category decoding datasets.
    zh: 呈现不同类别物体的图像（如面孔、身体、场景、工具、动物），常以快速序列呈现。可从枕颞 N170/M170 和腹侧视觉皮层类别选择性 BOLD 响应中读出类别信息，这也是图像类别解码数据集的基础。
  markers:
  - MK.N170
  - MK.BOLD_category_selective
  first_source:
    citation: Ungerleider, L.G., Mishkin, M. Two cortical visual systems. Analysis of Visual Behavior (MIT Press). 1982.
    year: 1982
    verified: false
  aliases:
  - THINGS-EEG/MEG paradigm
  - image category RSA
  - object category decoding
  - visual object recognition paradigm
  notes: migrated from schema-0.1 file PER-CAT-001
  status: draft
  contributors:
  - maintainer
- id: PER-CB
  name:
    en: Change blindness
    zh: 变化盲
  family: perception
  description:
    en: Two versions of a scene alternate with a brief blank or other disruption, and participants report whether a change
      occurred. Detected compared with undetected changes elicit a posterior negativity (visual awareness negativity) followed
      by later positivity.
    zh: 同一场景的两个版本交替出现，中间插入短暂空屏或其他干扰，被试报告是否发生变化。与未察觉的变化相比，被察觉的变化诱发后部负波（视觉觉知负波），其后出现晚期正波。
  markers:
  - MK.VAN
  first_source:
    citation: 'Rensink RA, O''Regan JK, Clark JJ. To see or not to see: the need for attention to perceive changes in scenes.
      Psychol Sci. 1997;8(5):368-373.'
    doi: 10.1111/j.1467-9280.1997.tb00427.x
    year: 1997
    verified: false
  aliases:
  - change blindness
  - flicker paradigm
  notes: migrated from schema-0.1 file PER-CB-001 [curator_e sprint 3, 2026-10-05] candidate origin found by bibliographic search
    (OpenAlex, 2026-10-05); content unverified (class origin taken from PER-CB-001, D-062). [maintainer sprint 3, 2026-10-07]
    bibliography confirmed (OpenAlex, 2026-10-05; origin candidate, content unverified). [maintainer sprint 3, 2026-10-07,
    D-073] origin candidate recalled, record confirmed via OpenAlex.
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-CTXC
  name:
    en: Contextual cueing
    zh: 情境线索效应
  family: perception
  description:
    en: Participants search for a target in displays of distractors, some of which repeat across blocks with a fixed target
      position. Search becomes faster for repeated configurations without explicit recognition; the learned context enhances
      the N2pc to the target and engages the hippocampus.
    zh: 被试在干扰项中搜索靶刺激，部分画面布局跨组块重复且靶位置固定。即使不能外显识别，重复布局下的搜索也会变快；习得的情境增强靶刺激的 N2pc，并激活海马。
  markers:
  - MK.N2pc
  - MK.BOLD_hippocampus
  first_source:
    citation: 'Chun, M. M., & Jiang, Y. Contextual cueing: Implicit learning and memory of visual context guides spatial attention.
      Cognitive Psychology, 36(1), 28–71. 1998.'
    doi: 10.1006/cogp.1998.0681
    pmid: '9679076'
    year: 1998
    verified: false
  aliases:
  - CC Task
  notes: migrated from schema-0.1 file PER-CTXC-001 [curator_e sprint 3, 2026-10-05] bibliography confirmed (Crossref, 2026-10-05).
  status: draft
  contributors:
  - maintainer
  - curator_e
- id: PER-CUE
  name:
    en: Posner spatial cueing
    zh: Posner 空间线索
  family: perception
  description:
    en: A cue (central arrow or peripheral flash) indicates where a target is likely to appear; targets at validly cued locations
      are detected faster than at invalidly cued ones. Targets at attended locations elicit enlarged visual P1 and N1 components.
    zh: 线索（中央箭头或外周闪光）提示靶刺激可能出现的位置；出现在有效提示位置的靶刺激比无效提示位置的反应更快。出现在被注意位置的靶刺激诱发更大的视觉 P1 和 N1 成分。
  markers:
  - MK.P1_visual
  - MK.N1_visual
  first_source:
    citation: Posner, M. I. Orienting of attention. Quarterly Journal of Experimental Psychology. 1980.
    doi: 10.1080/00335558008248231
    pmid: '7367577'
    year: 1980
    verified: false
  aliases:
  - Posner Task
  - Posner cueing task
  - Spatial Cueing Task
  - endogenous/exogenous cueing
  - spatial cueing
  - exogenous cueing
  - peripheral cueing
  - inhibition of return paradigm
  notes: 'migrated from schema-0.1 file PER-CUE-001; sprint 2 (D-057): aliases updated from curation/work/pkg_A/sprint2/class_updates.yaml
    [curator_e sprint 3, 2026-10-05] bibliography confirmed (Crossref, 2026-10-05).'
  status: draft
  contributors:
  - maintainer
  - curator_a
  - curator_e
- id: PER-CVA
  name:
    en: Covert spatial attention (alpha lateralization)
    zh: 隐蔽空间注意（α 偏侧化）
  family: perception
  description:
    en: A central cue directs covert attention to the left or right visual hemifield while gaze stays at fixation. In the
      cue-target interval, posterior alpha power decreases over the hemisphere contralateral to the attended side and increases
      ipsilaterally; this alpha lateralization indexes the spatial bias of attention and can serve as a gaze-independent BCI
      signal.
    zh: 中央线索提示被试在保持注视的前提下，将注意隐蔽地转向左侧或右侧视野。在线索与靶刺激之间，后部 α 功率在被注意一侧的对侧半球降低、同侧半球升高；这种 α 偏侧化反映注意的空间偏向，可作为不依赖眼动的脑机接口信号。
  markers:
  - MK.alpha_lateralization
  first_source:
    citation: Thut G, Nietzel A, Brandt SA, Pascual-Leone A. α-Band Electroencephalographic Activity over Occipital Cortex
      Indexes Visuospatial Attention Bias and Predicts Visual Target Detection. Journal of Neuroscience. 2006;26(37):9494-9502.
    doi: 10.1523/JNEUROSCI.0875-06.2006
    year: 2006
    verified: false
  aliases:
  - Posner-type alpha paradigm
  - alpha lateralization
  - covert visuospatial attention
  - covert attention BCI
  - alpha lateralization BCI
  - gaze-independent covert attention BCI
  notes: 'migrated from schema-0.1 file PER-CVA-001; sprint 2 (D-057): aliases updated from curation/work/pkg_A/sprint2/class_updates.yaml
    [curator_e sprint 3, 2026-10-05] bibliography confirmed (Crossref, 2026-10-05).'
  status: draft
  contributors:
  - maintainer
  - curator_a
  - curator_e
- id: PER-FACE
  name:
    en: Face perception
    zh: 面孔知觉
  family: perception
  description:
    en: Faces are contrasted with other object categories or with scrambled images. Faces elicit a larger occipito-temporal
      N170 (M170) and stronger BOLD responses in face-selective regions such as the fusiform face area; the contrast is also
      used as a functional localizer.
    zh: 将面孔与其他物体类别或打乱图像进行对比。面孔诱发更大的枕颞 N170（M170），并在梭状回面孔区等面孔选择性区域引起更强的 BOLD 响应；该对比也用作功能定位任务。
