- id: SOC-EYE
  name:
    en: Live eye-to-eye contact
    zh: 真人双向目光接触
  family: social
  description:
    en: Two partners face each other and alternate between looking into each other's eyes and looking at a control target
      such as eyes in a photograph, while both brains are recorded. Real eye contact increases cross-brain coherence of hemodynamic
      signals in frontal, temporal and parietal regions.
    zh: 两名同伴面对面，在相互注视对方眼睛与注视对照目标（如照片中的眼睛）之间交替，同时记录双方脑活动。真实目光接触增强额、颞、顶区血流动力学信号的脑间相干。
