- id: LAN-VG
  name:
    en: Verb generation
    zh: 动词生成
  family: language
  description:
    en: Participants see or hear nouns and generate an associated verb for each (for example 'hammer' - 'pound'), compared
      with simply repeating or reading the noun. Verb generation activates the left inferior frontal gyrus and other parts
      of the language network, and the task is widely used for clinical language lateralisation.
    zh: 被试看到或听到名词后，为每个名词生成一个相关动词（如“锤子”—“敲”），并与单纯复述或朗读名词比较。动词生成激活左侧额下回及语言网络其他部分，常用于临床语言偏侧化评估。
