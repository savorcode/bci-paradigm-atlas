- id: LAN-NWL
  name:
    en: Novel word learning
    zh: 新词学习
  family: language
  description:
    en: Participants encounter novel pseudowords whose meanings can be inferred from sentence contexts, pictures or definitions,
      and are later tested on them. As meaning is acquired, novel words come to elicit N400 effects similar to those of known
      words, for example an N400 reduction when followed by semantically related words.
    zh: 被试接触新的假词，其意义可从句子语境、图片或定义中推断，随后对这些词进行测试。随着意义的习得，新词开始诱发与已知词类似的 N400 效应，例如其后呈现语义相关词时 N400 减弱。
  markers:
  - MK.N400
  first_source:
    citation: 'Perfetti CA, Wlotko EW, Hart LA. Word Learning and Individual Differences in Word Learning Reflected in Event-Related
      Potentials. Journal of Experimental Psychology: Learning, Memory, and Cognition. 2005;31(6):1281-1292.'
    doi: 10.1037/0278-7393.31.6.1281
    year: 2005
    verified: false
  aliases:
  - word learning from context
  - fast mapping
  - pseudoword meaning acquisition
