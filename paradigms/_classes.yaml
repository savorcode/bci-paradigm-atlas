- id: CTL-WCST
  name:
    en: Wisconsin Card Sorting Test
    zh: 威斯康星卡片分类
  family: control
  description:
    en: Participants sort cards by colour, shape or number according to a rule they must infer from right/wrong feedback,
      and the rule changes without warning after a run of correct sorts. Rule shifts engage dorsolateral prefrontal cortex
      (fMRI, fNIRS), and feedback signalling a shift elicits a P3.
    zh: 被试按颜色、形状或数量对卡片分类，分类规则须从对/错反馈中推断，连续正确若干次后规则会无提示地改变。规则转换激活背外侧前额叶（fMRI、fNIRS），提示需要转换的反馈诱发 P3。
  markers:
  - MK.BOLD_dlPFC
  - MK.P3b
  - MK.HbO_prefrontal
  first_source:
    citation: Grant DA, Berg E. A behavioral analysis of degree of reinforcement and ease of shifting to new responses in
      a Weigl-type card-sorting problem. Journal of Experimental Psychology. 1948;38(4):404-411.
    doi: 10.1037/h0059831
    year: 1948
    verified: false
  aliases:
