- id: MEM-EFT
  name:
    en: Episodic future thinking
    zh: 情景未来思维
  family: memory
  description:
    en: Cued by words, participants either remember specific past personal events or imagine specific plausible future events,
      typically with separate construction and elaboration phases. Both remembering and imagining engage a common core network
      including the hippocampus and medial prefrontal cortex, with some regions more active for future than past events.
    zh: 在词语线索提示下，被试回忆具体的个人过去事件，或想象具体而合理的未来事件，通常分为构建和细化两个阶段。回忆与想象都激活包括海马和内侧前额叶在内的共同核心网络，部分区域在想象未来时比回忆过去时更活跃。
  markers:
  - MK.BOLD_hippocampus
  - MK.BOLD_mPFC
  first_source:
    citation: 'Addis DR, Wong AT, Schacter DL. Remembering the past and imagining the future: Common and distinct neural substrates
      during event construction and elaboration. Neuropsychologia. 2007;45(7):1363-1377.'
    doi: 10.1016/j.neuropsychologia.2006.10.016
    year: 2007
    verified: false
  aliases:
  - EFT
  - future event simulation
  - past-future event construction
  notes: migrated from schema-0.1 file MEM-EFT-001. bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
