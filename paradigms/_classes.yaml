- id: CTL-AS
  name:
    en: Antisaccade task
    zh: 反向眼跳
  family: control
  description:
    en: When a peripheral target appears, participants must suppress the reflexive saccade towards it and instead look to
      the mirror location (antisaccade), often intermixed with prosaccade trials. Preparation is accompanied by presaccadic
      potentials in EEG and by oculomotor (frontal eye field, parietal) BOLD activity.
    zh: 外周目标出现时，被试须抑制朝向目标的反射性眼跳，转而注视其镜像位置（反向眼跳），常与正向眼跳试次混合呈现。眼跳准备伴随 EEG 中的眼跳前电位和动眼网络（额叶眼区、顶叶）的 BOLD 活动。
  markers:
  - MK.presaccadic_potential
  - MK.BOLD_oculomotor
