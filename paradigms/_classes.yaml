- id: CTL-RAVEN
  name:
    en: Raven's progressive matrices
    zh: 瑞文推理
  family: control
  description:
    en: Participants view a matrix of geometric patterns with one cell missing and select the piece that completes it according
      to the underlying relational rules. Solving matrix problems engages a lateral frontoparietal network in fMRI, increasing
      with the number of relations to integrate.
    zh: 被试观看一个缺失一格的几何图案矩阵，依据其中的关系规则选出能补全矩阵的图块。解答矩阵问题激活 fMRI 中的外侧额顶网络，且随需要整合的关系数量增加而增强。
  markers:
  - MK.BOLD_frontoparietal
  first_source:
    citation: 'Penrose LS, Raven JC. A New Series of Perceptual Tests: Preliminary Communication. British Journal of Medical
      Psychology. 1936;16(2):97-104.'
    doi: 10.1111/j.2044-8341.1936.tb00690.x
    year: 1936
    verified: false
