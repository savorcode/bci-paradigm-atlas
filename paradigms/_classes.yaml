- id: LAN-VF
  name:
    en: Verbal fluency
    zh: 言语流畅性
  family: language
  description:
    en: Within a fixed time, participants generate as many words as possible that begin with a given letter (phonemic fluency)
      or belong to a given category (semantic fluency), overtly or covertly. Fluency generation increases prefrontal oxygenated
      haemoglobin in fNIRS and activates left inferior frontal regions in fMRI.
    zh: 被试在限定时间内尽可能多地说出（或默想）以指定字母开头（音位流畅性）或属于指定类别（语义流畅性）的词。流畅性生成在 fNIRS 中提高前额叶氧合血红蛋白，在 fMRI 中激活左侧额下区域。
  markers:
