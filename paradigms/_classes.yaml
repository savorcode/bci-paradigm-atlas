- id: CTL-SW
  name:
    en: Task switching
    zh: 任务切换
  family: control
  description:
    en: Participants alternate between two simple tasks on the same stimuli - in predictable runs, as indicated by an explicit
      cue, or by their own choice - and responses are slower on switch than on repeat trials. Cue-locked switch trials elicit
      a posterior switch-related positivity, and frontal midline theta increases with switching.
    zh: 被试在同一刺激上交替完成两个简单任务——按可预测序列、按显式线索或自主选择——切换试次的反应慢于重复试次。线索锁时的切换试次诱发后部切换相关正波，额中线 θ 随切换增强。
  markers:
  - MK.frontal_midline_theta
  - MK.switch_positivity
  first_source:
    citation: 'Rogers RD, Monsell S. Costs of a predictible switch between simple cognitive tasks. Journal of Experimental
      Psychology: General. 1995;124(2):207-231.'
    doi: 10.1037/0096-3445.124.2.207
    year: 1995
    verified: false
