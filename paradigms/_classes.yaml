  - imagined handwriting
  - mental handwriting
  - EEG handwriting decoding
  notes: 'migrated from schema-0.1 file MOT-HW-001; sprint 2 (D-057): name, description, markers, aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
