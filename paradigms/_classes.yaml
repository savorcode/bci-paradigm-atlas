- id: PER-MVEP
  name:
    en: Motion-onset VEP (mVEP)
    zh: 运动起始视觉诱发电位
  family: perception
  description:
    en: A briefly presented onset of visual motion (for example a moving bar or expanding pattern), with little contrast or
      luminance change, evokes a transient VEP dominated by a motion-specific occipito-temporal N2. Because it requires no
      flicker, the paradigm is used in clinical visual testing and in low-fatigue visual BCIs.
    zh: 短暂呈现视觉运动起始（如移动的条形或扩张图案），且对比度和亮度变化很小，诱发以运动特异的枕颞 N2 为主的瞬态视觉诱发电位。由于不需要闪烁，该范式用于临床视觉检查和低疲劳视觉脑机接口。
  markers:
  - MK.mVEP
  first_source:
    citation: Kuba M, Kubová Z. Visual evoked potentials specific for motion onset. Doc Ophthalmol. 1992;80(1):83-89.
    doi: 10.1007/BF00161234
    year: 1992
    verified: false
  aliases:
  - mVEP
  - motion VEP BCI
  - motion-onset VEP
  - mVEP BCI
  - motion-onset VEP speller
  notes: 'migrated from schema-0.1 file PER-MVEP-001; sprint 2 (D-057): aliases updated from curation/work/pkg_A/sprint2/class_updates.yaml
