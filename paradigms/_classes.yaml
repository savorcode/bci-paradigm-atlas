- id: EMO-TOUCH
  name:
    en: Affective (CT-optimal) touch
    zh: 情感触觉（C 触觉纤维最适触摸）
  family: emotion
  description:
    en: Slow, gentle brush strokes on hairy skin, which preferentially activate unmyelinated C-tactile afferents, are compared
      with faster strokes or stimulation of glabrous skin. CT-optimal touch activates the posterior insular cortex.
    zh: 以缓慢轻柔的刷触刺激有毛皮肤（优先激活无髓鞘的 C 触觉传入纤维），并与较快刷触或无毛皮肤刺激比较。C 触觉最适触摸激活后岛叶皮层。
