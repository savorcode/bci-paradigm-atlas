- id: PER-IC
  name:
    en: Illusory contour perception
    zh: 错觉轮廓知觉
  family: perception
  description:
    en: Inducers (for example Kanizsa 'pac-man' elements) are arranged so that they either form an illusory shape or not.
      Illusory contour configurations modulate the visual N1 range over lateral occipital sites (the IC effect) compared with
      rotated inducers.
    zh: 将诱导元素（如 Kanizsa “吃豆人”图形）排列成能形成或不能形成错觉图形的两种布局。与旋转诱导元素相比，错觉轮廓布局在外侧枕区调制视觉 N1 时程（IC 效应）。
  markers:
