  - curator_a
- id: MOT-PERT
  name:
    en: Balance perturbation
    zh: 姿势平衡扰动
  family: motor
  description:
    en: Standing (or seated) participants receive sudden, unpredictable perturbations of balance, such as support-surface
      translations or pulls, and respond to maintain stability. Each perturbation evokes a large fronto-central negativity
      (perturbation-evoked N1) about 100-200 ms after onset, together with theta-band power increases.
    zh: 站立（或坐位）被试受到突然、不可预测的平衡扰动（如支撑面平移或牵拉），并作出反应以维持稳定。每次扰动在起始后约 100-200 ms 诱发显著的额中央负波（扰动诱发 N1），并伴随 θ 频段功率增强。
  markers:
  - MK.perturbation_N1
  first_source:
    citation: Varghese JP, Marlin A, Beyer KB, Staines WR, Mochizuki G, McIlroy WE. Frequency characteristics of cortical
      activity associated with perturbations to upright stability. Neuroscience Letters 578:33-38. 2014.
    doi: 10.1016/j.neulet.2014.06.017
    year: 2014
    verified: false
  aliases:
  - postural perturbation
  - perturbation-evoked potential
  - PEP
  - support-surface perturbation
  notes: migrated from schema-0.1 file MOT-PERT-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-PURS
  name:
    en: Smooth pursuit eye movements
    zh: 平滑追踪眼动
  family: motor
  description:
    en: Participants follow a smoothly moving visual target (e.g. a dot moving sinusoidally) with their eyes, contrasted with
      fixation or saccade conditions. Pursuit activates the frontal and supplementary eye fields, parietal cortex and motion-sensitive
      cortex.
    zh: 被试用眼睛跟随平滑移动的视觉目标（如做正弦运动的圆点），并与注视或眼跳条件对比。平滑追踪激活额眼区、辅助眼区、顶叶皮层和运动敏感皮层。
  markers:
  - MK.BOLD_oculomotor
  first_source:
    citation: Petit L, Haxby JV. Functional anatomy of pursuit eye movements in humans as revealed by fMRI. Journal of Neurophysiology.
      1999;82(1):463-471.
    doi: 10.1152/jn.1999.82.1.463
    pmid: '10400972'
    year: 1999
    verified: false
  aliases:
  - smooth pursuit
  - pursuit eye movements
  - ocular pursuit
  notes: migrated from schema-0.1 file MOT-PURS-001 bibliography corrected (OpenAlex, 2026-10-05)
