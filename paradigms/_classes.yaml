- id: CTL-RNG
  name:
    en: Random number generation
    zh: 随机数生成
  family: control
  description:
    en: Participants generate a sequence of numbers (or letters) as randomly as possible, typically paced by a tone, which
      requires suppression of habitual sequences such as counting. Random generation increases dorsolateral prefrontal blood
      flow, and TMS over this region increases habitual counting.
    zh: 被试尽可能随机地生成一串数字（或字母），通常由声音提示节拍，这需要抑制如顺序计数之类的习惯性序列。随机生成增加背外侧前额叶血流，对该区域施加 TMS 会增加习惯性计数。
  markers:
  - MK.BOLD_dlPFC
  first_source:
    citation: 'Jahanshahi M, Dirnberger G, Fuller R, Frith CD. The Role of the Dorsolateral Prefrontal Cortex in Random Number
      Generation: A Study with Positron Emission Tomography. NeuroImage. 2000;12(6):713-725.'
    doi: 10.1006/nimg.2000.0647
    year: 2000
    verified: false
  aliases:
  - RNG
  - Random generation task
  - Random letter generation
  notes: migrated from schema-0.1 file CTL-RNG-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
