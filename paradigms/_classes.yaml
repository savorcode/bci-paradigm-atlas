  - curator_b
- id: ERR-TE
  name:
    en: Time estimation task
    zh: 时间估计任务
  family: error
  description:
    en: Participants estimate a fixed time interval (e.g., one second) by pressing a button after a cue and receive feedback
      on whether the estimate fell within an adaptive tolerance window. Negative performance feedback elicits a fronto-central
      feedback-related negativity, the paradigm in which this component was first described.
    zh: 被试在提示后按键以估计一个固定时间间隔（如 1 秒），并获得估计是否落在自适应容差窗口内的反馈。负性表现反馈诱发额中央的反馈相关负波；该成分最早正是在这一范式中被描述的。
  markers:
  - MK.FRN
  first_source:
    citation: 'Miltner WHR, Braun CH, Coles MGH. Event-Related Brain Potentials Following Incorrect Feedback in a Time-Estimation
      Task: Evidence for a "Generic" Neural System for Error Detection. Journal of Cognitive Neuroscience. 1997;9(6):788-798.'
    doi: 10.1162/jocn.1997.9.6.788
    year: 1997
    verified: false
  aliases:
