- id: EMO-IAPS
  name:
    en: Affective picture viewing
    zh: 情绪图片观看
  family: emotion
  description:
    en: Pleasant, unpleasant and neutral pictures, typically from the International Affective Picture System, are viewed for
      a few seconds each, often followed by valence and arousal ratings. Arousing pictures elicit a larger early posterior
      negativity and late positive potential in EEG and increase amygdala BOLD.
    zh: 被试观看愉快、不愉快和中性图片（通常取自国际情绪图片系统 IAPS），每张数秒，常随后进行效价与唤醒度评分。高唤醒图片在脑电中诱发更大的早期后部负波（EPN）与晚期正电位（LPP），并增强杏仁核 BOLD。
  markers:
