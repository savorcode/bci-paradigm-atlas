- id: CTL-CONF
  name:
    en: Decision confidence judgement (perceptual metacognition)
    zh: 决策信心判断（知觉元认知）
  family: control
  description:
    en: After each perceptual decision, participants rate their confidence that the decision was correct, on a scale ranging
      from certainly wrong to certainly correct. The amplitude of the post-response error positivity varies continuously with
      confidence, linking confidence judgements and error detection.
    zh: 每次知觉决策后，被试在从“肯定错误”到“肯定正确”的量表上评定对决策正确性的信心。反应后错误正波（Pe）的波幅随信心连续变化，把信心判断与错误检测联系起来。
  markers:
  - MK.Pe
  first_source:
    citation: Boldt A, Yeung N. Shared neural markers of decision confidence and error detection. Journal of Neuroscience
      35:3478-3484. 2015.
    doi: 10.1523/JNEUROSCI.0797-14.2015
    year: 2015
    verified: false
