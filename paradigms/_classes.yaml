- id: MOT-TRACK
  name:
    en: Continuous pursuit tracking
    zh: 连续轨迹追踪
  family: motor
  description:
    en: Participants continuously follow a moving visual target with a hand, cursor or robot arm, and the movement trajectory
      is reconstructed from brain activity. Low-frequency EEG amplitudes (below about 2 Hz) and intracranial high-gamma activity
      track hand position and velocity.
    zh: 被试用手、光标或机械臂连续跟随移动的视觉目标，并从脑活动中重建运动轨迹。低频脑电幅值（约 2 Hz 以下）与颅内高 γ 活动跟随手的位置和速度变化。
  markers:
  - MK.low_freq_kinematics
  - MK.high_gamma
  first_source:
    citation: Bradberry TJ, Gentili RJ, Contreras-Vidal JL. Decoding three-dimensional hand kinematics from electroencephalographic
      signals. Annual International Conference of the IEEE Engineering in Medicine and Biology Society. 2009;2009:5010-5013.
    doi: 10.1109/iembs.2009.5334606
    pmid: '19965033'
    year: 2009
    verified: false
  aliases:
  - pursuit tracking task
  - visuomotor tracking
