- id: PER-RET
  name:
    en: Retinotopic mapping
    zh: 视网膜拓扑映射
  family: perception
  description:
    en: Rotating wedges and expanding rings (phase-encoded design) or moving bars (population receptive field modelling) sweep
      across the visual field. The phase or pRF position of the visual cortex BOLD response at each voxel maps the visual
      field and delineates the borders of early visual areas.
    zh: 旋转楔形和扩张环（相位编码设计）或移动条（群体感受野建模）扫过视野。每个体素视皮层 BOLD 响应的相位或 pRF 位置标出其对应的视野位置，并划分早期视觉区的边界。
  markers:
  - MK.BOLD_visual_cortex
  first_source:
    citation: DeYoe EA, Carman GJ, Bandettini P, Glickman S, Wieser J, Cox R, Miller D, Neitz J. Mapping striate and extrastriate
