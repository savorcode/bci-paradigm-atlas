- id: MOT-BIMAN
  name:
    en: Bimanual coordination
    zh: 双手协调
  family: motor
  description:
    en: Participants move both hands rhythmically in in-phase (mirror-symmetric) or anti-phase patterns, often paced by a
      metronome whose rate is increased until anti-phase coordination becomes unstable. Coordination demands are reflected
      in sensorimotor rhythm modulation and in coherence between left and right sensorimotor cortices.
    zh: 被试以同相（镜像对称）或反相模式有节律地移动双手，通常由节拍器定速，并逐步加快直至反相协调失稳。协调需求反映在感觉运动节律的调制以及左右感觉运动皮层之间的相干上。
  markers:
  - MK.SMR_ERD
  - MK.interhemispheric_coherence
  first_source:
    citation: Kelso JA. Phase transitions and critical behavior in human bimanual coordination. American Journal of Physiology-Regulatory,
      Integrative and Comparative Physiology. 1984;246(6):R1000-R1004.
    doi: 10.1152/ajpregu.1984.246.6.r1000
    year: 1984
    verified: false
  aliases:
  - bimanual coordination
  - in-phase/anti-phase tapping
  - bimanual anti-phase movement
  notes: migrated from schema-0.1 file MOT-BIMAN-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-CURSOR
  name:
    en: Closed-loop cursor control
    zh: 闭环光标控制
  family: motor
  description:
    en: The participant moves an on-screen cursor towards visually presented targets in real time, with cursor movement driven
      by a decoder applied to ongoing brain activity. Control is typically based on volitional modulation of sensorimotor
      rhythms (EEG/ECoG) or on motor cortical spiking (intracortical arrays), with continuous visual feedback closing the
      loop.
    zh: 被试实时控制屏幕上的光标移向视觉呈现的目标，光标运动由作用于持续脑活动的解码器驱动。控制信号通常来自对感觉运动节律的自主调制（EEG/ECoG）或运动皮层神经元放电（皮层内阵列），连续的视觉反馈构成闭环。
  markers:
  - MK.SMR_ERD
  - MK.motor_cortical_spiking
  first_source:
    citation: Wolpaw JR, McFarland DJ, Neat GW, Forneris CA. An EEG-based brain-computer interface for cursor control. Electroencephalography
      and Clinical Neurophysiology. 1991;78(3):252-259.
    doi: 10.1016/0013-4694(91)90040-B
    pmid: '1707798'
    year: 1991
    verified: false
  aliases:
  - closed-loop BCI control
  - cursor control
  - radial-8 cursor task
  - 1D/2D cursor control
  - point-and-click typing
  notes: 'migrated from schema-0.1 file MOT-CURSOR-001; sprint 2 (D-057): aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
