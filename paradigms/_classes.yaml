- id: PER-IB
  name:
    en: Inattentional blindness
    zh: 非注意盲
  family: perception
  description:
    en: While participants perform a demanding task, task-irrelevant patterns appear that many participants do not notice,
      assessed with questionnaires after each phase. Comparing aware and unaware participants isolates a posterior visual
      awareness negativity, whereas the P3b appears mainly when the pattern becomes task-relevant.
    zh: 被试执行要求较高的任务时，出现与任务无关的图案，许多被试并未察觉，每个阶段后以问卷评估。比较察觉与未察觉的被试，可分离出后部视觉觉知负波（VAN），而 P3b 主要在图案变为任务相关时出现。
  markers:
  - MK.VAN
  - MK.P3b
  first_source:
    citation: 'Mack A, Rock I. Inattentional Blindness. Cambridge, MA: MIT Press. 1998.'
    doi: 10.7551/mitpress/3707.001.0001
