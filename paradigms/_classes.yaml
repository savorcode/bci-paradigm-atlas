- id: MOT-SACC
  name:
    en: Saccade task
    zh: 眼跳任务
  family: motor
  description:
    en: Participants fixate centrally and make rapid eye movements to peripheral targets, either immediately (visually guided)
      or after a delay to a remembered location (memory-guided). Cortical potentials precede saccade onset, and saccade generation
      activates the frontal and supplementary eye fields and intraparietal sulcus.
    zh: 被试注视中央，并向外周目标做快速眼动：或立即进行（视觉引导），或在延迟后指向记忆中的位置（记忆引导）。眼跳起始前出现皮层电位，眼跳生成激活额眼区、辅助眼区和顶内沟。
  markers:
  - MK.presaccadic_potential
  - MK.BOLD_oculomotor
  - MK.BOLD_frontoparietal
  first_source:
    citation: Javal, É. Essai sur la physiologie de la lecture. Annales d'oculistique. 1878.
    year: 1878
    verified: false
  aliases:
