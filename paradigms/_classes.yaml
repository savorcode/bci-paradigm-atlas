- id: CTL-ANAL
  name:
    en: Analogical reasoning
    zh: 类比推理
  family: control
  description:
    en: 'Participants judge whether two word pairs share the same relation (A:B :: C:D) compared with judging semantic association
      alone, so that relational integration can be separated from semantic retrieval. Analogical integration engages rostrolateral
      (frontopolar) prefrontal cortex, whereas retrieval engages anterior inferior frontal cortex.'
    zh: '被试判断两组词对是否具有相同关系（A:B :: C:D），并与只判断语义联想的条件比较，以区分关系整合与语义提取。类比整合激活前额叶喙外侧（额极）区，而语义提取激活前部额下回。'
  markers:
  - MK.BOLD_frontopolar
  first_source:
    citation: 'Bunge SA, Wendelken C, Badre D, Wagner AD. Analogical reasoning and prefrontal cortex: evidence for separable
      retrieval and integration mechanisms. Cerebral Cortex. 2005.'
