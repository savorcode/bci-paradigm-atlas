- id: MEM-DF
  name:
    en: Directed forgetting
    zh: 定向遗忘
  family: memory
  description:
    en: Participants study items and, after each item (item method) or after a list (list method), receive an instruction
      to remember or to forget it; memory for all items is later tested. Forget cues lead to poorer memory for the cued items,
      and the cue period is associated with changes in posterior alpha power and dorsolateral prefrontal activity that are
      interpreted as active suppression or withdrawal of rehearsal.
    zh: 被试学习项目，并在每个项目之后（项目法）或整个词表之后（词表法）收到“记住”或“忘记”的指令，随后测试对全部项目的记忆。接收“忘记”指令的项目记忆成绩较差；指令呈现期间后部 α 功率与背外侧前额叶活动发生变化，被解释为主动抑制或停止复述。
  markers:
  - MK.alpha_posterior
  - MK.BOLD_dlPFC
  first_source:
    citation: 'Bjork RA. Positive forgetting: The noninterference of Items intentionally forgotten. Journal of Verbal Learning
      and Verbal Behavior. 1970;9(3):255-268.'
    doi: 10.1016/s0022-5371(70)80059-7
    year: 1970
    verified: false
  aliases:
  - DF Task
  - Item-Method DF
  - List-Method DF
  - list-method directed forgetting
