- id: PER-LEP
  name:
    en: Laser-evoked potentials (nociception)
    zh: 激光诱发电位（痛觉）
  family: perception
  description:
    en: Brief radiant heat pulses from a CO2 or solid-state laser selectively activate skin nociceptors without touching the
      skin. They evoke a vertex N2-P2 complex, preceded by a lateralised N1, that is used to assess nociceptive pathways.
    zh: CO2 或固体激光发出的短暂辐射热脉冲在不接触皮肤的情况下选择性激活皮肤伤害感受器，诱发顶部 N2–P2 复合波，其前有偏侧化的 N1，用于评估伤害性感觉通路。
  markers:
  - MK.LEP
  first_source:
    citation: Bromm B, Treede RD. Laser-evoked cerebral potentials in the assessment of cutaneous pain sensitivity in normal
      subjects and patients. Rev Neurol (Paris). 1991;147(10):625-643.
