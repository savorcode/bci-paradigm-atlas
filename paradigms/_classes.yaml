- id: MOT-ATT
  name:
    en: Attempted movement
    zh: 尝试运动（瘫痪患者）
  family: motor
  description:
    en: Participants with paralysis are cued, visually or by spoken command, to try to perform a movement (e.g. of the foot,
      hand or arm) that they cannot overtly execute. The attempt produces sensorimotor rhythm ERD/ERS and low-frequency EEG
      changes over the corresponding motor area and modulates motor cortical spiking, which are decoded as control signals
      or used as evidence of command following.
    zh: 瘫痪被试在视觉提示或口头指令下，尝试完成其无法实际执行的动作（如足、手或上肢的动作）。尝试运动在相应运动区引起感觉运动节律 ERD/ERS 和低频脑电变化，并调制运动皮层神经元放电，这些信号被解码为控制信号，或作为指令跟随的证据。
  markers:
  - MK.SMR_ERD
  - MK.motor_cortical_spiking
  - MK.low_freq_kinematics
  first_source:
    citation: Müller-Putz GR, Zimmermann D, Graimann B, Nestinger K, Korisek G, Pfurtscheller G. Event-related beta EEG-changes
      during passive and attempted foot movements in paraplegic patients. Brain Research. 2007;1137(1):84-91.
    doi: 10.1016/j.brainres.2006.12.052
    pmid: '17229403'
    year: 2007
    verified: false
  aliases:
  - attempted movement
  - intended movement
  - movement attempt
  notes: 'migrated from schema-0.1 file MOT-ATT-001; sprint 2 (D-057): description, markers updated from curation/work/pkg_B/sprint2/class_updates.yaml
