- id: ERR-ADAPT
  name:
    en: Motor adaptation and reward-based motor learning
    zh: 运动适应与基于奖赏的运动学习
  family: error
  description:
    en: Participants make reaching or cursor movements and adapt them to cancel an imposed sensory error (e.g., a rotated
      cursor) or to obtain binary reward feedback. Feedback revealing sensory or reward prediction errors elicits feedback-locked
      ERPs such as error-related potentials, the FRN and a P300.
    zh: 被试做伸手或光标运动，并调整运动以抵消施加的感觉误差（如旋转的光标）或获得二值奖赏反馈。揭示感觉或奖赏预测误差的反馈诱发反馈锁时的事件相关电位，如错误相关电位、FRN 与 P300。
  markers:
  - MK.FRN
  - MK.ErrP
  - MK.P3b
  first_source:
    citation: Krakauer JW, Pine ZM, Ghilardi MF, Ghez C. Learning of Visuomotor Transformations for Vectorial Planning of
      Reaching Trajectories. The Journal of Neuroscience. 2000;20(23):8916-8924.
    doi: 10.1523/jneurosci.20-23-08916.2000
    year: 2000
    verified: false
  aliases:
  - Cursor rotation adaptation
  - Visuomotor adaptation task
  - Visuomotor rotation
  notes: 'migrated from schema-0.1 file ERR-ADAPT-001; sprint 2 (D-057): name, description, markers updated from curation/work/pkg_C/sprint2/class_updates.yaml
