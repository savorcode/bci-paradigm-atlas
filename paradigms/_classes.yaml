  - curator_c
  - curator_b
- id: ERR-BANDIT
  name:
    en: Multi-armed bandit
    zh: 多臂老虎机（探索-利用）
  family: error
  description:
    en: On each trial participants choose among several options (arms) whose reward payoffs drift or are uncertain, trading
      off exploitation of the best-known option against exploration of others. Outcome feedback elicits the FRN/reward positivity,
      and exploratory choices engage frontopolar cortex in fMRI.
    zh: 每个试次中，被试在若干个回报会漂移或不确定的选项（摇臂）之间选择，在利用已知最佳选项与探索其他选项之间权衡。结果反馈诱发 FRN/奖赏正波，fMRI 中探索性选择激活额极皮层。
  markers:
  - MK.FRN
  - MK.BOLD_frontopolar
  first_source:
    citation: Daw ND, O'Doherty JP, Dayan P, Seymour B, Dolan RJ. Cortical substrates for exploratory decisions in humans.
      Nature. 2006;441(7095):876-879.
    doi: 10.1038/nature04766
    pmid: '16778890'
    year: 2006
    verified: false
  aliases:
  - Bandit Task
  - Explore-exploit task
  - K-Armed Bandit
  - MAB
  - Restless bandit
  - Volatile bandit
  - n-armed bandit
  notes: migrated from schema-0.1 file ERR-BANDIT-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: ERR-CAUS
  name:
    en: Causal learning
    zh: 因果学习
  family: error
  description:
    en: Participants observe or produce sequences of cue and outcome events (e.g., foods and allergic reactions) and judge
      how strongly a cue causes the outcome, with the statistical contingency between them manipulated. In fMRI, prediction-error
      and contingency-related activity is reported in lateral prefrontal cortex.
    zh: 被试观察或自行产生线索与结果事件序列（如食物与过敏反应），并判断线索在多大程度上导致结果，二者之间的统计关联性被系统操纵。fMRI 研究报告外侧前额叶存在与预测误差和关联性相关的活动。
  markers:
  - MK.BOLD_dlPFC
  first_source:
    citation: 'Dickinson, A., Shanks, D., & Evenden, J. Judgement of act-outcome contingency: The role of selective attribution.
      Quarterly Journal of Experimental Psychology Section A, 36(1), 29-50. 1984.'
    doi: 10.1080/14640748408401502
    year: 1984
    verified: false
  aliases:
  - Allergy Prediction Task
  - Causal Induction Task
  - Causal Judgment Task
  - Contingency Judgment Task
  - Contingency Learning Task
  - Delta-P Task
  notes: migrated from schema-0.1 file ERR-CAUS-001 bibliography confirmed (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: ERR-CHGPT
  name:
    en: Predictive inference (change-point) task
    zh: 预测推断（变点）任务
  family: error
  description:
    en: On each trial participants predict where the next outcome will fall and then observe the outcome, whose generative
      distribution changes abruptly at unsignalled change points or, in an oddball variant of the statistics, produces occasional
      outliers, so that trial-wise learning rates can be measured. Surprising outcomes elicit a feedback-locked P300 whose
      relation to belief updating depends on the statistical context.
    zh: 每个试次被试预测下一个结果的位置并观察结果；结果的生成分布在无提示的变点处突变，或在 oddball 统计条件下偶尔产生离群值，从而可测量逐试次学习率。出乎意料的结果诱发反馈锁时的 P300，其与信念更新的关系取决于统计情境。
  markers:
  - MK.P3b
  first_source:
    citation: Nassar MR, Wilson RC, Heasly B, Gold JI. An Approximately Bayesian Delta-Rule Model Explains the Dynamics of
      Belief Updating in a Changing Environment. The Journal of Neuroscience. 2010;30(37):12366-12378.
    doi: 10.1523/JNEUROSCI.0822-10.2010
    pmid: '20844132'
    year: 2010
    verified: false
  aliases:
  - Helicopter task
  - Cannon task
  - Change-point task
  - Predictive inference task
  notes: 'migrated from schema-0.1 file ERR-CHGPT-001; sprint 2 (D-057): description updated from curation/work/pkg_C/sprint2/class_updates.yaml
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_c
  - curator_b
- id: ERR-ERRP
  name:
    en: Interaction error-related potentials
    zh: 交互式错误电位
  family: error
  description:
    en: While the user operates or supervises a device or BCI, the system occasionally executes an action other than the intended
      one. Such errors elicit a fronto-central error-related potential (ErrP) time-locked to the erroneous feedback, whether
      the error follows a discrete user command, occurs while monitoring an autonomous device, is a genuine BCI selection
      error or arises during continuous control; the ErrP can be detected on single trials and used to correct or adapt the
      system.
    zh: 用户操作或监督设备或脑机接口时，系统偶尔执行与意图不符的动作。无论错误发生在离散用户指令之后、监视自主运行设备时、来自真实的 BCI 选择错误，还是出现在连续控制中，都会在错误反馈之后诱发额中央的错误相关电位（ErrP）；它可在单试次上检测，用于纠正或自适应调整系统。
  markers:
  - MK.ErrP
  first_source:
    citation: Ferrez PW, Millán JdR. Error-Related EEG Potentials Generated during Simulated Brain-Computer Interaction. IEEE
      Transactions on Biomedical Engineering 55(3). 2008.
    year: 2008
    verified: false
  aliases:
  - Interaction ErrP
  - error-related potentials in BCI
  - iErrP
  - Monitoring ErrP
  - Continuous ErrP
  notes: 'migrated from schema-0.1 file ERR-ERRP-001; sprint 2 (D-057): description, aliases updated from curation/work/pkg_C/sprint2/class_updates.yaml'
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: ERR-GAM
  name:
    en: Gambling / reward feedback
    zh: 赌博与奖赏反馈
  family: error
  description:
    en: Participants receive monetary gain or loss feedback that is largely independent of performance, after a simple choice
      (e.g., between two options or doors) or without any choice (slot-machine outcomes). Loss feedback elicits a fronto-central
      feedback-related negativity relative to gain feedback (equivalently, gains elicit a reward positivity).
    zh: 被试在简单选择（如两个选项或两扇门之间）之后，或在不作任何选择的情况下（老虎机结果），获得与表现基本无关的金钱得失反馈。损失反馈相对收益反馈诱发额中央反馈相关负波（等价地，收益诱发奖赏正波）。
  markers:
  - MK.FRN
  first_source:
    citation: Gehring WJ, Willoughby AR. The medial frontal cortex and the rapid processing of monetary gains and losses.
      Science. 2002.
    pmid: '11910116'
    year: 2002
    verified: false
  aliases:
  - Doors task
  - FRN paradigm
  - Feedback Block
  - Performance Feedback
  - RewP paradigm
  - Reward feedback paradigm
  - Score Screen
  - Simple gambling task
  - Trial Feedback
  - Slot-machine task
  notes: 'migrated from schema-0.1 file ERR-GAM-001; sprint 2 (D-057): description, aliases updated from curation/work/pkg_C/sprint2/class_updates.yaml'
  status: draft
  contributors:
  - maintainer
  - curator_c
- id: ERR-INST
  name:
    en: Instrumental conditioning
    zh: 工具性条件化
  family: error
  description:
    en: Participants learn by trial and error which actions lead to rewarding (or avoid aversive) outcomes, so that action-outcome
      contingencies shape choice. Reward prediction errors during instrumental learning are reflected in striatal BOLD, and
      outcome feedback elicits the FRN in EEG.
    zh: 被试通过试错学习哪些动作会带来奖赏（或避免厌恶结果），由动作–结果关联塑造选择。工具性学习中的奖赏预测误差反映在纹状体 BOLD 信号中，EEG 中结果反馈诱发 FRN。
  markers:
  - MK.FRN
  - MK.BOLD_striatum_reward
  first_source:
    citation: O'Doherty J, Dayan P, Schultz J, Deichmann R, Friston K, Dolan RJ. Dissociable Roles of Ventral and Dorsal Striatum
      in Instrumental Conditioning. Science. 2004;304(5669):452-454.
