- id: PER-OLF
  name:
    en: Olfactory event-related potentials
    zh: 嗅觉诱发电位
  family: perception
  description:
    en: Odorants are delivered in brief pulses embedded in a constant warm, humidified air stream (olfactometer) so that no
      tactile or thermal change accompanies the odour. Odour onset evokes olfactory event-related potentials (N1, P2 and later
      positivity) with long latencies.
    zh: 通过嗅觉刺激仪将气味以短脉冲形式嵌入恒温加湿的持续气流中，使气味出现时不伴随触觉或温度变化。气味起始诱发潜伏期较长的嗅觉事件相关电位（N1、P2 及其后的正波）。
  markers:
  - MK.OERP
  first_source:
    citation: Kobal G, Hummel C. Cerebral chemosensory evoked potentials elicited by chemical stimulation of the human olfactory
      and respiratory nasal mucosa. Electroencephalogr Clin Neurophysiol. 1988;71(4):241-250.
