- id: STA-NF
  name:
    en: Neurofeedback training
    zh: 神经反馈训练
  family: state
  description:
    en: A brain signal is extracted in real time and fed back to the participant as a visual or auditory display, and over
      sessions or blocks the participant learns to change it in a target direction. Trained signals include EEG band power
      such as sensorimotor rhythm and posterior alpha, and the haemodynamic signal of a target region in real-time fMRI or
      fNIRS.
    zh: 实时提取某种脑信号，并以视觉或听觉形式反馈给被试；经过多次训练或多个组块，被试学会使其朝目标方向变化。被训练的信号包括脑电频段功率（如感觉运动节律、后部 α），以及实时 fMRI 或 fNIRS 中目标脑区的血流动力学信号。
  markers:
  - MK.SMR_ERD
  - MK.alpha_posterior
  - MK.BOLD_amygdala
  first_source:
    citation: Sterman MB, Friar L. Suppression of seizures in an epileptic following sensorimotor EEG feedback training. Electroencephalography
      and Clinical Neurophysiology. 1972;33(1):89-95.
    doi: 10.1016/0013-4694(72)90028-4
    year: 1972
    verified: false
