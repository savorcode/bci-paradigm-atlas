- id: SSR-IM
  name:
    en: Intermodulation frequency tagging
    zh: 互调频率标记
  family: steady_state
  description:
    en: Two parts of a stimulus (for example the two halves of a face) flicker at different frequencies f1 and f2. Responses
      at intermodulation frequencies (such as f1+f2) can only arise from neural populations that integrate both inputs, and
      therefore index integration of the parts.
    zh: 刺激的两部分（如面孔左右两半）分别以不同频率 f1、f2 闪烁。互调频率（如 f1+f2）处的响应只能来自同时整合两路输入的神经群体，因此反映对各部分的整合。
  markers:
  - MK.intermodulation
  first_source:
    citation: Boremanse A, Norcia AM, Rossion B. Dissociation of part-based and integrated neural responses to faces by means
      of electroencephalographic frequency tagging. European Journal of Neuroscience. 2014.
    doi: 10.1111/ejn.12663
    year: 2014
    verified: false
  aliases:
  - intermodulation
  - IM frequency tagging
  - part-whole frequency tagging
  notes: migrated from schema-0.1 file SSR-IM-001 [curator_e sprint 3, 2026-10-05] bibliography confirmed (Crossref, 2026-10-05).
  status: draft
