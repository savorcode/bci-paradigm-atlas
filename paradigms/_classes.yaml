  - curator_b
- id: MOT-SMS
  name:
    en: Sensorimotor synchronization (metronome tapping)
    zh: 感觉运动同步（节拍器敲击）
  family: motor
  description:
    en: Participants tap a finger in time with an auditory metronome, either on the beat (synchronization) or between beats
      (syncopation), sometimes continuing after the metronome stops. Timing demands modulate sensorimotor beta activity and
      engage the motor network, including premotor cortex, SMA and cerebellum.
    zh: 被试跟随听觉节拍器用手指敲击，或敲在拍上（同步），或敲在拍间（切分），有时在节拍器停止后继续敲击。计时需求调制感觉运动 β 活动，并调用包括前运动皮层、辅助运动区和小脑在内的运动网络。
  markers:
  - MK.SMR_ERD
  - MK.BOLD_motor_network
  first_source:
    citation: 'Mayville JM. Neural correlates of human sensorimotor coordination: EEG, MEG, and functional MRI. Florida Atlantic
      University (dissertation). 2000.'
    year: 2000
    verified: false
  aliases:
  - sensorimotor synchronization
