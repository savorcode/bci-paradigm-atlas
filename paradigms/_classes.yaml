- id: MEM-SME
  name:
    en: Subsequent memory paradigm
    zh: 后续记忆效应
  family: memory
  description:
    en: Neural activity recorded while items are encoded is sorted according to whether each item is later remembered or forgotten
      in a subsequent memory test. Later-remembered items show more positive ERPs during encoding (difference due to memory,
      Dm) and greater encoding-related BOLD activity in the hippocampus and medial temporal lobe.
    zh: 记录项目编码时的神经活动，并按每个项目在随后记忆测试中被记住还是被遗忘进行分类。后来被记住的项目在编码时诱发更正的 ERP（记忆差异效应，Dm），并在海马和内侧颞叶表现出更强的编码相关 BOLD 活动。
