- id: CTL-MRP
  name:
    en: Masked response priming
    zh: 掩蔽反应启动
  family: control
  description:
    en: A briefly presented, masked prime (e.g., a left- or right-pointing arrow) precedes a visible target that requires
      a left or right response, with prime and target compatible or incompatible. The lateralised readiness potential shows
      partial activation of the prime-assigned response followed, at longer prime-target intervals, by a reversal (negative
      compatibility effect).
    zh: 短暂呈现并被掩蔽的启动刺激（如向左或向右的箭头）先于需要左/右反应的可见目标出现，启动与目标相容或不相容。偏侧化准备电位显示启动刺激所对应的反应先被部分激活，在较长的启动–目标间隔下随后出现反转（负相容效应）。
  markers:
  - MK.LRP
  first_source:
    citation: 'Eimer M, Schlaghecken F. Effects of masked stimuli on motor activation: behavioral and electrophysiological
      evidence. Journal of Experimental Psychology: Human Perception and Performance 24(6):1737-1747. 1998.'
    year: 1998
    verified: false
  aliases:
  - Masked priming
  - Negative compatibility effect paradigm
  - Subliminal response priming
  notes: migrated from schema-0.1 file CTL-MRP-001
  status: draft
  contributors:
  - maintainer
- id: CTL-MSIT
  name:
    en: Multi-source interference task (MSIT)
    zh: 多源干扰任务
  family: control
  description:
    en: Participants see three digits and report the identity of the one that differs from the other two; on interference
      trials the target's identity conflicts with its position and flanking digits are possible responses, combining Stroop-,
      flanker- and Simon-type interference. Interference trials reliably increase dorsal anterior cingulate BOLD activity
      in individual subjects.
    zh: 被试看到三个数字，报告与另两个不同的那个数字；干扰试次中目标数字的身份与其位置冲突，且两侧数字本身也是可选反应，从而合并了 Stroop、Flanker 与 Simon 型干扰。干扰试次在个体被试中稳定地增加背侧前扣带 BOLD
      活动。
  markers:
  - MK.BOLD_dACC
  first_source:
    citation: 'Bush G, Shin LM, Holmes J, Rosen BR, Vogt BA. The Multi-Source Interference Task: validation study with fMRI
      in individual subjects. Molecular Psychiatry. 2003;8(1):60-70.'
    doi: 10.1038/sj.mp.4001217
    pmid: '12556909'
    year: 2003
    verified: false
  aliases:
