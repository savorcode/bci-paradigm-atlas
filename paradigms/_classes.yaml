  - curator_a
- id: STM-PHTMS
  name:
    en: EEG phase-triggered TMS
    zh: 脑电相位触发 TMS
  family: stimulation
  description:
    en: Ongoing EEG is analysed in real time and TMS pulses are triggered at a predefined phase of a target oscillation, typically
      the sensorimotor mu rhythm (e.g. negative peak vs positive peak), compared with random-phase stimulation. Excitability
      and plasticity effects depend on the phase of the mu rhythm at which pulses are delivered.
    zh: 实时分析进行中的脑电，在目标节律（通常为感觉运动 mu 节律）的预设相位（如负峰与正峰）触发 TMS 脉冲，并与随机相位刺激比较。兴奋性与可塑性效应取决于脉冲施加时 mu 节律的相位。
  markers:
  - MK.SMR_ERD
  first_source:
    citation: Zrenner C, Desideri D, Belardinelli P, Ziemann U. Real-time EEG-defined excitability states determine efficacy
      of TMS-induced plasticity in human motor cortex. Brain Stimulation 11(2):374-389. 2018.
    doi: 10.1016/j.brs.2017.11.016
    year: 2018
    verified: false
  aliases:
  - brain-state-dependent TMS
  - real-time EEG-triggered TMS
  - mu-phase-triggered TMS
  - closed-loop TMS
