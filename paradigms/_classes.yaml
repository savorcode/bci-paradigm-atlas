- id: SOC-CYB
  name:
    en: Cyberball social exclusion
    zh: 网络传球社会排斥（Cyberball）
  family: social
  description:
    en: Participants play a virtual ball-tossing game with ostensible co-players who first include them and then stop passing
      the ball to them. Exclusion is associated with dorsal anterior cingulate BOLD, and ball-receipt events in EEG elicit
      P3b differences between inclusion and exclusion.
    zh: 被试与名义上的其他玩家进行虚拟传球游戏，其他玩家先接纳被试，随后不再把球传给被试。排斥阶段伴随背侧前扣带 BOLD 变化；在脑电中，接球事件诱发的 P3b 在接纳与排斥条件间不同。
