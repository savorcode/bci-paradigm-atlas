- id: SOC-GAZE
  name:
    en: Gaze cueing and joint attention
    zh: 目光线索与共同注意
  family: social
  description:
    en: A central face shifts its gaze to one side before a peripheral target appears; targets at the gazed-at location are
      detected faster even when gaze is non-predictive. Interactive versions let the participant follow or initiate joint
      attention with a partner. Gaze cues modulate the face-evoked N170 and target-evoked P1 and engage the pSTS.
    zh: 中央面孔先将视线转向一侧，随后外周出现靶刺激；即使视线不具预测性，出现在注视方向的靶刺激也被更快检测。交互版本让被试与同伴跟随或发起共同注意。目光线索调制面孔诱发的 N170 与靶刺激诱发的 P1，并激活后颞上沟。
