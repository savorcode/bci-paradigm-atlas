- id: MEM-DMS
  name:
    en: Delayed match-to-sample
    zh: 延迟匹配
  family: memory
  description:
    en: A sample stimulus is presented, followed by a blank delay and then a probe; participants indicate whether the probe
      matches the sample (or, in the non-match version, select the non-matching item). The delay isolates maintenance, and
      human EEG/MEG studies report delay-period modulation of posterior alpha and increases of scalp gamma power that depend
      on the memorized content.
    zh: 先呈现样本刺激，经过空白延迟期后呈现探测刺激，被试判断探测刺激与样本是否相同（非匹配版本中选择与样本不同的项目）。延迟期把保持过程单独分离出来；人类 EEG/MEG 研究报告了延迟期后部 α 的调制以及随记忆内容变化的头皮 γ
      功率增强。
  markers:
  - MK.alpha_posterior
  - MK.gamma_power
  first_source:
    citation: Fuster JM, Alexander GE. Neuron Activity Related to Short-Term Memory. Science. 1971;173(3997):652-654.
    doi: 10.1126/science.173.3997.652
    pmid: '4998337'
    year: 1971
    verified: false
  aliases:
