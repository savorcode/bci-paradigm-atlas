  - curator_c
- id: MEM-FR
  name:
    en: Free recall / list learning
    zh: 自由回忆与词表学习
  family: memory
  description:
    en: Participants study a list of words presented one at a time and, after a delay or distractor task, recall as many words
      as possible in any order; list learning versions repeat study-test cycles. Encoding-period activity that differs between
      later-recalled and later-forgotten words (the subsequent memory effect, Dm) and intracranial high-gamma power increases
      during successful encoding and retrieval are the main neural measures.
    zh: 被试逐个学习词表中的词，经过延迟或干扰任务后，以任意顺序尽可能多地回忆；词表学习版本会重复多轮学习—测试。主要神经指标是编码阶段后来被回忆与被遗忘的词之间的差异（后续记忆效应，Dm），以及成功编码和提取时颅内高 γ 功率的增强。
  markers:
  - MK.Dm
  - MK.high_gamma
  first_source:
