- id: ERR-OGNG
  name:
    en: Orthogonalized Go/NoGo learning task
    zh: 正交化 Go/NoGo 学习任务
  family: error
  description:
    en: Four cues are learned by feedback, each requiring either a response (Go) or withholding (NoGo) to obtain a reward
      or avoid a punishment, so that action and outcome valence are orthogonal and Pavlovian biases (Go for reward, NoGo for
      punishment) can be measured. Overcoming the Pavlovian bias is associated with increased cue-locked midfrontal theta
      power.
    zh: 被试依据反馈学习四种线索，每种线索要求以反应（Go）或不反应（NoGo）来获得奖赏或避免惩罚，使动作与结果效价相互正交，从而可以测量巴甫洛夫偏向（为奖赏而 Go、为避罚而 NoGo）。克服巴甫洛夫偏向与线索锁时的额中线 θ 功率升高相关。
  markers:
  - MK.frontal_midline_theta
  first_source:
    citation: 'Go and no-go learning in reward and punishment: Interactions between affect and effect.'
    verified: false
  aliases:
  - Go/NoGo learning task
  - Pavlovian bias task
  - Go-to-win / NoGo-to-avoid task
