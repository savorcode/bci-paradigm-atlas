- id: MOT-MIRR
  name:
    en: Mirror tracing
    zh: 镜像描摹
  family: motor
  description:
    en: Participants trace a figure (e.g. a star) while seeing their hand only in a mirror, so that visual feedback is reversed,
      and improve over repeated trials. Visuomotor skill acquisition is accompanied by changes in motor network BOLD, including
      premotor, parietal and cerebellar regions.
    zh: 被试只能通过镜子看到自己的手，在视觉反馈左右或上下颠倒的条件下描摹图形（如星形），并随练习逐渐改善。视觉运动技能习得伴随运动网络 BOLD 的变化，涉及前运动区、顶叶和小脑。
  markers:
  - MK.BOLD_motor_network
  first_source:
    citation: Gabrieli, J. D. E., Corkin, S., Mickel, S. F., & Growdon, J. H. Intact acquisition and long-term retention of
      mirror-tracing skill in Alzheimer's disease and in global amnesia. Behavioral Neuroscience, 107(6), 899–910. 1993.
    doi: 10.1037/0735-7044.107.6.899
    pmid: '8136066'
    year: 1993
    verified: false
  aliases:
  - MTT
  - Mirror Drawing
  - Mirror Tracing
  notes: migrated from schema-0.1 file MOT-MIRR-001 bibliography confirmed (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-MRCP
  name:
    en: Movement-related cortical potential (voluntary movement preparation)
    zh: 运动相关皮层电位（自主运动准备）
  family: motor
  description:
    en: Participants perform or imagine brief voluntary movements (e.g. finger flexion or ankle dorsiflexion), either at self-chosen
      times or on an external cue, and EEG is averaged to movement or cue onset or analysed in single trials. A slowly rising
      negativity (Bereitschaftspotential / MRCP) precedes the movement; its online detection is used in movement-intention
      BCIs, including ones that trigger peripheral stimulation.
    zh: 被试在自选时刻或按外部提示完成或想象短暂的自主动作（如手指屈曲或踝背屈），以动作或提示起始为零点平均脑电，或做单试次分析。动作前出现缓慢上升的负电位（准备电位/MRCP）；对其在线检测用于运动意图脑机接口，包括触发外周刺激的系统。
  markers:
  - MK.MRCP
  first_source:
    citation: 'Kornhuber HH, Deecke L. Hirnpotentialänderungen bei Willkürbewegungen und passiven Bewegungen des Menschen:
      Bereitschaftspotential und reafferente Potentiale. Pflügers Archiv für die gesamte Physiologie des Menschen und der
      Tiere. 1965;284(1):1-17.'
    doi: 10.1007/bf00412364
    year: 1965
    verified: false
  aliases:
  - MRCP
  - movement-related cortical potential
  - Bereitschaftspotential
  - BP
  - readiness potential
  - associative BCI
  notes: 'migrated from schema-0.1 file MOT-MRCP-001; sprint 2 (D-057): name, description, aliases updated from curation/work/pkg_B/sprint2/class_updates.yaml
    bibliography corrected (OpenAlex, 2026-10-05)'
  status: draft
  contributors:
  - maintainer
  - curator_b
  - curator_a
- id: MOT-MSL
  name:
    en: Motor sequence learning (finger sequence)
    zh: 运动序列学习（手指序列）
  family: motor
  description:
    en: Participants repeatedly practise an explicitly known sequence of finger movements (e.g. a finger-to-thumb opposition
      or key-press sequence) and are tested for speed and accuracy across sessions, often including post-sleep retests. Learning-related
      changes appear in motor network BOLD (M1, SMA, premotor cortex, striatum, cerebellum) and in sensorimotor beta modulation.
    zh: 被试反复练习一个外显已知的手指动作序列（如拇指对指或按键序列），并在多个时段（常包括睡眠后复测）测量速度与准确性。学习相关变化表现为运动网络（M1、SMA、前运动皮层、纹状体、小脑）BOLD 的改变以及感觉运动 β 调制。
  markers:
  - MK.SMR_ERD
  - MK.BOLD_motor_network
  first_source:
    citation: 'Karni A, Meyer G, Rey-Hipolito C, Jezzard P, Adams MM, Turner R, Ungerleider LG. The acquisition of skilled
      motor performance: fast and slow experience-driven changes in primary motor cortex. Proceedings of the National Academy
      of Sciences. 1998;95(3):861-868.'
    doi: 10.1073/pnas.95.3.861
    pmid: '9448252'
    year: 1998
    verified: false
  aliases:
  - Finger Sequence Task
  - Sequence Learning
  - finger opposition sequence
  - explicit motor sequence learning
  notes: migrated from schema-0.1 file MOT-MSL-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-MVF
  name:
    en: Mirror visual feedback
    zh: 镜像视觉反馈
  family: motor
  description:
    en: Participants move one hand while viewing its mirror reflection (or a digitally mirrored video) in the position of
      the other, hidden hand, creating the illusion that the hidden hand moves. Mirror feedback modulates mu and beta ERD
      over the sensorimotor cortex ipsilateral to the moving hand, which is used in post-stroke rehabilitation studies.
    zh: 被试移动一只手，同时在另一只被遮挡的手的位置看到该手的镜像（或数字镜像视频），产生被遮挡的手在运动的错觉。镜像反馈调制运动手同侧感觉运动皮层上的 mu 与 β ERD，相关研究用于卒中后康复。
  markers:
  - MK.SMR_ERD
  first_source:
    citation: Chang C-S, Lo Y-Y, Chen C-L, Lee H-M, Chiang W-C, Li P-C. Alternative motor task-based pattern training with
      a digital mirror therapy system enhances sensorimotor signal rhythms post-stroke. Frontiers in Neurology 10:1227. 2019.
    doi: 10.3389/fneur.2019.01227
    year: 2019
    verified: false
  aliases:
  - mirror therapy
  - mirror visual feedback
  - mirror box illusion
  - MVF
  notes: migrated from schema-0.1 file MOT-MVF-001 bibliography confirmed (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: MOT-OBS
  name:
    en: Action observation
    zh: 动作观察
  family: motor
  description:
    en: Participants watch videos or live demonstrations of actions (typically hand movements) without moving, compared with
      static or non-biological control stimuli. Observation suppresses mu/beta rhythms over sensorimotor cortex and activates
      premotor and parietal regions of the action observation network.
    zh: 被试在不运动的情况下观看动作视频或现场示范（通常为手部动作），并与静态或非生物运动对照刺激比较。动作观察使感觉运动皮层上的 mu/β 节律受抑制，并激活动作观察网络中的前运动区与顶叶区域。
  markers:
  - MK.SMR_ERD
  - MK.BOLD_premotor_parietal
  first_source:
    citation: 'Fadiga L, Fogassi L, Pavesi G, Rizzolatti G. Motor facilitation during action observation: a magnetic stimulation
      study. Journal of Neurophysiology. 1995;73(6):2608-2611.'
    doi: 10.1152/jn.1995.73.6.2608
    pmid: '7666169'
    year: 1995
    verified: false
  aliases:
