- id: CTL-ANT
  name:
    en: Attention Network Test (ANT)
    zh: 注意网络测试
  family: control
  description:
    en: A cued flanker task in which warning and spatial cues precede an arrow flanked by congruent or incongruent arrows,
      yielding separate reaction-time measures of alerting, orienting and executive control. Cues elicit visual N1 and contingent
      negative variation, and targets elicit a P3.
    zh: 一种带提示的 Flanker 任务：警示提示与空间提示先于被一致或不一致箭头包围的目标箭头出现，从而分别得到警觉、定向和执行控制的反应时指标。提示诱发视觉 N1 与关联性负变，目标诱发 P3。
  markers:
  - MK.N1_visual
  - MK.P3b
  - MK.CNV
  first_source:
