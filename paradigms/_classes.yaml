- id: MOT-RT
  name:
    en: Simple / choice reaction time
    zh: 简单/选择反应时
  family: motor
  description:
    en: Participants respond as quickly as possible to a stimulus with a single response (simple RT) or select between left-
      and right-hand responses according to stimulus identity (choice RT). The lateralized readiness potential, the contralateral-minus-ipsilateral
      difference over motor cortex, indexes the timing and direction of response preparation.
    zh: 被试对刺激尽快作出单一反应（简单反应时），或依据刺激身份在左右手反应之间选择（选择反应时）。偏侧化准备电位（运动皮层上对侧减同侧的差异波）反映反应准备的时间进程与方向。
  markers:
  - MK.LRP
  first_source:
    citation: 'Gratton G, Coles MGH, Sirevaag EJ, Eriksen CW, Donchin E. Pre- and post-stimulus activation of response channels:
