- id: LAN-P600
  name:
    en: Syntactic violation
    zh: 句法违例
  family: language
  description:
    en: Sentences are presented word by word and contain syntactic violations, such as agreement or phrase-structure errors,
      or temporarily ambiguous garden-path structures, compared with well-formed control sentences. Syntactic violations elicit
      a late centro-parietal positivity (P600), and morphosyntactic violations are in some studies preceded by a left anterior
      negativity.
    zh: 逐词呈现含有句法违例（如一致性错误、短语结构错误）或暂时歧义的花园路径结构的句子，并与合乎语法的对照句比较。句法违例诱发晚期中央—顶区正波（P600）；在部分研究中，形态句法违例之前还出现左前负波。
  markers:
  - MK.P600
  - MK.left_anterior_negativity
  first_source:
    citation: Hagoort P, Brown C, Groothusen J. The syntactic positive shift (SPS) as an ERP measure of syntactic processing.
      Language and Cognitive Processes. 1993;8(4):439-483.
    doi: 10.1080/01690969308407585
    year: 1993
    verified: false
  aliases:
  - agreement violation
  - garden-path sentences
  - syntactic anomaly
  - syntactic positive shift (SPS)
  - garden-path P600
  - temporary syntactic ambiguity
