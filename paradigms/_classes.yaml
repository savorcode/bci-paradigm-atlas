- id: MEM-SRE
  name:
    en: Self-referential encoding
    zh: 自我参照编码
  family: memory
  description:
    en: Participants judge trait adjectives under different encoding instructions, for example whether the word describes
      themselves, describes another person, or has a particular structural property, and are later given a surprise memory
      test. Self-referential judgments produce better memory and engage medial prefrontal cortex more than other-referential
      or semantic judgments.
    zh: 被试在不同编码指令下判断人格形容词，例如该词是否描述自己、是否描述他人或是否具有某种字形特征，随后进行意外记忆测试。与他人参照或语义判断相比，自我参照判断带来更好的记忆，并更强地激活内侧前额叶。
  markers:
