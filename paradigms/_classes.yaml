  family: emotion
  description:
    en: Cues or contexts signal periods in which an aversive electric shock may be delivered predictably, unpredictably or
      not at all, and shocks are rarely or never actually given. Phasic and sustained threat produce distinct BOLD responses,
      including amygdala and anterior insula activation.
    zh: 线索或情境提示在某段时间内可能以可预测、不可预测的方式施加厌恶性电击或不会施加，实际电击很少或从不施加。短时与持续威胁产生不同的 BOLD 响应，包括杏仁核与前岛叶激活。
