- id: CTL-SART
  name:
    en: Sustained attention to response task
    zh: 持续注意反应任务（SART）
  family: control
  description:
    en: Digits are presented at a fixed rapid rate and participants respond to every digit except a rare target (e.g., 3),
      so that withholding requires sustained attention to an otherwise automatic response. Withheld targets elicit a NoGo-P3,
      and pre-stimulus posterior alpha power relates to attentional lapses.
    zh: 数字以固定的快速节奏呈现，被试对除罕见目标（如 3）以外的每个数字都要反应，因此抑制反应依赖于对原本自动化反应的持续注意。成功抑制的目标诱发 NoGo-P3，刺激前后部 α 功率与注意失误相关。
  markers:
  - MK.NoGo_P3
  - MK.alpha_posterior
  first_source:
    citation: 'Robertson IH, Manly T, Andrade J, Baddeley BT, Yiend J. ''Oops!'': Performance correlates of everyday attentional
      failures in traumatic brain injured and normal subjects. Neuropsychologia. 1997;35(6):747-758.'
    doi: 10.1016/s0028-3932(97)00015-8
    pmid: '9204482'
    year: 1997
    verified: false
  aliases:
  - SART
  - Sustained Attention to Response
  notes: migrated from schema-0.1 file CTL-SART-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: CTL-SIM
  name:
    en: Simon task
    zh: Simon 任务
  family: control
  description:
    en: Participants respond to a non-spatial stimulus feature (e.g., colour or pitch) with a left or right key, while the
      task-irrelevant stimulus location corresponds or does not correspond to the response side. Non-corresponding trials
      elicit a fronto-central N2 and an initial lateralised readiness potential towards the incorrect hand.
    zh: 被试以左键或右键对刺激的非空间特征（如颜色或音高）作出反应，而与任务无关的刺激位置与反应侧相对应或不对应。不对应试次诱发额中央 N2，以及最初偏向错误手的偏侧化准备电位（LRP）。
  markers:
  - MK.N2_frontocentral
  - MK.LRP
  first_source:
    citation: 'Simon JR, Rudell AP. Auditory S-R compatibility: The effect of an irrelevant cue on information processing.
      Journal of Applied Psychology. 1967;51(3):300-304.'
    doi: 10.1037/h0020586
    pmid: '6045637'
    year: 1967
    verified: false
  aliases:
  - Simon Effect Task
  - Simon effect
  - Spatial Compatibility
  - Spatial S-R compatibility task
  notes: migrated from schema-0.1 file CTL-SIM-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: CTL-SST
  name:
    en: Stop-signal task
    zh: 停止信号任务
  family: control
  description:
    en: Participants respond to a go stimulus, and on a minority of trials a stop signal follows after a variable delay, instructing
      them to cancel the response already initiated; stop-signal reaction time is estimated from a race model. Successful
      stopping elicits a fronto-central stop-P3 and is accompanied by right inferior frontal beta-band activity.
    zh: 被试对 Go 刺激反应；在少数试次中，Go 刺激之后以可变延迟出现停止信号，要求被试取消已启动的反应，并依据竞赛模型估计停止信号反应时。成功停止诱发额中央的停止 P3，并伴随右额下回 β 频段活动。
  markers:
  - MK.NoGo_P3
  - MK.rIFG_beta
  first_source:
    citation: 'Logan GD, Cowan WB. On the ability to inhibit thought and action: A theory of an act of control. Psychological
      Review. 1984;91(3):295-327.'
    doi: 10.1037/0033-295x.91.3.295
    year: 1984
    verified: false
  aliases:
  - Countermanding task
  - SST
  - Stop Signal
  - Stop Task
  - Stop-Signal
  - Stop-signal paradigm
  notes: migrated from schema-0.1 file CTL-SST-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: CTL-STR
  name:
    en: Stroop task
    zh: Stroop 任务
  family: control
  description:
    en: Participants name the ink colour of colour words that are congruent or incongruent with the word meaning, and incongruent
      items slow responses. Incongruent trials elicit a fronto-central negativity peaking around 450 ms (N450).
    zh: 被试说出颜色词的墨水颜色，词义与墨水颜色一致或不一致，不一致项会减慢反应。不一致试次诱发约在 450 ms 达峰的额中央负波（N450）。
  markers:
  - MK.N450
  first_source:
    citation: Stroop JR. Studies of interference in serial verbal reactions. Journal of Experimental Psychology. 1935;18(6):643-662.
    doi: 10.1037/h0054651
    year: 1935
    verified: false
  aliases:
  - CWIT
  - Color-Word Interference Test
  - Color-word interference task
  - Stroop
  - Stroop color-word task
  - Manual Stroop
  - Single-trial Stroop
  notes: 'migrated from schema-0.1 file CTL-STR-001; sprint 2 (D-057): aliases updated from curation/work/pkg_C/sprint2/class_updates.yaml
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
  contributors:
