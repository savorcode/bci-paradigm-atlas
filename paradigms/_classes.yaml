  - curator_c
- id: LAN-NAT
  name:
    en: Naturalistic speech listening
    zh: 自然语音聆听
  family: language
  description:
    en: Participants listen to continuous natural speech such as audiobooks, stories or podcasts, usually without a task other
      than comprehension. Neural activity follows the slow amplitude envelope of the speech, and this envelope tracking is
      estimated with temporal response functions or stimulus reconstruction.
    zh: 被试聆听有声书、故事或播客等连续自然语音，除理解外通常不执行其他任务。神经活动跟随语音的慢幅度包络，可用时间响应函数或刺激重建来估计这种包络跟踪。
  markers:
  - MK.speech_envelope_tracking
  first_source:
    citation: Luo H, Poeppel D. Phase Patterns of Neuronal Responses Reliably Discriminate Speech in Human Auditory Cortex.
      Neuron. 2007;54(6):1001-1010.
    doi: 10.1016/j.neuron.2007.06.004
    pmid: '17582338'
    year: 2007
    verified: false
  aliases:
