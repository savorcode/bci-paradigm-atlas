- id: MEM-CD
  name:
    en: Change detection
    zh: 变化检测
  family: memory
  description:
    en: A memory array of simple visual items is briefly shown, followed by a short retention interval and a test array in
      which one item may have changed; participants report whether a change occurred. In the lateralized version a cue directs
      memory to one hemifield, and the sustained negativity over posterior sites contralateral to the memorized items during
      the delay (contralateral delay activity, CDA) scales with the number of items held up to the individual capacity limit.
    zh: 短暂呈现由简单视觉项目组成的记忆阵列，经过短暂保持期后呈现测试阵列，其中可能有一个项目发生变化，被试报告是否发生变化。在偏侧化版本中，线索指示被试只记忆一侧视野的项目；保持期内记忆项目对侧后部电极的持续负波（对侧延迟活动，CDA）随所保持项目数增加而增大，直至个体容量上限。
  markers:
  - MK.CDA
  first_source:
    citation: Luck SJ, Vogel EK. The capacity of visual working memory for features and conjunctions. Nature. 1997;390(6657):279-281.
    doi: 10.1038/36846
    pmid: '9384378'
    year: 1997
    verified: false
