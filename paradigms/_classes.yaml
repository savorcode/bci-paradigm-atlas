- id: PER-TACT
  name:
    en: Tactile spatial attention
    zh: 触觉空间注意
  family: perception
  description:
    en: Tactile stimuli are delivered to the left and right hands (or several body sites) while participants attend to one
      location to detect infrequent targets. Stimuli at the attended location elicit an enhanced somatosensory N140, and attended
      targets additionally elicit a P3b.
    zh: 对左右手（或多个身体部位）给予触觉刺激，被试注意其中一个部位以检测低频靶刺激。被注意部位的刺激诱发增强的体感 N140，被注意的靶刺激还会诱发 P3b。
  markers:
