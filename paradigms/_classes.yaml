- id: ERR-APC
  name:
    en: Appetitive Pavlovian conditioning (reward prediction error)
    zh: 食欲性巴甫洛夫条件化（时间差分预测误差）
  family: error
  description:
    en: Visual conditioned stimuli are paired with delivery of a pleasant taste (e.g., juice), and occasional omissions or
      unexpected deliveries create reward prediction errors. Ventral striatal (and orbitofrontal) BOLD activity follows a
      temporal-difference prediction-error signal that shifts from reward delivery to cue onset with learning.
    zh: 视觉条件刺激与愉快味觉（如果汁）的给予配对，偶尔省略或意外给予奖赏以产生奖赏预测误差。腹侧纹状体（及眶额）BOLD 活动遵循时间差分预测误差信号，随着学习从奖赏给予时刻转移到线索出现时刻。
  markers:
  - MK.BOLD_striatum_reward
  first_source:
    citation: O'Doherty JP, Dayan P, Friston K, Critchley H, Dolan RJ. Temporal Difference Models and Reward-Related Learning
      in the Human Brain. Neuron. 2003;38(2):329-337.
    doi: 10.1016/s0896-6273(03)00169-7
    year: 2003
    verified: false
  aliases:
  - Appetitive classical conditioning
  - Reward conditioning
  - TD prediction-error paradigm
  notes: migrated from schema-0.1 file ERR-APC-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_b
- id: ERR-AWARE
  name:
    en: Error awareness
    zh: 错误觉知
  family: error
  description:
    en: Participants perform a speeded task and indicate, after each response or after errors they notice, whether they erred,
      so that errors can be sorted into aware (signalled) and unaware ones. The error positivity (Pe) and prefrontal-parietal
      activity are larger for aware than for unaware errors, whereas the earlier ERN differs less between them.
    zh: 被试完成快速任务，并在每次反应后或在察觉错误后报告是否出错，从而把错误分为觉察到的（被报告的）与未觉察的两类。错误正波（Pe）与前额–顶叶活动在觉察到的错误上更强，而更早出现的 ERN 在两类错误间差异较小。
  markers:
  - MK.Pe
  - MK.ERN
  - MK.BOLD_frontoparietal
  first_source:
    citation: 'Scheffers MK, Coles MGH. Performance monitoring in a confusing world: Error-related brain activity, judgments
      of response accuracy, and types of errors. Journal of Experimental Psychology: Human Perception and Performance. 2000;26(1):141-151.'
    doi: 10.1037/0096-1523.26.1.141
    pmid: '10696610'
    year: 2000
    verified: false
  aliases:
  - Aware vs unaware errors
  - Error Awareness Task (EAT)
  - Error awareness paradigm
  - Error signaling task
  notes: 'migrated from schema-0.1 file ERR-AWARE-001; sprint 2 (D-057): description, markers updated from curation/work/pkg_C/sprint2/class_updates.yaml
    bibliography corrected (Crossref, 2026-10-05)'
  status: draft
  contributors:
