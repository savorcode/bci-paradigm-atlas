  - curator_d
- id: STM-ADBS
  name:
    en: Adaptive (closed-loop) deep brain stimulation
    zh: 自适应（闭环）深部脑刺激
  family: stimulation
  description:
    en: In patients with DBS electrodes (typically in the subthalamic nucleus for Parkinson's disease), local field potentials
      are recorded from the stimulating lead and stimulation is switched on or adjusted when a biomarker, usually beta-band
      power, exceeds a threshold. The subthalamic beta signal serves both as the control variable and as the outcome measure.
    zh: 在植入 DBS 电极的患者（通常为帕金森病丘脑底核）中，从刺激电极记录局部场电位，当生物标记物（通常为 β 频段功率）超过阈值时开启或调整刺激。丘脑底核 β 信号既是控制变量，也是结果指标。
  markers:
  - MK.subthalamic_beta
  first_source:
    citation: Little S, Pogosyan A, Neal S, Zrinzo L, Hariz M, Foltynie T, Limousin P, Brown P. Controlling Parkinson's disease
      with adaptive deep brain stimulation. Journal of Visualized Experiments. 2014;(89):51403.
    doi: 10.3791/51403
    year: 2014
    verified: false
  aliases:
  - adaptive DBS
  - aDBS
  - closed-loop DBS
  - beta-triggered DBS
  notes: migrated from schema-0.1 file STM-ADBS-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-CCEP
  name:
    en: Cortico-cortical evoked potentials
    zh: 皮层-皮层诱发电位
  family: stimulation
  description:
    en: In patients with implanted subdural or depth electrodes, single electrical pulses are delivered repeatedly to a pair
      of contacts while responses are recorded from all other contacts. Averaged responses at distant sites (an early N1 and
      a later N2 deflection) reveal effective connectivity from the stimulated cortex.
    zh: 在植入硬膜下或深部电极的患者中，向一对触点反复施加单个电脉冲，同时在其余所有触点记录响应。远隔部位的平均响应（早期 N1 和较晚的 N2 波）揭示从受刺激皮层出发的有效连接。
  markers:
  - MK.CCEP
  first_source:
    citation: 'Matsumoto R, Nair DR, LaPresto E, Najm I, Bingaman W, Shibasaki H, Lüders HO. Functional connectivity in the
      human language system: a cortico-cortical evoked potential study. Brain. 2004;127(10):2316-2330.'
    doi: 10.1093/brain/awh246
    pmid: '15269116'
    year: 2004
    verified: false
  aliases:
  - CCEP
  - single pulse electrical stimulation
  - SPES
  notes: migrated from schema-0.1 file STM-CCEP-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-DBSEP
  name:
    en: DBS-evoked potentials
    zh: 深部脑刺激诱发电位
  family: stimulation
  description:
    en: Deep brain stimulation is delivered through an implanted electrode (e.g. in the subthalamic nucleus) in short bursts
      or single pulses while responses are recorded from non-stimulating contacts of the same lead and/or from scalp EEG.
      Stimulation evokes a high-frequency, decaying resonant local response (ERNA) and cortical evoked potentials whose features
      vary with electrode location.
    zh: 通过植入电极（如丘脑底核）以短串或单脉冲方式施加深部脑刺激，同时从同一电极的非刺激触点和/或头皮脑电记录响应。刺激诱发高频、逐渐衰减的局部共振响应（ERNA）以及皮层诱发电位，其特征随电极位置而变化。
  markers:
  - MK.ERNA
  - MK.DBS_cortical_EP
  first_source:
    citation: Sinclair NC, McDermott HJ, Bulluss KJ, Fallon JB, Perera T, Xu SS, Brown P, Thevathasan W. Subthalamic nucleus
      deep brain stimulation evokes resonant neural activity. Annals of Neurology. 2018;83(5):1027-1031.
    doi: 10.1002/ana.25234
    year: 2018
    verified: false
  aliases:
  - DBS-evoked potentials
  - evoked resonant neural activity
  - ERNA
  - DBS cortical evoked potentials
  notes: migrated from schema-0.1 file STM-DBSEP-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-GVS
  name:
    en: Galvanic vestibular stimulation
    zh: 直流电前庭刺激
  family: stimulation
  description:
    en: Weak electrical current is applied between electrodes over the mastoid processes, stimulating the vestibular nerve
      and producing sensations of tilt or self-motion, compared with sham or cutaneous control stimulation. Stimulation activates
      multisensory vestibular cortex (posterior insula/parieto-insular regions) and is accompanied by signal decreases in
      visual and somatosensory areas.
    zh: 在双侧乳突电极之间施加弱电流，刺激前庭神经并产生倾斜或自身运动的感觉，并与伪刺激或皮肤对照刺激比较。刺激激活多感觉前庭皮层（后岛叶/顶-岛区域），并伴随视觉与体感区域的信号下降。
  markers:
  - MK.BOLD_vestibular_cortex
  first_source:
    citation: Bense S, Stephan T, Yousry TA, Brandt T, Dieterich M. Multisensory cortical signal increases and decreases during
      vestibular galvanic stimulation (fMRI). Journal of Neurophysiology. 2001;85(2):886-899.
    doi: 10.1152/jn.2001.85.2.886
    pmid: '11160520'
    year: 2001
    verified: false
  aliases:
  - GVS
  - galvanic vestibular stimulation
  - vestibular electrical stimulation
  notes: migrated from schema-0.1 file STM-GVS-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-PAS
  name:
    en: Paired associative stimulation
    zh: 成对联合刺激
  family: stimulation
  description:
    en: Peripheral nerve stimulation (typically of the median nerve) is repeatedly paired with TMS of the contralateral motor
      cortex at a fixed interstimulus interval, so that the afferent volley and the cortical pulse coincide or are offset.
      The protocol induces timing-dependent changes in cortical excitability; with concurrent EEG, effects are assessed through
      TMS-evoked potentials and the median-nerve SEP N20 that times the pairing.
    zh: 将外周神经电刺激（通常为正中神经）与对侧运动皮层 TMS 以固定刺激间隔反复配对，使传入冲动与皮层脉冲同时到达或错开。该方案诱导依赖时序的皮层兴奋性改变；同步记录脑电时，通过 TMS 诱发电位以及决定配对时序的正中神经 SEP
      N20 评估其效应。
  markers:
  - MK.TEP
  - MK.SEP_N20
  first_source:
    citation: Stefan K, Kunesch E, Cohen LG, Benecke R, Classen J. Induction of plasticity in the human motor cortex by paired
      associative stimulation. Brain. 2000;123(3):572-584.
    doi: 10.1093/brain/123.3.572
    year: 2000
    verified: false
  aliases:
  - PAS
  - paired associative stimulation
  notes: migrated from schema-0.1 file STM-PAS-001 bibliography corrected (OpenAlex, 2026-10-05)
  status: draft
  contributors:
  - maintainer
  - curator_a
- id: STM-PBM
  name:
    en: Transcranial photobiomodulation with EEG
    zh: 经颅光生物调节同步脑电
  family: stimulation
  description:
    en: Near-infrared laser or LED light is applied to the scalp (typically over the forehead) in active and sham blocks while
      the EEG is recorded before, during and after stimulation. Changes in resting-state alpha and beta band power relative
      to sham are the main reported neural outcome.
    zh: 在真刺激与伪刺激组块中，将近红外激光或 LED 光施加于头皮（通常在前额），并在刺激前、刺激中和刺激后记录脑电。主要报告的神经结果是相对于伪刺激的静息态 α、β 频段功率变化。
  markers:
  - MK.alpha_posterior
  first_source:
    citation: Wang X, Dmochowski JP, Zeng L, Kallioniemi E, Husain M, Gonzalez-Lima F, Liu H. Transcranial photobiomodulation
      with 1064-nm laser modulates brain electroencephalogram rhythms. Neurophotonics. 2019;6(2):025013.
    doi: 10.1117/1.NPh.6.2.025013
    year: 2019
    verified: false
  aliases:
  - tPBM
  - transcranial photobiomodulation
  - transcranial near-infrared laser stimulation
  notes: migrated from schema-0.1 file STM-PBM-001 bibliography corrected (Crossref, 2026-10-05)
  status: draft
  contributors:
