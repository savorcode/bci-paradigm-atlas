- id: SOC-SFB
  name:
    en: Social evaluative feedback (social judgment paradigm)
    zh: 社会评价反馈（社会判断范式）
  family: social
  description:
    en: Participants are led to believe that peers have judged whether they like them, and receive acceptance or rejection
      feedback that is consistent or inconsistent with their expectations. Dorsal anterior cingulate BOLD tracks expectancy
      violation, whereas ventral anterior cingulate responds to the valence of the social feedback.
    zh: 被试被告知同伴已判断是否喜欢他们，并接收与其预期一致或不一致的接纳或拒绝反馈。背侧前扣带 BOLD 反映预期违背，腹侧前扣带则对社会反馈的效价作出反应。
