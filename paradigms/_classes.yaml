- id: PER-SPN
  name:
    en: Visual symmetry perception
    zh: 视觉对称知觉
  family: perception
  description:
    en: Symmetrical and random dot or polygon patterns are presented for about one second or longer. Symmetrical patterns
      produce a sustained posterior negativity relative to random patterns, starting at roughly 250 ms, whose amplitude scales
      with the proportion of symmetry.
    zh: 呈现对称与随机的点阵或多边形图案，持续约 1 秒或更长。相对于随机图案，对称图案在约 250 ms 起产生持续性后部负波（SPN），其波幅随对称程度增加而增大。
  markers:
