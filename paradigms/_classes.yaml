- id: SOC-CONF
  name:
    en: Social conformity
    zh: 社会从众
  family: social
  description:
    en: Participants rate items such as faces, are then shown a group rating that agrees or conflicts with theirs, and later
      re-rate the items. Conflict with the group elicits a prediction-error-like response, with increased posterior medial
      frontal (rostral cingulate) BOLD and decreased ventral striatal BOLD, which predicts later conformity.
    zh: 被试先对面孔等项目评分，随后看到与其一致或冲突的群体评分，之后再次评分。与群体意见冲突引发类似预测误差的反应：后内侧额叶（喙部扣带区）BOLD 增强、腹侧纹状体 BOLD 减弱，并可预测之后的从众。
  markers:
  - MK.BOLD_striatum_reward
  - MK.BOLD_dACC
  first_source:
    citation: Klucharev V, Hytönen K, Rijpkema M, Smidts A, Fernandez G. Reinforcement Learning Signal Predicts Social Conformity.
      Neuron 61(1):140-151. 2009.
    doi: 10.1016/j.neuron.2008.11.027
    pmid: '19146819'
