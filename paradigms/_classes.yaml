- id: ERR-PRT
  name:
    en: Probabilistic reward task
    zh: 概率奖赏任务（信号检测）
  family: error
  description:
    en: Participants categorise briefly presented stimuli that differ subtly (e.g., a short or long mouth on a cartoon face),
      and correct identifications of one stimulus are rewarded more often than the other, producing a response bias towards
      the richly rewarded category. Reward feedback elicits the FRN, whose amplitude relates to the development of response
      bias.
    zh: 被试对短暂呈现、差异细微的刺激（如卡通脸上较短或较长的嘴）进行分类，其中一类刺激的正确判断获得奖赏的频率高于另一类，从而形成偏向高奖赏类别的反应偏向。奖赏反馈诱发 FRN，其波幅与反应偏向的形成相关。
  markers:
  - MK.FRN
  first_source:
    citation: 'Pizzagalli DA, Jahn AL, O''Shea JP. Toward an objective characterization of an anhedonic phenotype: a signal-detection
      approach. Biological Psychiatry 57(3):319-327. 2005.'
    year: 2005
    verified: false
  aliases:
  - PRT
  - Pizzagalli reward task
  - Signal-detection reward task
  notes: migrated from schema-0.1 file ERR-PRT-001
  status: draft
  contributors:
  - maintainer
- id: ERR-PSEL
  name:
    en: Probabilistic selection task
    zh: 概率选择任务
  family: error
  description:
    en: In a training phase participants learn from probabilistic feedback to choose within fixed stimulus pairs that differ
      in reward probability; a subsequent test phase with novel pairings without feedback reveals whether they learned more
      from positive or from negative outcomes. Feedback during training elicits the FRN and frontal midline theta, which relate
      to subsequent behavioural adaptation.
    zh: 训练阶段，被试依据概率性反馈在奖赏概率不同的固定刺激对中学习选择；随后的测试阶段使用无反馈的新组合，检验被试更多地从正性还是负性结果中学习。训练阶段的反馈诱发 FRN 与额中线 θ，二者与随后的行为调整相关。
  markers:
  - MK.FRN
  - MK.frontal_midline_theta
  first_source:
    citation: 'Frank MJ, Seeberger LC, O''Reilly RC. By Carrot or by Stick: Cognitive Reinforcement Learning in Parkinsonism.
      Science. 2004;306(5703):1940-1943.'
    doi: 10.1126/science.1102941
    pmid: '15528409'
    year: 2004
    verified: false
  aliases:
