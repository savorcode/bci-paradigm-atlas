- id: SSR-BEAT
  name:
    en: Beat / rhythm entrainment
    zh: 节律与节拍跟随
  family: steady_state
  description:
    en: Participants listen to rhythmic sound patterns or music, sometimes while imagining a metre. The EEG shows peaks at
      the beat and metre frequencies in the frequency spectrum, interpreted as neural entrainment to the perceived beat.
    zh: 被试聆听节奏性声音模式或音乐，有时同时想象某种节拍结构。脑电频谱在节拍和拍律频率处出现峰值，被解释为神经活动对所知觉节拍的夹带。
  markers:
  - MK.SSEP_beat
