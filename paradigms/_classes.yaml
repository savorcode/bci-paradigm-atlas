- id: SSR-FFR
  name:
    en: Frequency-following response (FFR)
    zh: 频率跟随响应
  family: steady_state
  description:
    en: Periodic sounds such as low-frequency tones or a consonant-vowel syllable are repeated many times. Phase-locked activity
      of the auditory brainstem and cortex follows the stimulus waveform and its fundamental frequency, so that the averaged
      response reproduces spectral and temporal features of the sound.
    zh: 反复呈现周期性声音，如低频纯音或辅音—元音音节。听觉脑干和皮层的锁相活动跟随刺激波形及其基频，使平均响应重现声音的频谱和时间特征。
  markers:
  - MK.FFR
  first_source:
    citation: Worden FG, Marsh JT. Frequency-following (microphonic-like) neural responses evoked by sound. Electroencephalography
      and Clinical Neurophysiology. 1968;25(1):42-52.
    doi: 10.1016/0013-4694(68)90085-0
    pmid: '4174782'
    year: 1968
    verified: false
  aliases:
  - FFR
  - complex ABR (cABR)
  - envelope following response
  - speech-ABR
  - cABR
  - speech ABR
  - speech-evoked FFR
  - /da/ FFR
  notes: 'migrated from schema-0.1 file SSR-FFR-001; sprint 2 (D-057): aliases updated from curation/work/pkg_A/sprint2/class_updates.yaml
