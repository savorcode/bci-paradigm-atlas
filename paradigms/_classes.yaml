- id: SSR-RVS
  name:
    en: Rhythmic visual stimulation (alpha entrainment)
    zh: 节律性视觉刺激（α 夹带）
  family: steady_state
  description:
    en: A rhythmic visual stream at or near the alpha frequency precedes a near-threshold target presented at different phases
      relative to the rhythm. Entrained alpha oscillations persist briefly after the stream, and target detection varies with
      the phase of the entrained rhythm.
    zh: 在接近阈限的靶刺激之前呈现处于或接近 α 频率的节律性视觉刺激流，靶刺激相对于节律处于不同相位。被夹带的 α 振荡在刺激流结束后短暂持续，靶检测率随夹带节律的相位而变化。
  markers:
