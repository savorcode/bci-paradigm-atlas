- id: PER-VMMN
  name:
    en: Visual mismatch negativity
    zh: 视觉失匹配负波
  family: perception
  description:
    en: Frequent standard visual stimuli are interrupted by rare deviants (for example in colour, orientation or facial expression)
      while the participant performs an unrelated task. Deviants elicit a posterior negativity at roughly 150-350 ms, the
      visual mismatch negativity, considered the visual counterpart of the auditory MMN.
    zh: 被试执行无关任务时，高频标准视觉刺激中穿插低频偏差刺激（如颜色、朝向或面部表情的变化）。偏差刺激在约 150–350 ms 诱发后部负波，即视觉失匹配负波，被视为听觉 MMN 的视觉对应物。
  markers:
