- id: STA-HYPN
  name:
    en: Hypnotic induction
    zh: 催眠诱导
  family: state
  description:
    en: Highly and low hypnotizable participants listen to a standardized hypnotic induction and are compared with rest or
      control conditions such as memory recall. The hypnotic state is accompanied by reduced dorsal anterior cingulate activity
      and altered connectivity between prefrontal cortex and the default mode network.
    zh: 高、低催眠易感性的被试聆听标准化的催眠诱导，并与静息或对照条件（如记忆回忆）比较。催眠状态伴随背侧前扣带活动降低，以及前额叶与默认模式网络之间连接的改变。
