schema_version: '0.2'
id: SOC-DIAL-001
class: SOC-DIAL
name:
  en: Face-to-face dialogue versus monologue with fNIRS hyperscanning
  zh: 面对面对话与独白对比（fNIRS 超扫描）
aliases:
- conversational turn-taking
- natural dialogue hyperscanning
- face-to-face communication
- dialogue hyperscanning
- verbal communication hyperscanning
family: social
bci_category:
- none
recording_modality:
- fNIRS
- EEG
stimulus_modality:
- auditory
- visual
- naturalistic
markers:
- MK.interbrain_synchrony
description:
  en: Pairs of acquainted participants talk freely about a given topic, taking turns as in everyday conversation, while
    the brain activity of both is recorded simultaneously. Dialogue is compared with monologue (one partner narrates, the
    other listens) and with seated back to back, so that turn-taking and visual contact can be separated. Inter-brain synchrony
    of the left inferior frontal cortex increases only during face-to-face dialogue.
  zh: 相互认识的两名被试围绕给定话题自由交谈，像日常对话一样轮流发言，同时记录双方的脑活动。对话与独白（一人讲述、另一人倾听）对比，并设背对背就座条件，以区分话轮交替与视觉接触的作用。左侧额下回的脑间同步仅在面对面对话中增强。
trial_structure:
  phases:
  - name: resting baseline
    duration_ms: 180000
    note: eyes closed, before the task sessions
  - name: rest (start of session)
    duration_ms: 30000
  - name: communication task
    duration_ms: 600000
    note: one condition per session; the central 500 s were analysed
  - name: rest (end of session)
    duration_ms: 30000
  typical_trials: 4 sessions (one per condition), order counterbalanced across pairs
  conditions:
  - face-to-face dialogue
  - face-to-face monologue
  - back-to-back dialogue
  - back-to-back monologue
protocol:
  n_classes: 4
  classes:
  - face-to-face dialogue
  - face-to-face monologue
  - back-to-back dialogue
  - back-to-back monologue
  cue: topic instruction (current news for dialogue, personal experience for monologue); unscripted speech between partners
  stimulus_coding: 2 x 2 design, interaction (dialogue / monologue) x visual contact (face-to-face / back-to-back)
  paradigm_timing: block
  feedback: none
  distinguishing: 标准配置（最早发表，即 first_source）：熟识的二人自由对话，与独白及背对背条件形成 2×2 设计，各条件 10 分钟组块，fNIRS 同时记录左侧额颞顶区（Jiang et al. 2012）。
first_source:
  citation: Jiang J, Dai B, Peng D, Zhu C, Liu L, Lu C. Neural synchronization during face-to-face communication. Journal
    of Neuroscience. 2012;32(45):16064-16069.
  doi: 10.1523/jneurosci.2926-12.2012
  year: 2012
  verified: false
variants:
- name: Question-answer turn-taking with EEG (single brain)
  source:
    citation: Bögels S, Magyari L, Levinson SC. Neural signatures of response planning occur midway through an incoming
      question in conversation. Scientific Reports. 2015;5:12881.
    doi: 10.1038/srep12881
    year: 2015
    verified: false
  note: Turn-taking studied in one participant answering recorded quiz questions, with the answer either available early
    or only at the end of the question; EEG locks to the point where the answer can be planned. Not a hyperscanning design;
    may warrant its own serial number (criteria 1;3) once its protocol is checked.
interop:
  bids_task: dialogue
notes: 'Sources: Jiang et al. 2012 (first_source; 10 pairs, ETG-4000 fNIRS, 20 channels over left frontal, temporal and
  parietal cortex plus 3 over dorsolateral prefrontal cortex, 10 Hz; timing in trial_structure taken from the article''s
  methods). Bibliographic data from the OpenAlex API (Crossref request rate-limited; the DOI recalled at first, 10.1523/JNEUROSCI.1191-12.2012,
  did not resolve and was replaced by the OpenAlex record). Bögels et al. 2015 (Crossref API) is a single-brain EEG study
  of turn-taking kept as a variant pending review. The conversation-analysis origin of turn-taking (Sacks, Schegloff & Jefferson
  1974) was not retrieved and is not cited. Class name provisional ID SOC-CONV changed to SOC-DIAL to avoid confusion with
  SOC-CONF (conformity). Related: SOC-JA (joint action hyperscanning, alias ''hyperscanning''), SOC-EYE (live eye contact
  hyperscanning), LAN-NAT-001 (listening to natural speech; MK.speech_envelope_tracking could be added once speaker-listener
  tracking during live dialogue is sourced). [curator_e sprint 6, 2026-10-16]'
status: draft
contributors:
- curator_e
