schema_version: '0.2'
id: SOC-PAIN-001
class: SOC-PAIN
name:
  en: Empathy for pain
  zh: 疼痛共情
aliases:
- empathy for pain paradigm
- pain empathy
- vicarious pain
family: social
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.LPP
- MK.BOLD_anterior_insula
description:
  en: With a partner present, symbolic cues indicate whether the participant or the partner is about to receive painful or
    non-painful stimulation, so that pain to self and observed pain to the other can be compared. Observed pain increases
    anterior insula BOLD.
  zh: 伴侣在场，符号线索提示即将接受疼痛或非疼痛刺激的是被试本人还是伴侣，从而比较自身疼痛与他人疼痛。观察他人疼痛增强前岛叶 BOLD。
protocol:
  n_classes: 4
  classes:
  - painful stimulation to self
  - non-painful stimulation to self
  - painful stimulation to partner
  - non-painful stimulation to partner
  cue: symbolic visual cues indicating who receives painful or non-painful stimulation, with the partner present
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): cue-based self/other pain paradigm
    with a present partner (lead R0920). Differs from SOC-PAIN-002 (pictures of body parts in painful situations).'
first_source:
  citation: Singer T, Seymour B, O'Doherty J, Kaube H, Dolan RJ, Frith CD. Empathy for pain involves the affective but not
    sensory components of pain. Science. 2004;303(5661):1157-1162.
  doi: 10.1126/science.1093535
  pmid: '14976305'
  year: 2004
  verified: false
interop:
  bids_task: painempathy
notes: 'Lead refs (curation/literature.csv): R0919 [method], R0920 [first_source_candidate], R0982 [review], R0984 [review].
  R0982 meta-analysis flags methodological heterogeneity of ERP pain-empathy studies. First-pass skeleton (curator_e, 2026-10-03);
  all sources unverified. Sprint 2 (curator_e, 2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv.
  Sprint 3 (curator_d, 2026-10-05): bibliography corrected (OpenAlex, 2026-10-05): doi, authors, year, volume, issue, pages
  added.'
status: draft
contributors:
- curator_e
