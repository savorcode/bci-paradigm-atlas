schema_version: '0.2'
id: SOC-JA-001
class: SOC-JA
name:
  en: Joint action and interpersonal coordination
  zh: 联合动作与人际协调
aliases:
- coordinated tapping
- interpersonal synchronization
- joint action
- hyperscanning
- dual-EEG
- inter-brain synchrony paradigm
- two-person neuroscience
- hyperscanning cooperation
family: social
bci_category:
- none
recording_modality:
- EEG
- fNIRS
stimulus_modality:
- motor_execution
- visual
- auditory
markers:
- MK.SMR_ERD
- MK.interbrain_synchrony
description:
  en: Two or more participants coordinate their movements toward a shared goal, for example synchronised finger tapping, joint
    button presses or ensemble playing, often while both brains are recorded simultaneously. Coordination modulates sensorimotor
    rhythms and is accompanied by inter-brain synchrony between partners.
  zh: 两名或多名被试为共同目标协调动作，例如同步手指敲击、联合按键或合奏，通常同时记录双方的脑活动。协调过程调制感觉运动节律，并伴随同伴之间的脑间同步。
protocol:
  n_classes: 2
  classes:
  - partners see each other's movements
  - vision of partner blocked
  cue: partner's finger movements visible or occluded
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): dyadic rhythmic finger movements
    with and without vision of the partner (Kelso et al., phi complex, R1172).'
first_source:
  citation: Tognoli E, Lagarde J, DeGuzman GC, Kelso JAS. The phi complex as a neuromarker of human social coordination. Proceedings
    of the National Academy of Sciences. 2007;104(19):8190-8195.
  doi: 10.1073/pnas.0611453104
  year: 2007
  verified: false
variants:
- name: 'Hyperscanning: cooperative interaction tasks recorded simultaneously from two brains'
  source:
    citation: 'Montague P. Hyperscanning: simultaneous fMRI during linked social interactions. NeuroImage. 2002;16(4):1159-1164.'
    doi: 10.1006/nimg.2002.1150
    year: 2002
    verified: false
  note: 'Merged candidate SOC-HYP-001 (D-021). R0227 lacks authors in literature.csv (task sheet: Montague et al., fMRI).
    Sprint 3 (curator_d, 2026-10-05): bibliography corrected (Crossref, 2026-10-05): doi, author, issue added. [maintainer
    sprint 3, 2026-10-07, D-073] origin candidate recalled, record confirmed via Crossref.'
interop:
  bids_task: jointaction
notes: 'Lead refs (curation/literature.csv): R0963 [method], R1061 [method], R0227 [first_source_candidate; via merged SOC-HYP-001],
  R0841 [method; via merged SOC-HYP-001], R0953 [review; via merged SOC-HYP-001], R0964 [method; via merged SOC-HYP-001],
  R1042 [review; via merged SOC-HYP-001]. Sources found by curator_e (curation/work/pkg_E/search_log.md): S06 = https://ordb.biotech.ttu.edu/ORDB/Data/139136.
  first_source note: ORDB lists year 2006 and author order Kelso-first; PNAS vol. 104 suggests 2007 with Tognoli as first
  author. Year left blank pending verification. Name extended per D-021. Existing leads R0963, R1061 are method papers; S06
  found by curator_e (year conflict, see source note). First-pass skeleton (curator_e, 2026-10-03); all sources unverified.
  Sprint 2 (curator_e, 2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv. The hyperscanning
  variant is kept as a variant: dual-brain recording is a recording configuration, not a numbering criterion (D-021, D-057);
  the cited study (R0227) does not define a single task configuration. Sprint 3 (curator_d, 2026-10-05): bibliography corrected
  (OpenAlex, 2026-10-05): author order (Tognoli first, Kelso last), doi, year, issue added. [maintainer sprint 3, 2026-10-07,
  D-073] origin candidate recalled, record confirmed via OpenAlex.'
