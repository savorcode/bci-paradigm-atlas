schema_version: '0.2'
id: SOC-CYB-001
class: SOC-CYB
name:
  en: Cyberball social exclusion
  zh: 网络传球社会排斥（Cyberball）
aliases:
- Cyberball
- ostracism paradigm
- social exclusion
family: social
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.P3b
- MK.BOLD_dACC
description:
  en: Participants play a virtual ball-tossing game with ostensible co-players who first include them and then stop passing
    the ball to them. Exclusion is associated with dorsal anterior cingulate BOLD, and ball-receipt events in EEG elicit P3b
    differences between inclusion and exclusion.
  zh: 被试与名义上的其他玩家进行虚拟传球游戏，其他玩家先接纳被试，随后不再把球传给被试。排斥阶段伴随背侧前扣带 BOLD 变化；在脑电中，接球事件诱发的 P3b 在接纳与排斥条件间不同。
protocol:
  n_classes: 2
  classes:
  - inclusion
  - exclusion
  cue: virtual ball-tossing game with two ostensible co-players
  paradigm_timing: block
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): Cyberball inclusion followed by exclusion
    (Williams, Cheung & Choi 2000, sprint-2 F06).'
first_source:
  citation: 'Williams KD, Cheung CKT, Choi W. Cyberostracism: effects of being ignored over the Internet. Journal of Personality
    and Social Psychology. 2000;79(5):748-762.'
  doi: 10.1037/0022-3514.79.5.748
  year: 2000
  verified: false
interop:
  bids_task: cyberball
