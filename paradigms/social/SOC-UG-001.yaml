schema_version: '0.2'
id: SOC-UG-001
class: SOC-UG
name:
  en: Ultimatum game
  zh: 最后通牒博弈
aliases:
- UG
- Ultimatum Game
- fairness paradigm
- ultimatum bargaining
family: social
bci_category:
- none
recording_modality:
- EEG
- fMRI
stimulus_modality:
- visual
markers:
- MK.FRN
- MK.BOLD_anterior_insula
description:
  en: A proposer offers a split of a sum of money and the responder accepts it, so both are paid, or rejects it, so neither
    is paid. Unfair offers increase anterior insula BOLD and elicit a larger medial frontal negativity (FRN) than fair offers.
  zh: 提议者提出一笔钱的分配方案，回应者接受则双方按方案获得报酬，拒绝则双方都得不到。不公平提议比公平提议引起更强的前岛叶 BOLD，并诱发更大的内侧额叶负波（FRN）。
protocol:
  n_classes: 2
  classes:
  - fair offer
  - unfair offer
  cue: proposer's offer displayed to the responder, who accepts or rejects
  paradigm_timing: synchronous
  feedback: none
  distinguishing: 'Standard configuration (earliest published or canonical; D-057 -001): single-round responder decisions
    (Guth et al. 1982, R0054).'
first_source:
  citation: Güth W, Schmittberger R, Schwarze B. An experimental analysis of ultimatum bargaining. Journal of Economic Behavior
    & Organization. 1982;3(4):367-388.
  doi: 10.1016/0167-2681(82)90011-7
  year: 1982
  verified: false
interop:
  bids_task: ultimatum
notes: 'HED task page: https://www.hedtags.org/hed-task/tasks/hedtsk_ultimatum_game.html. Lead refs (curation/literature.csv):
  R0054 [key_reference], R0264 [first_source_candidate;key_reference], R0296 [further_reference], R0619 [review], R0653 [review],
  R0902 [method], R1073 [method]. R0264 (Sanfey et al. 2003) is the neuroimaging first_source candidate. First-pass skeleton
  (curator_e, 2026-10-03); all sources unverified. Sprint 2 (curator_e, 2026-10-03): protocol block added per D-057; see curation/work/pkg_E/sprint2/split_log.csv.
  First neural recording: Sanfey et al. 2003, The neural basis of economic decision-making in the Ultimatum Game (R0264).
  Sprint 3 (curator_d, 2026-10-05): bibliography corrected (OpenAlex, 2026-10-05): volume, issue, pages added, author spelling
  (Güth).'
